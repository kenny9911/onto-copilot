<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OntoCopilot</title>
<script>
// 主题防闪烁：在样式生效前就把 data-theme 打到根元素上，避免深色模式用户先看一闪浅色。
// 'system' 不打这个属性 —— 留给下面的 @media (prefers-color-scheme) 接管。
(function(){
  try{
    var t = localStorage.getItem("oc_theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<style>
html{font-size:13.5px}
:root{
  --bg:#faf9f7; --panel:#fff; --line:#e9e7e1; --line-soft:#f0eee9;
  --ink:#1c1c1a; --ink-2:#6b6862; --ink-3:#9d998f;
  --accent:#2f6b4f; --accent-tint:#e9f0ea; --accent-line:#c9dccf;
  --warn:#8a6d1f; --warn-tint:#fdf6e3; --warn-line:#ecdcae;
  --danger:#9c3b32; --danger-tint:#fbeeec; --btn:#16150f;
  /* 深色模式需要的补充 token：悬停底色、滚动条、"次级面板"背景 */
  --hover:#f2f0eb; --hover-2:#eeece6; --thumb:#dedbd3; --shadow-edge:rgba(0,0,0,.10); --panel-soft:#fdfcfa;
  /* 发送框的立体层次。三层阴影各有分工：贴边那层定轮廓，中距柔影给厚度，
     远距扩散影把整块从纸面上托起来。--comp-inset 是顶边那道内高光 ——
     缺了它，再多层阴影也只是"下面有影子"，不是"这块是浮起来的"。 */
  --comp-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px -2px rgba(0,0,0,.05),0 14px 28px -10px rgba(0,0,0,.10);
  --comp-shadow-lift:0 1px 2px rgba(0,0,0,.05),0 8px 18px -3px rgba(0,0,0,.07),0 22px 44px -12px rgba(0,0,0,.14);
  --comp-inset:inset 0 1px 0 rgba(255,255,255,.75);
  --glow-ring:rgba(47,107,79,.07); --glow-halo:rgba(47,107,79,.20);
  /* 缓动曲线全站只定义这一组。动画像不像出自同一只手，靠的就是曲线统一 ——
     一处 ease、一处 linear、一处 cubic-bezier 各写各的，整体就散了。
     --ease 收尾稍快，用于 hover/按下这类要跟手的反馈；--ease-out 收尾很慢
     （几乎不回弹），用于面板收展、气泡入场这类"大块头移动"。 */
  --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --dur:.16s; --dur-2:.24s;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* 对话栏宽度。以前写死 680px —— 在 1500px 的主区里两边各空 410px，
     而正文只占不到一半。920px 中文约 68 字一行，仍在舒服的阅读区间里。
     栏宽只定义一次，输入框和动作条都跟着它，改一个数三处一起动。 */
  /* 对话栏宽度。以前写死 680px —— 在 1800px 的主区里两边各空 560px，正文只占
     不到四成，而一张五列的表被压在里面怎么排都是挤的。
     加宽到 1080px 之后表格能整张放下，正文仍按 78% 收在 840px 左右（中文约 62
     字一行，还在舒服的区间）。
     **所有内容共用这一栏**：表格不再向两侧撑出去。撑出去的那一版表格答复比纯文字
     答复多探出 125px，两条回答的左边界对不齐 —— 左边界是读者的锚点，错开一点
     整页就散了。宽度差异只体现在右边，左边永远齐。 */
  --col:1080px;
}
/* 深色配色：系统跟随 + 显式切换两条路径都要覆盖同一组 token。
   --btn 刻意没有做成浅色 —— 气泡/按钮上硬编码的是白字，按钮底色只能选深色系。 */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --panel:#242320; --line:#3a382f; --line-soft:#2c2b26;
    --ink:#ece9e2; --ink-2:#a8a398; --ink-3:#78746a;
    --accent:#4fae7f; --accent-tint:#1f3229; --accent-line:#35543f;
    --warn:#d8b04a; --warn-tint:#332a13; --warn-line:#5c4c22;
    --danger:#e08579; --danger-tint:#3a201c; --btn:#4a4842;
    --hover:#2c2b26; --hover-2:#33322b; --thumb:#4a473e; --shadow-edge:rgba(0,0,0,.5); --panel-soft:#201f1c;
  /* 深色下阴影要更黑更远才看得出层次（深底上浅影等于没影），内高光反过来要压到
     极淡的白——照搬浅色那道 .75 的白线，深色里就是一条刺眼的亮边。 */
  --comp-shadow:0 1px 2px rgba(0,0,0,.32),0 4px 12px -2px rgba(0,0,0,.36),0 14px 30px -10px rgba(0,0,0,.5);
  --comp-shadow-lift:0 1px 2px rgba(0,0,0,.36),0 8px 20px -3px rgba(0,0,0,.44),0 24px 48px -12px rgba(0,0,0,.62);
  --comp-inset:inset 0 1px 0 rgba(255,255,255,.05);
  --glow-ring:rgba(79,174,127,.10); --glow-halo:rgba(79,174,127,.26);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1a18; --panel:#242320; --line:#3a382f; --line-soft:#2c2b26;
  --ink:#ece9e2; --ink-2:#a8a398; --ink-3:#78746a;
  --accent:#4fae7f; --accent-tint:#1f3229; --accent-line:#35543f;
  --warn:#d8b04a; --warn-tint:#332a13; --warn-line:#5c4c22;
  --danger:#e08579; --danger-tint:#3a201c; --btn:#4a4842;
  --hover:#2c2b26; --hover-2:#33322b; --thumb:#4a473e; --shadow-edge:rgba(0,0,0,.5); --panel-soft:#201f1c;
  /* 深色下阴影要更黑更远才看得出层次（深底上浅影等于没影），内高光反过来要压到
     极淡的白——照搬浅色那道 .75 的白线，深色里就是一条刺眼的亮边。 */
  --comp-shadow:0 1px 2px rgba(0,0,0,.32),0 4px 12px -2px rgba(0,0,0,.36),0 14px 30px -10px rgba(0,0,0,.5);
  --comp-shadow-lift:0 1px 2px rgba(0,0,0,.36),0 8px 20px -3px rgba(0,0,0,.44),0 24px 48px -12px rgba(0,0,0,.62);
  --comp-inset:inset 0 1px 0 rgba(255,255,255,.05);
  --glow-ring:rgba(79,174,127,.10); --glow-halo:rgba(79,174,127,.26);
}
:root[data-theme="light"]{
  --bg:#faf9f7; --panel:#fff; --line:#e9e7e1; --line-soft:#f0eee9;
  --ink:#1c1c1a; --ink-2:#6b6862; --ink-3:#9d998f;
  --accent:#2f6b4f; --accent-tint:#e9f0ea; --accent-line:#c9dccf;
  --warn:#8a6d1f; --warn-tint:#fdf6e3; --warn-line:#ecdcae;
  --danger:#9c3b32; --danger-tint:#fbeeec; --btn:#16150f;
  --hover:#f2f0eb; --hover-2:#eeece6; --thumb:#dedbd3; --shadow-edge:rgba(0,0,0,.10); --panel-soft:#fdfcfa;
  /* 发送框的立体层次。三层阴影各有分工：贴边那层定轮廓，中距柔影给厚度，
     远距扩散影把整块从纸面上托起来。--comp-inset 是顶边那道内高光 ——
     缺了它，再多层阴影也只是"下面有影子"，不是"这块是浮起来的"。 */
  --comp-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px -2px rgba(0,0,0,.05),0 14px 28px -10px rgba(0,0,0,.10);
  --comp-shadow-lift:0 1px 2px rgba(0,0,0,.05),0 8px 18px -3px rgba(0,0,0,.07),0 22px 44px -12px rgba(0,0,0,.14);
  --comp-inset:inset 0 1px 0 rgba(255,255,255,.75);
  --glow-ring:rgba(47,107,79,.07); --glow-halo:rgba(47,107,79,.20);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0rem;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:9px;border:2px solid var(--bg)}

.app{display:flex;height:100vh;min-width:720px;overflow-x:auto}
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.sidebar{width:230px;flex:0 0 230px;border-right:1px solid var(--line);background:var(--bg)}
.brand{position:relative;padding:24px 20px 4px}
.brand h1{font-family:var(--serif);font-size:1.4074rem;font-weight:400}
.brand .meta{font-family:var(--mono);font-size:0.7407rem;color:var(--ink-3);letter-spacing:.7px;margin-top:3px}
.sidebar-close{display:none;position:absolute;top:18px;right:12px;border:1px solid var(--line);border-radius:6px;
  padding:4px 7px;background:var(--panel);color:var(--ink-2);font-size:.7037rem}
.newchat{margin:16px 16px 18px;padding:9px;background:var(--btn);color:#fff;border-radius:8px;font-size:0.963rem;text-align:center}
.newchat:hover{opacity:.85}
.side-knowledge-entry{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:8px;width:calc(100% - 20px);margin:0 10px 12px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);text-align:left}
.side-knowledge-entry:hover:not([disabled]),.side-knowledge-entry.on{border-color:var(--accent-line);background:var(--accent-tint)}
.side-knowledge-entry[disabled]{cursor:not-allowed;opacity:.48}.side-knowledge-icon{display:grid;width:28px;height:28px;place-items:center;border-radius:7px;background:var(--hover);color:var(--accent);font-family:var(--mono)}
.side-knowledge-entry>span:last-child{display:flex;min-width:0;flex-direction:column}.side-knowledge-entry strong{font-size:.8148rem;font-weight:600}.side-knowledge-entry small{overflow:hidden;color:var(--ink-3);font-size:.6667rem;text-overflow:ellipsis;white-space:nowrap}
.sec{font-size:0.8148rem;color:var(--ink-3);padding:0 20px 8px;letter-spacing:.5px}
.convs{flex:1;overflow-y:auto;padding:0 10px}
.conv{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.conv:hover{background:var(--hover)}
.conv.on{background:var(--hover-2);box-shadow:inset 0 0 0 1px var(--line)}
.conv .t{font-size:0.963rem}
.conv .s{font-family:var(--mono);font-size:0.7778rem;color:var(--ink-3);margin-top:2px}
.side-foot{border-top:1px solid var(--line);padding:12px 20px 16px;font-size:0.8148rem;color:var(--ink-3)}
.side-foot .k{font-family:var(--mono);font-size:0.7407rem}

.main{flex:1 1 640px;min-width:520px;border-right:1px solid var(--line);position:relative}
.knowledge-page{display:none;min-height:0;flex:1;overflow:hidden;background:var(--bg)}
/* 知识库页面**保留对话输入框**：产品要求就是「在知识库里跟 Copilot 说话」，
   把 .comp 一起藏掉，那条路当场就断了。消息流仍然收起（知识库页是主内容），
   发出去之后由 knowledge-page 负责退回聊天，避免「说了话看不到回答」的死路。 */
body.knowledge-page-open .main>.stream,body.knowledge-page-open .main>.qbar{display:none!important}
body.knowledge-page-open .main>.comp{border-top:1px solid var(--line-soft)}
body.knowledge-page-open .knowledge-page{display:flex}
body.knowledge-page-open .preview,body.knowledge-page-open .pexpand{display:none!important}
body.knowledge-page-open .main{min-width:0;border-right:0}
.knowledge-page-shell{display:flex;width:100%;min-width:0;min-height:0;flex-direction:column;overflow:hidden}
.knowledge-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:24px 32px 18px;border-bottom:1px solid var(--line-soft);background:var(--panel)}
.knowledge-page-head span{color:var(--ink-3);font-size:.7407rem}.knowledge-page-head h1{margin-top:2px;font-size:1.5556rem;font-weight:600;letter-spacing:-.02em}.knowledge-page-head p{margin-top:4px;color:var(--ink-2);font-size:.8519rem}
.knowledge-page-body{min-height:0;flex:1;overflow:auto;padding:0 32px 40px}.knowledge-page-body>.odm-workspace{width:min(1240px,100%);margin:0 auto}
.odm-workspace{min-width:0}.odm-tabs{position:sticky;z-index:3;top:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:14px 0;border-bottom:1px solid var(--line-soft);background:color-mix(in srgb,var(--bg) 94%,transparent)}
/* 五个 Tab 收成「材料 / 已确认知识」两个轻量切换 —— 原来那五个是后端五个路由
   文件的镜像，不是用户的五件事。 */
.odm-switch{position:sticky;z-index:3;top:0;display:flex;gap:4px;padding:14px 0;border-bottom:1px solid var(--line-soft);background:color-mix(in srgb,var(--bg) 94%,transparent)}
.odm-switch button{padding:6px 14px;border:1px solid transparent;border-radius:99px;color:var(--ink-2);font-size:.8519rem}
.odm-switch button:hover{background:var(--hover)}
.odm-switch button.on{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent);font-weight:600}
/* 内部机器（处理任务/数据源/权限审计）默认折叠：仍然可达，但不挡在用户和材料之间。 */
.odm-advanced{margin-top:28px;padding-top:14px;border-top:1px solid var(--line-soft)}
.odm-advanced-toggle{padding:4px 0;color:var(--ink-3);font-size:.7407rem}
.odm-advanced-toggle:hover{color:var(--ink-2)}
.odm-advanced-body{display:flex;flex-direction:column;gap:16px;padding-top:14px}
/* 页头的层级切换：公共 / 当前项目。两个胶囊，没有别的。 */
.kp-title{display:flex;align-items:center;gap:12px}
.kp-level{display:flex;gap:3px;padding:2px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.kp-level button{padding:3px 12px;border-radius:99px;color:var(--ink-2);font-size:.7407rem}
.kp-level button:hover:not(:disabled){background:var(--hover)}
.kp-level button.on{background:var(--accent-tint);color:var(--accent);font-weight:600}
.kp-level button:disabled{color:var(--ink-3);cursor:default}
/* ── 文件树 + 预览 ───────────────────────────────────────────────
   两栏：左边是材料目录（分组＝标签，这是这个产品里材料本来就有的语义），
   右边是预览。点树里任意一份材料，正文和出处就在右边 —— 找东西和读东西
   共用同一个位置，不再多开一块。
   这一版之前是一张扁平表，再之前是一屏说明书。 */
.od-explorer{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:440px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.od-tree{display:flex;min-width:0;flex-direction:column;border-right:1px solid var(--line);background:var(--panel-soft)}
.od-tree-bar{display:flex;align-items:center;gap:2px;padding:8px 8px 4px}
.od-tree-bar button{width:26px;height:26px;border-radius:6px;color:var(--ink-2);font-size:.8519rem}
.od-tree-bar button:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.od-tree-bar button:disabled{color:var(--ink-3)}
.od-tree-pick{flex:1;min-width:0;max-width:118px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:.7037rem}
.od-tree-archived{display:flex;align-items:center;margin-left:auto}
.od-tree-search{padding:2px 8px 8px}
.od-tree-search input{width:100%;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:.7778rem}
.od-tree-search input:focus{border-color:var(--accent-line);outline:0}
.od-tree-body{flex:1;overflow:auto;padding:2px 0 8px}
.od-folder-head{display:flex;width:100%;align-items:center;gap:7px;padding:5px 10px;text-align:left}
.od-folder-head:hover{background:var(--hover)}
.od-folder-caret{width:10px;color:var(--ink-3);font-size:.7407rem}
.od-folder-name{flex:1;overflow:hidden;color:var(--ink);font-size:.8519rem;text-overflow:ellipsis;white-space:nowrap}
.od-folder-n{color:var(--ink-3);font-size:.6667rem}
.od-folder{position:relative}
.od-folder-acts{position:absolute;top:3px;right:6px;display:none;gap:2px}
.od-folder:hover .od-folder-acts{display:flex}
.od-folder-acts button{width:20px;height:20px;border-radius:5px;color:var(--ink-3);font-size:.7037rem}
.od-folder-acts button:hover{background:var(--hover-2);color:var(--ink)}
.od-move{max-width:150px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink-2);font-size:.7037rem}
.od-file{display:flex;width:100%;align-items:center;gap:7px;padding:4px 10px 4px 27px;text-align:left}
.od-file:hover{background:var(--hover)}
.od-file.on{background:var(--accent-tint)}
.od-file.on .od-file-name{color:var(--accent);font-weight:600}
.od-file.archived .od-file-name{color:var(--ink-3);text-decoration:line-through}
.od-file-name{flex:1;overflow:hidden;color:var(--ink-2);font-size:.8148rem;text-overflow:ellipsis;white-space:nowrap}
.od-file-dot{width:6px;height:6px;flex:none;border-radius:50%;background:var(--accent)}
.od-preview-pane{display:flex;min-width:0;flex-direction:column;overflow:auto;padding:14px 18px 18px}
.od-preview-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.od-preview-head strong{display:block;color:var(--ink);font-size:.9259rem}
.od-preview-head small{display:block;margin-top:2px;color:var(--ink-3);font-size:.7407rem}
.od-preview-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.od-preview-idle{display:flex;flex:1;align-items:center;justify-content:center;color:var(--ink-3);font-size:.8148rem}
.od-fm-status{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--line-soft);color:var(--ink-3);font-size:.7037rem}
@media (max-width:900px){.od-explorer{grid-template-columns:minmax(0,1fr)}.od-tree{border-right:0;border-bottom:1px solid var(--line)}}
/* 就地读全文。这是此前完全没有的入口。 */
.od-reader{display:flex;flex-direction:column;gap:12px;padding:12px 0 0}
.od-reader-chunk{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px dashed var(--line-soft)}
.od-reader-chunk:last-of-type{border-bottom:0;padding-bottom:0}
.od-reader-text{margin:0;color:var(--ink);font-size:.8519rem;line-height:1.65;white-space:pre-wrap}
.odm-tabs button{display:flex;min-width:0;flex-direction:column;align-items:flex-start;padding:9px 11px;border:1px solid transparent;border-radius:9px;color:var(--ink-2);text-align:left}
.odm-tabs button:hover{background:var(--hover)}.odm-tabs button.on{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.odm-tabs strong{font-size:.8519rem}.odm-tabs small{max-width:100%;overflow:hidden;margin-top:1px;color:var(--ink-3);font-size:.6667rem;text-overflow:ellipsis;white-space:nowrap}
.odm-panel{padding-top:20px}.odm-files,.odm-section{display:flex;min-width:0;flex-direction:column;gap:16px}.odm-files>.od-library{width:100%;margin:0}
.odm-card,.odm-boundary,.odm-form,.odm-job,.odm-source,.odm-wiki-page{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.odm-card{padding:16px}.odm-card-head,.odm-wiki-page>header,.odm-claim>header,.odm-job>header,.odm-source>header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.odm-card-head h3,.odm-wiki-page h3{font-size:1.037rem}.odm-card-head p,.odm-wiki-page>header p{margin-top:3px;color:var(--ink-3);font-size:.7778rem;line-height:1.5}
.odm-boundary{display:flex;align-items:center;gap:12px;padding:12px 14px;border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.odm-boundary strong{flex:0 0 auto;font-size:.8148rem}.odm-boundary span{color:var(--ink-2);font-size:.7778rem;line-height:1.5}

/* 额度提醒条：**常驻**，不是 toast。余额不足是"不处理就一直干不了活"的状态，
   一条飘过去三秒的提示等于没提示。挂在 mhead 下方、消息流上方，
   flex:0 0 auto 保证它挤的是消息流而不是自己被压扁。 */
/* `hidden` 属性靠的是浏览器默认样式 `[hidden]{display:none}`，而它的优先级
   **低于**这里的类选择器 —— 只写 display:flex 的话，paintQuotaBar 把 hidden
   设回 true 也关不掉：留在界面顶上的是一条 21px 高、没有任何文字的警告色横条，
   每个会话都挂着。用户看到的是"有个警告但读不出内容"。 */
.qbar[hidden]{display:none}
.qbar{flex:0 0 auto;display:flex;align-items:flex-start;gap:9px;padding:10px 22px;
  font-size:0.8889rem;line-height:1.55;border-bottom:1px solid var(--line-soft);
  background:var(--warn-tint);color:var(--warn)}
.qbar.bad{background:var(--danger-tint);color:var(--danger)}
.qbar .qtxt{flex:1;min-width:0}
.qbar b{font-weight:600}
/* 网关原文：给能看懂的人一个线索，但不能抢主文案的视线 */
.qbar .qraw{display:block;margin-top:3px;font-family:var(--mono);font-size:0.7407rem;
  opacity:.75;word-break:break-word}
.qbar .qact{border:1px solid currentColor;border-radius:6px;padding:3px 9px;
  font-size:0.8148rem;color:inherit;background:transparent;flex:0 0 auto}
.qbar .qact:hover{background:var(--hover)}
.qbar .qx{border:0;background:transparent;color:inherit;opacity:.6;
  font-size:1rem;line-height:1;padding:2px 4px;flex:0 0 auto}
.qbar .qx:hover{opacity:1}

.modetog button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}

.mdbody{line-height:1.62}
.mdbody strong{font-weight:600}
.mdbody .mdh{font-weight:600;margin:7px 0 2px}
.mdbody .mdl{margin:4px 0;padding-left:20px}
.mdbody .mdl .mdl{margin:2px 0}          /* 嵌套层：别再叠一层大间距 */
.mdbody .mdhr{border:0;border-top:1px solid var(--line);margin:10px 0}

.mdbody .mdcode{font-family:var(--mono);font-size:0.8889rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}
.mdbody .cur{display:inline-block;width:6px;height:1em;background:var(--ink-3);vertical-align:-2px;animation:blink 1s infinite;margin-left:1px}
/* 回答里的表格。**外面必须套一层能横向滚动的容器** —— 六列的调研问题表比聊天
   栏宽得多，不兜住的话整个页面会被撑出横向滚动条。 */
/* 右边还有内容**要看得出来**。表格宽过容器时才在两侧浮出一道阴影 ——
   纯 CSS：local 背景跟着内容滚（滚到头就把 scroll 那层盖住），scroll 背景钉在
   容器上。不加这个，被裁掉的两列就是彻底看不见，用户不会想到去横向拖。 */
.mdbody .mdtw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px;
  background:
    linear-gradient(to right,var(--panel) 40%,rgba(255,255,255,0)) left/22px 100% no-repeat local,
    linear-gradient(to left,var(--panel) 40%,rgba(255,255,255,0)) right/22px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%,var(--shadow-edge),rgba(0,0,0,0)) left/9px 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow-edge),rgba(0,0,0,0)) right/9px 100% no-repeat}
.mdbody .mdt{border-collapse:collapse;width:100%;font-size:0.9259rem}
.mdbody .mdt th,.mdbody .mdt td{padding:6px 9px;border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);text-align:left;vertical-align:top;
  /* 出处里那串 D7B299FF-46AF-4D3C-F136-153C73FD0DD4.png#p1 是一个不可断的长
     token，不给断词规则它会独自把一列顶到几百像素宽，把别的列挤没。 */
  overflow-wrap:anywhere;word-break:break-word;
  /* 最小 90px 保证窄列不糊成一条；最大 min(400px, 34vw) 防一列吃掉整张表。
     栏宽放开之后上限跟着抬一档，否则多出来的空间会被平摊成一堆半空的窄列。 */
  min-width:90px;max-width:min(400px,34vw)}
.mdbody .mdt th{background:var(--bg);font-weight:600;white-space:nowrap;position:sticky;top:0}
.mdbody .mdt tr:last-child td{border-bottom:0}
.mdbody .mdt th:last-child,.mdbody .mdt td:last-child{border-right:0}

   立体感不用做重也能立住。三层阴影 + 顶边内高光见 --comp-shadow 的注释。 */
.cbox{max-width:var(--col);margin:0 auto;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);padding:10px 12px 8px;position:relative;
  box-shadow:var(--comp-inset),var(--comp-shadow);
  transition:border-color .12s,box-shadow .3s var(--ease),transform .3s var(--ease)}
/* 绕边流光。做法是"渐变铺满 + 遮罩挖空中间"，只留下 1.5px 的一圈 ——
   注意**不能**用 z-index:-1 把渐变塞到本体背景底下：负层级的子元素会掉到
   最近的层叠上下文（这里是根元素）的最底层，直接被 .main 那层不透明的
   面板底色盖住，一点都看不见。遮罩法则是盖在上面，不碰层叠顺序。
   渐变里留了两段透明：光不是均匀一圈，而是两道彗尾在转，这才叫"流光"。 */
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg}
.cbox::before{content:"";position:absolute;inset:-1px;border-radius:15px;padding:1.5px;
  background:conic-gradient(from var(--ga),
    transparent 0%,var(--accent) 13%,var(--warn) 27%,transparent 42%,
    transparent 55%,var(--accent) 68%,var(--warn) 82%,transparent 97%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
/* 三档状态，各自说一件事：
   闲置 —— 光全灭，只剩阴影。写字的时候眼角不该有东西在闪。
   聚焦 —— 慢转 + 呼吸，表示"在听你说"。
   思考 —— 转速快三倍、亮到接近满，表示"它在跑"。这是唯一亮到抢眼的时刻，
           因为此时用户本来就在等，光就是进度的替身。 */
.cbox:focus-within{border-color:var(--thumb);transform:translateY(-1px);
  box-shadow:var(--comp-inset),var(--comp-shadow-lift),
             0 0 0 3px var(--glow-ring),0 10px 34px -10px var(--glow-halo)}
.cbox:focus-within::before{opacity:.5;animation:ga-spin 8s linear infinite,glow-breathe 3.6s ease-in-out infinite}
.cbox.thinking{transform:translateY(-1px);
  box-shadow:var(--comp-inset),var(--comp-shadow-lift),
             0 0 0 3px var(--glow-ring),0 12px 40px -10px var(--glow-halo)}
.cbox.thinking::before{opacity:.9;animation:ga-spin 2.4s linear infinite}
@keyframes ga-spin{to{--ga:360deg}}
@keyframes glow-breathe{0%,100%{opacity:.34}50%{opacity:.68}}
.crow{display:flex;align-items:center;gap:8px;margin-top:6px}
.cspacer{flex:1}
.cbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);font-size:1.1111rem;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cbtn:hover{background:var(--bg)}
.cbtn.go{background:var(--btn);color:#fff;border-color:var(--btn)}
.cbtn.go:hover{opacity:.85}
.cbtn.go[disabled]{background:var(--hover-2);color:var(--ink-3);border-color:var(--hover-2)}
/* 停止态：复用 go 的黑圆底，换成停止方块。语义是"停止生成"，故用 ■ 不用 ⏸。 */
.cbtn.stop{background:var(--btn);color:#fff;border-color:var(--btn);font-size:0.8148rem}
.cbtn.stop:hover{opacity:.85}
.cfiles{font-size:0.8519rem;color:var(--ink-3)}
/* 模型选择：跟 .cfiles 一个视觉重量，是输入框的附属信息，不该抢主按钮的注意力 */
.msel{font:inherit;font-size:0.8519rem;color:var(--ink-3);background:transparent;
  border:1px solid var(--line);border-radius:7px;padding:2px 6px;max-width:200px;cursor:pointer}
.msel:hover{background:var(--bg);color:var(--ink-2)}
.cbox.drag{border-color:var(--accent);background:var(--accent-tint)}
/* .cbox 是块级容器，不是 flex 行 —— 这里必须 width:100%。写 flex:1 的话
   textarea 会退回 cols 属性的默认宽度（约 20 字符），一句话就换行。 */
.cin{display:block;width:100%;box-sizing:border-box;font-size:0.9852rem;color:var(--ink);
     background:transparent;border:0;outline:0;resize:none;font-family:var(--sans);
     line-height:1.55;max-height:160px;padding:2px 0}
.cin::placeholder{color:var(--ink-3)}
.ghost2{background:var(--panel);color:var(--ink-2);border:1px solid var(--line)}
.ghost2:hover{background:var(--bg)}
.ghost2[disabled]{background:var(--hover);color:var(--ink-3);border-color:var(--line-soft)}
/* 对话气泡。用户靠右、助手靠左，和推理轨迹卡片区分开 —— 轨迹是系统在做事，
   气泡是人在说话，混在一起就分不出"我说过什么"了。 */
/* 节奏：同一方连说两句靠得近，**一问一答之间空得开** —— 上一版所有间距都是
   10px，六条消息糊成一片，眼睛找不到"回合"从哪儿开始。用户提问是每个回合的
   起点，所以加大的是它的上边距。 */
.bub{margin:18px 0;display:flex}
.bub.me{justify-content:flex-end;margin-top:46px}
/* 入场动画。**只加在 .in 上，不加在 .bub 上** —— render() 每次都是整段
   innerHTML 重画，全新的 DOM 节点；写在 .bub 上的话，每个轮询周期整屏气泡
   会一起重播一遍淡入，那不是动效是抽搐。谁该带 .in 由 JS 判定，见 markNew()。 */
.bub.in{animation:bub-in .34s var(--ease-out) both}
@keyframes bub-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.wrap > .bub:first-child{margin-top:4px}
/* min-width:0 是这里的关键。flex 子项默认 min-width:auto —— 它拒绝收缩到内容的
   固有最小宽度以下，于是一张宽表会把气泡整个撑爆 78% 的上限，而 .mdtw 上的
   overflow-x:auto 根本不会触发（它跟着内容一起变宽了）。这就是表格被截断、
   拖动侧栏也不重排的原因。 */
.bub .body{max-width:78%;min-width:0;padding:11px 15px;border-radius:12px;font-size:0.9852rem;
           line-height:1.7;white-space:pre-wrap;word-break:break-word}
/* 带表格的回答用满整栏。纯文字答复收在 78%（短回答的气泡才不会拖成一长条），
   带表格的要整栏 —— 两者的**左边界是同一条线**，只有右边不一样长。
   :has() 不支持的老浏览器退回 78%，只是窄一点，不会坏。 */
.bub:has(.mdtw) .body{max-width:100%}
/* 同一条回答里，表格用满整栏、段落收一收：1080px 一行是 80 个汉字，读到行尾
   就找不回下一行的开头。**只收右边，左边不动** —— 左边界仍和别的回答齐平。 */
.bub:has(.mdtw) .mdbody > p,.bub:has(.mdtw) .mdbody > .mdl{max-width:min(100%,900px)}
.bub.me .body{background:var(--btn);color:#fff;border-bottom-right-radius:3px}
.bub.oc .body{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}

  .main{min-width:440px}
  .preview{max-width:clamp(320px,calc(100vw - 670px),620px)}
  .sidebar.hidden~.preview{max-width:clamp(320px,calc(100vw - 440px),620px)}
}
/* 990px 以下原来没有任何断点：.app 的 min-width:720px + .main 的 min-width
   叠起来超过视口，.app 自己横向滚动，而**右栏是被推出去的那一个** ——
   项目上下文是工作面，不该藏在滚动条后面。
   宽度按「视口减掉左边两栏的下限」算，而不是按 vw 比例猜 —— 比例在中间那段
   （800~900px）正好会溢出几十像素，测出来才发现。 */
@media(max-width:990px){
  .app{min-width:0}
  .main{min-width:280px;flex:1 1 auto}
  .preview{width:min(440px,calc(100vw - 530px));flex:0 0 min(440px,calc(100vw - 530px));max-width:none}
  .sidebar.hidden~.preview{max-width:none}
}
@media(max-width:860px){
  /* 三栏塞不下时，会话列表由下面的 off-canvas 规则接管。 */
  .main{min-width:220px}
  .preview{width:min(420px,calc(100vw - 240px));flex:0 0 min(420px,calc(100vw - 240px))}
}

.ctx-section+.ctx-section{padding-top:16px;border-top:1px solid var(--line-soft)}
.ctx-section-title{font-size:.8889rem;font-weight:600;margin-bottom:8px;color:var(--ink)}
.ctx-empty{display:flex;min-height:240px;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px 18px;color:var(--ink-3)}
.ctx-empty-label{font-family:var(--mono);font-size:.7037rem;letter-spacing:.18em;margin-bottom:8px}
.ctx-empty-copy{max-width:300px;font-size:.8519rem;line-height:1.7}
.ctx-empty-inline{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--ink-3);font-size:.8148rem;background:var(--bg)}
.ctx-notice,.ctx-warning,.ctx-callout{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--bg);font-size:.8519rem;color:var(--ink-2)}
.ctx-warning,.ctx-row-warning{border-color:var(--warn-line);background:var(--warn-tint);color:var(--warn)}
.ctx-callout{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-callout>span{flex:1;min-width:0}.ctx-callout .ctx-empty-action{margin:0}
.ctx-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

.ctx-hero-card,.ctx-detail,.ctx-review-detail{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;
  box-shadow:0 1px 2px rgba(0,0,0,.025)}
.ctx-hero-meta,.ctx-review-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.ctx-badge,.ctx-status,.ctx-priority{display:inline-flex;align-items:center;min-height:24px;border-radius:6px;padding:2px 7px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink-2);font-size:.7407rem;font-weight:500;line-height:1.3}
.ctx-badge.confirmed,.ctx-badge.ready,.ctx-badge.released,.ctx-badge.answered,.ctx-status:not(.warning){border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-badge.warning,.ctx-badge.blocked,.ctx-badge.open,.ctx-badge.assigned,.ctx-status.warning,.ctx-priority.blocking,.ctx-priority.high{
  border-color:var(--warn-line);background:var(--warn-tint);color:var(--warn)}
/* 五个指标用 auto-fit 而不是写死两列：写死两列时最后一格会孤零零占半行，
   看上去像少了一个数。 */
.ctx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;margin-top:10px}
.ctx-stat{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px 10px;display:flex;flex-direction:column}
.ctx-stat strong{font-family:var(--mono);font-size:1.037rem;font-weight:600}
.ctx-stat span{font-size:.7037rem;color:var(--ink-3);margin-top:1px}
.ctx-hero-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ctx-hero-row .ctx-detail-title{font-family:var(--mono);font-size:1.037rem;letter-spacing:.04em}
.ctx-engagement{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.ctx-step{flex:0 0 auto;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);font-size:.7407rem;color:var(--ink-2)}
.ctx-step.done,.ctx-step.completed{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-step.running,.ctx-step.active{border-color:var(--warn-line);background:var(--warn-tint);color:var(--warn)}
.ctx-activity{display:flex;flex-direction:column}
.ctx-activity-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:.8148rem}
.ctx-activity-row:last-child{border-bottom:0}.ctx-activity-row small{color:var(--ink-3)}

/* 项目总览：先告诉人目前在哪、下一步做什么，再给工作区入口。旧版的五连指标、
   北极星四问和英文 Engagement 横条彼此抢层级，这里收敛为一条项目驾驶舱。 */
.ctx-project-dashboard{display:flex;flex-direction:column;gap:12px}
.ctx-project-dashboard>.ctx-section{margin-top:2px}.ctx-project-dashboard>.ctx-section+.ctx-section{padding-top:14px}
.ctx-project-hero{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.025)}
.ctx-project-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.ctx-project-hero-top>div:first-child{min-width:0}.ctx-project-hero .ctx-detail-title{font-size:1.1852rem}
.ctx-project-phase,.ctx-runtime-live{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;border:1px solid var(--accent-line);
  border-radius:999px;padding:4px 9px;background:var(--accent-tint);color:var(--accent);font-size:.7037rem;font-weight:600;white-space:nowrap}
.ctx-project-phase i,.ctx-runtime-live i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ctx-project-phase.running i,.ctx-runtime-live.running i{animation:pulse 1.4s ease-in-out infinite}
.ctx-project-meta{display:flex;align-items:center;gap:6px;margin-top:7px;color:var(--ink-3);font-family:var(--mono);font-size:.6852rem}
.ctx-project-meta .warn{color:var(--warn)}
.ctx-project-stage{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:17px}
.ctx-project-stage:before{content:"";position:absolute;left:10%;right:10%;top:13px;height:1px;background:var(--line)}
.ctx-project-stage-item{position:relative;z-index:1;display:flex;min-width:0;flex-direction:column;align-items:center;gap:5px;color:var(--ink-3);text-align:center}
.ctx-project-stage-item:hover{color:var(--ink)}
.ctx-project-stage-mark{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;border:1px solid var(--line);
  border-radius:50%;background:var(--panel);font-family:var(--mono);font-size:.6852rem}
.ctx-project-stage-item>span:last-child{display:flex;min-width:0;align-items:baseline;gap:4px}
.ctx-project-stage-item strong{font-size:.7407rem;font-weight:600}.ctx-project-stage-item small{font-family:var(--mono);font-size:.6296rem}
.ctx-project-stage-item.done,.ctx-project-stage-item.current{color:var(--accent)}
.ctx-project-stage-item.done .ctx-project-stage-mark{border-color:var(--accent);background:var(--accent);color:#fff}
.ctx-project-stage-item.current .ctx-project-stage-mark{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow-ring)}
.ctx-project-next{display:flex;align-items:flex-end;gap:15px;border:1px solid var(--accent-line);border-radius:14px;padding:15px;
  background:linear-gradient(135deg,var(--accent-tint),var(--panel))}
.ctx-project-next-copy{flex:1;min-width:0}.ctx-project-next-copy>strong{display:block;font-size:.963rem;line-height:1.45}
.ctx-project-next-copy>p{margin:5px 0 0;color:var(--ink-2);font-size:.7778rem;line-height:1.55}
.ctx-project-next-actions{display:flex;flex:0 0 auto;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ctx-project-next-actions .act{white-space:nowrap}.ctx-project-next-actions .ctx-empty-action{margin:0}
.ctx-project-workspaces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.ctx-project-workspace{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;min-width:0;padding:12px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-align:left}
.ctx-project-workspace:hover{border-color:var(--accent-line);background:var(--accent-tint)}
.ctx-project-workspace-label{font-size:.7407rem;color:var(--ink-2)}
.ctx-project-workspace>strong{grid-column:2;grid-row:1/3;align-self:center;font-family:var(--mono);font-size:1.2593rem;font-weight:600}
.ctx-project-workspace>small{max-width:180px;color:var(--ink-3);font-size:.6667rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-project-workspace>i{position:absolute;right:9px;bottom:6px;color:transparent;font-style:normal;font-size:.7407rem}
.ctx-project-workspace:hover>i{color:var(--accent)}
.ctx-project-counts{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}
.ctx-project-counts .ctx-stat{min-width:72px;flex-direction:row;align-items:baseline;justify-content:space-between;gap:7px;padding:6px 8px;background:var(--bg)}
.ctx-project-counts .ctx-stat strong{font-size:.8148rem}.ctx-project-counts .ctx-stat span{margin:0;font-size:.6667rem}
.ctx-project-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ctx-project-section-head .ctx-section-title{margin:0}.ctx-project-section-head .ctx-inline-action{margin:0;flex:0 0 auto}
.ctx-project-blocker-list{display:flex;flex-direction:column;gap:6px}
.ctx-project-blocker{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;padding:10px 11px;
  border:1px solid var(--warn-line);border-radius:9px;background:var(--warn-tint);color:var(--ink);text-align:left}
.ctx-project-blocker:hover{filter:brightness(1.01);border-color:var(--warn)}
.ctx-project-blocker-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.ctx-project-blocker>span:nth-child(2){display:flex;min-width:0;flex-direction:column;gap:2px}
.ctx-project-blocker strong{font-size:.7778rem;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-project-blocker small{color:var(--warn);font-size:.6296rem}.ctx-project-blocker>i{color:var(--warn);font-style:normal;font-size:1.1111rem}
.ctx-project-activity-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:8px;padding:8px 1px;border-bottom:1px solid var(--line-soft)}
.ctx-project-activity-row:last-child{border-bottom:0}.ctx-project-activity-row>span:nth-child(2){display:flex;min-width:0;flex-direction:column;gap:2px}
.ctx-project-activity-row strong{font-size:.7778rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-project-activity-row small{color:var(--ink-3);font-size:.6296rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-project-activity-row time{color:var(--ink-3);font-family:var(--mono);font-size:.6296rem}

/* 运行检查器。步骤摘要负责扫读；输入、输出、元数据与原始事件只在主动展开后进入
   DOM 视线，长内容在自己的滚动盒里，不再把聊天主线或整条侧栏撑到几万像素。 */
.ctx-runtime{display:flex;flex-direction:column;gap:12px}
.ctx-runtime-overview{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:15px}
.ctx-runtime-overview-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ctx-runtime-overview-head>div:first-child{min-width:0}.ctx-runtime-overview .ctx-detail-title{font-size:1.1111rem}
.ctx-runtime-overview p{margin:6px 0 0;max-width:480px;color:var(--ink-2);font-size:.7407rem;line-height:1.55}
.ctx-runtime-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:13px}
.ctx-runtime-metrics>div{display:flex;min-width:0;flex-direction:column;padding:8px;border:1px solid var(--line-soft);border-radius:8px;background:var(--bg)}
.ctx-runtime-metrics strong{font-family:var(--mono);font-size:1rem}.ctx-runtime-metrics span{color:var(--ink-3);font-size:.6296rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-runtime-metrics .warn strong,.ctx-runtime-metrics .warn span{color:var(--danger)}
.ctx-runtime-filters{padding:0}.ctx-runtime-run-list,.ctx-runtime-event-list,.ctx-runtime-steps{display:flex;flex-direction:column;gap:7px}
.ctx-runtime-ledger{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--accent-line);border-radius:12px;background:var(--accent-tint)}
.ctx-runtime-ledger-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ctx-runtime-ledger-head>div{display:flex;min-width:0;flex-direction:column;gap:2px}.ctx-runtime-ledger-head .ctx-section-title{margin:0}
.ctx-runtime-ledger-head small{color:var(--ink-2);font-size:.6667rem;line-height:1.45}
.ctx-ledger-run-list{display:flex;flex-direction:column;gap:7px}
.ctx-ledger-run{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.ctx-ledger-run[open]{border-color:var(--accent-line);box-shadow:0 1px 2px rgba(0,0,0,.025)}
.ctx-ledger-run.error{border-color:var(--warn-line)}
.ctx-ledger-run>summary{cursor:pointer;list-style:none}.ctx-ledger-run>summary::-webkit-details-marker{display:none}
.ctx-ledger-run>summary:hover{background:var(--hover)}
.ctx-ledger-run>.ctx-runtime-steps{padding:8px;border-top:1px solid var(--line);background:var(--panel-soft)}
.ctx-ledger-fidelity{display:inline-flex;flex:0 0 auto;border:1px solid var(--warn-line);border-radius:999px;padding:2px 6px;background:var(--warn-tint);color:var(--warn);font-size:.5926rem;white-space:nowrap}
.ctx-ledger-fidelity.full{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-ledger-redacted{margin-top:9px;padding:6px 8px;border:1px solid var(--warn-line);border-radius:7px;background:var(--warn-tint);color:var(--warn);font-size:.6296rem}
.ctx-runtime-run{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ctx-runtime-run-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line);background:var(--bg)}
.ctx-runtime-run-head>div{display:flex;min-width:0;flex-direction:column;gap:2px}.ctx-runtime-run-kicker{color:var(--accent);font-family:var(--mono);font-size:.6296rem;letter-spacing:.04em;text-transform:uppercase}
.ctx-runtime-run-head strong{font-size:.8148rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-runtime-run-head small{color:var(--ink-3);font-family:var(--mono);font-size:.6296rem}
.ctx-runtime-steps{padding:8px}
.ctx-runtime-step,.ctx-runtime-event{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.ctx-runtime-step[open],.ctx-runtime-event[open]{border-color:var(--accent-line)}
.ctx-runtime-step.error,.ctx-runtime-event.error{border-color:var(--warn-line)}
.ctx-runtime-step>summary,.ctx-runtime-event>summary{display:flex;align-items:center;gap:9px;min-height:48px;padding:8px 10px;cursor:pointer;list-style:none}
.ctx-runtime-step>summary::-webkit-details-marker,.ctx-runtime-event>summary::-webkit-details-marker,.ctx-runtime-raw>summary::-webkit-details-marker{display:none}
.ctx-runtime-step>summary:hover,.ctx-runtime-event>summary:hover{background:var(--hover)}
.ctx-runtime-index{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;flex:0 0 auto;border-radius:7px;background:var(--bg);
  color:var(--ink-3);font-family:var(--mono);font-size:.6667rem}
.ctx-runtime-step-main{display:flex;min-width:0;flex:1;flex-direction:column;gap:1px}.ctx-runtime-step-main strong{font-size:.7778rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-runtime-step-main small{color:var(--ink-3);font-family:var(--mono);font-size:.6296rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-runtime-status{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--ink-3);font-size:.6296rem;font-weight:600}
.ctx-runtime-status.done{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-runtime-status.running{border-color:var(--warn-line);background:var(--warn-tint);color:var(--warn)}
.ctx-runtime-status.error{border-color:var(--warn-line);background:var(--danger-tint);color:var(--danger)}
.ctx-runtime-step-body{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;border-top:1px solid var(--line-soft);background:var(--panel-soft)}
.ctx-runtime-block{margin-top:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.ctx-runtime-block.input{border-color:#c9d7e4}.ctx-runtime-block.output{border-color:var(--accent-line)}.ctx-runtime-block.error{border-color:var(--warn-line)}
.ctx-runtime-block-title{padding:6px 9px;border-bottom:1px solid var(--line-soft);background:var(--bg);color:var(--ink-2);font-size:.6667rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.ctx-runtime-block pre,.ctx-runtime-raw pre{max-height:420px;margin:0;padding:10px;overflow:auto;color:var(--ink-2);font-family:var(--mono);font-size:.6667rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
.ctx-runtime-block.metadata pre{max-height:300px;color:var(--ink-3)}
.ctx-runtime-raw{border:1px dashed var(--line);border-radius:8px;background:var(--bg)}
.ctx-runtime-raw>summary{padding:7px 9px;cursor:pointer;color:var(--ink-3);font-family:var(--mono);font-size:.6296rem;list-style:none}
.ctx-runtime-raw>summary:before{content:"＋";display:inline-block;width:15px}.ctx-runtime-raw[open]>summary:before{content:"－"}
.ctx-runtime-system{margin-top:3px}.ctx-runtime-system>.ctx-section-title{display:flex;align-items:baseline}
.ctx-runtime-event>summary time{flex:0 0 auto;color:var(--ink-3);font-family:var(--mono);font-size:.5926rem}
.ctx-runtime-dot{display:inline-block;width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--ink-3)}
.ctx-runtime-dot.done,.ctx-runtime-dot.ok{background:var(--accent)}.ctx-runtime-dot.running,.ctx-runtime-dot.run{background:var(--warn)}
.ctx-runtime-dot.error,.ctx-runtime-dot.err{background:var(--danger)}.ctx-runtime-dot.warn{background:var(--warn)}
.ctx-runtime-empty{min-height:300px}.ctx-runtime-empty .ctx-detail-title{margin-bottom:6px;font-size:1rem}
.ctx-runtime-step:focus-within,.ctx-runtime-event:focus-within,.ctx-project-workspace:focus-visible,.ctx-project-stage-item:focus-visible,
.ctx-project-blocker:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ctx-filters{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 9px;scrollbar-width:thin}
.ctx-filter{flex:0 0 auto;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink-2);font-size:.8148rem;padding:6px 10px}
.ctx-filter:hover{background:var(--hover);color:var(--ink)}
.ctx-filter.on{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent);font-weight:600}
.ctx-model-grid,.ctx-review-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.ctx-model-list,.ctx-review-queue,.ctx-file-list,.ctx-delivery-list{display:flex;flex-direction:column;gap:6px}
.ctx-model-list{max-height:280px;overflow-y:auto;padding-right:2px}
.ctx-model-item,.ctx-review-item,.ctx-file,.ctx-artifact{display:flex;width:100%;align-items:center;gap:10px;text-align:left;
  border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:10px;min-width:0;color:var(--ink);text-decoration:none}
.ctx-model-item:hover,.ctx-review-item:hover,.ctx-file:hover,.ctx-artifact:hover{border-color:var(--accent-line);background:var(--accent-tint)}
.ctx-model-item.on,.ctx-review-item.on,.ctx-file.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ctx-kind{flex:0 0 auto;min-width:42px;text-align:center;border-radius:6px;padding:4px 5px;background:var(--accent-tint);color:var(--accent);
  font-family:var(--mono);font-size:.6667rem;line-height:1.2}
.ctx-item-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx-item-main strong{font-size:.8889rem;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-item-main small{font-size:.7037rem;color:var(--ink-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-status{flex:0 0 auto}
.ctx-list-cap{border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--ink-3);font-size:.7037rem;line-height:1.55;padding:8px 9px}
.ctx-detail-header{display:flex;align-items:flex-start;gap:10px}.ctx-detail-header>div:first-child{flex:1;min-width:0}
.ctx-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:13px}
.ctx-fact{display:flex;flex-direction:column;padding:8px;border-radius:7px;background:var(--bg);border:1px solid var(--line-soft);min-width:0}
.ctx-fact span{font-size:.6667rem;color:var(--ink-3)}.ctx-fact strong{font-size:.8148rem;font-weight:500;overflow-wrap:anywhere}
.ctx-rows{display:flex;flex-direction:column}.ctx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:.8519rem}
.ctx-row:last-child{border-bottom:0}.ctx-row small{color:var(--ink-3)}
.ctx-attrs .ctx-attr{align-items:flex-start;padding:8px 4px;width:100%;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--line-soft);border-radius:6px;cursor:pointer;font:inherit;color:inherit}
.ctx-attrs .ctx-attr:hover,.ctx-attrs .ctx-attr:focus-visible{background:var(--accent-tint)}
.ctx-attrs .ctx-attr:hover .ctx-attr-main b::after{content:"　✎";color:var(--accent);font-weight:400}
.ctx-attr-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;min-width:0;flex:1}
.ctx-attr-main b{font-weight:600}
.ctx-attr-main code{font-family:var(--mono);font-size:.7037rem;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.ctx-attr-main em{flex-basis:100%;font-style:normal;font-size:.7778rem;color:var(--ink-2)}
.ctx-attr small{white-space:nowrap;flex:none}
.ctx-count{margin-left:6px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.ctx-gaps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ctx-gap{display:inline-flex;align-items:center;min-height:24px;border:1px solid var(--warn-line);border-radius:6px;
  background:var(--warn-tint);color:var(--warn);padding:2px 8px;font-size:.7778rem;cursor:pointer}
.ctx-gap:hover{border-color:var(--warn);filter:brightness(1.04)}
.ctx-gap::before{content:"⚠";margin-right:4px}
.ctx-badge.rejected,.ctx-status.rejected{border-color:var(--line);background:transparent;color:var(--ink-3);text-decoration:line-through}
.ctx-item-gaps{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;flex:none;
  border-radius:10px;background:var(--warn-tint);color:var(--warn);border:1px solid var(--warn-line);
  font-size:.7037rem;font-variant-numeric:tabular-nums;padding:0 5px;white-space:nowrap;font-size:.6852rem;padding:2px 6px}
/* 模型列表按类型分组：组头黏在滚动容器顶上，扫长列表时始终知道自己在看哪一类。 */
.ctx-model-group{display:flex;flex-direction:column;gap:6px}
.ctx-model-group-head{position:sticky;top:0;z-index:1;display:flex;align-items:baseline;gap:8px;
  padding:4px 2px;background:var(--bg)}
.ctx-model-group-head>strong{font-size:.7778rem;color:var(--ink-2)}
.ctx-model-group-head>span{font-family:var(--mono);font-size:.6852rem;color:var(--ink-3)}
/* 共有缺口只在组头下说一次 —— 行上重复几十遍同一个词等于没说。 */
.ctx-common-gaps{padding:6px 9px;border:1px dashed var(--line);border-radius:7px;background:var(--hover);
  color:var(--ink-2);font-size:.7407rem;line-height:1.5;margin-bottom:2px}
.ctx-filter.todo.on{border-color:var(--warn-line);background:var(--warn-tint);color:var(--warn)}
.ctx-cite-hit{box-shadow:0 0 0 2px var(--accent-line);border-radius:6px;background:var(--accent-tint)}
.ctx-search-wrap{display:flex;flex-direction:column;gap:6px}
.ctx-search-hits{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 2px}
.ctx-search-hit{display:inline-flex;align-items:center;gap:5px;min-height:24px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);padding:2px 8px;font-size:.7778rem;color:var(--ink-2);cursor:pointer}
.ctx-search-hit:hover{border-color:var(--accent-line);color:var(--accent)}
.ctx-search-hit.on{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-search-hit b{font-variant-numeric:tabular-nums}
.ctx-search-none{font-size:.7778rem;color:var(--ink-3)}
.ctx-viewer-text p{margin:0 0 10px}
.ctx-evidence-list{display:flex;flex-direction:column;gap:6px}
.ctx-evidence{display:flex;flex-direction:column;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px}
.ctx-evidence:hover{border-color:var(--accent-line);background:var(--accent-tint)}
.ctx-evidence-cite{font-family:var(--mono);font-size:.7037rem;color:var(--accent);overflow-wrap:anywhere}
.ctx-evidence-snippet{font-size:.7778rem;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.ctx-sticky-actions{position:sticky;bottom:-15px;margin:16px -15px -15px;padding:10px 15px 15px;border-top:1px solid var(--line);
  background:var(--panel);display:flex;gap:7px;flex-wrap:wrap;z-index:2}

.ctx-file{align-items:flex-start}.ctx-file-name{font-size:.8889rem;font-weight:600;overflow-wrap:anywhere}.ctx-file-meta{font-size:.7037rem;color:var(--ink-3)}
.ctx-file-issue{font-size:.7037rem;color:var(--warn);margin-top:3px}.ctx-source{margin-top:14px}
.ctx-context-back{margin-bottom:10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink-2);font-size:.7778rem;padding:5px 9px}
.ctx-context-back:hover{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-source-rows{display:flex;flex-direction:column;gap:6px}.ctx-source-row{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px;cursor:pointer}
.ctx-source-row:hover{border-color:var(--accent-line)}.ctx-source-cite{font-family:var(--mono);font-size:.6667rem;color:var(--accent);overflow-wrap:anywhere}
.ctx-source-copy{font-size:.7778rem;color:var(--ink-2);margin-top:3px;line-height:1.55;white-space:pre-wrap}

/* 审阅：左边是「还要问谁什么」的队列，右边是一张能当场做决定的卡。
   队列项刻意只留一行标题 + 一行归属 —— 期望答案那种长句读在队列里没人看，
   它属于回答框的 placeholder。 */
.ctx-review-queue-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
/* 队列是 flex 纵列：标题与筛选条是固定件，任何时候都不许被 flex 压扁 —— 拉宽
   侧栏时它们曾被挤成半截胶囊（2026-08-25 用户截图）。要收缩的是列表，不是它俩。 */
.ctx-review-queue>.ctx-filters,.ctx-review-queue>.ctx-review-queue-head{flex:0 0 auto}
.ctx-review-queue-head strong{font-size:.9259rem;font-weight:600}
.ctx-review-list{display:flex;flex-direction:column;gap:6px}
.ctx-review-domain{display:flex;flex-direction:column;gap:5px}.ctx-review-domain+ .ctx-review-domain{margin-top:8px;padding-top:9px;border-top:1px solid var(--line-soft)}
.ctx-review-domain>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.ctx-review-domain>header strong{font-size:.7407rem;font-weight:600;color:var(--ink-2)}
.ctx-review-domain>header span{font-family:var(--mono);font-size:.6667rem;color:var(--ink-3)}
.ctx-review-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px}
.ctx-review-dot{flex:0 0 auto;width:7px;height:7px;margin-top:5px;border-radius:50%;background:var(--ink-3)}
.ctx-review-dot.blocking{background:#c0453f}.ctx-review-dot.important{background:#c0902a}
.ctx-review-dot.completeness{background:var(--accent)}.ctx-review-dot.diagnostic{background:var(--ink-3)}
.ctx-review-item-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ctx-review-item-copy strong{font-size:.8148rem;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ctx-review-item-copy small{font-size:.6667rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-review-chevron{flex:0 0 auto;color:var(--ink-3);font-size:.9259rem;line-height:1}
.ctx-review-level{display:inline-flex;align-items:center;width:max-content;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:.6667rem;font-weight:650;letter-spacing:.02em;background:var(--panel);color:var(--ink-2)}
.ctx-review-level.blocking{border-color:#d5a3a0;background:#fbefee;color:#8c312c}.ctx-review-level.important{border-color:#d9be7d;background:#fff8e7;color:#795a13}
.ctx-review-level.completeness{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}.ctx-review-level.diagnostic{border-color:#c8c7c1;background:#f2f1ed;color:#55534e}
.ctx-review-role{display:inline-flex;align-items:center;border:1px solid var(--warn-line);border-radius:999px;padding:2px 8px;background:var(--warn-tint);color:var(--warn);font-size:.6667rem;font-weight:600}
.ctx-review-crumb{font-family:var(--mono);font-size:.6667rem;letter-spacing:.06em;color:var(--ink-3);margin-bottom:5px}
.ctx-review-detail-wrap{min-width:0}
.ctx-review-detail .ctx-detail-title{font-size:1.1111rem}
.ctx-review-detail .ctx-section:first-of-type{margin-top:14px}
/* 证据对照：两份材料并排，不是一串链接。看清「同一个口径两边写得不一样」是
   这一屏存在的全部理由。 */
.ctx-evidence-compare{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ctx-evidence-card{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.ctx-evidence-card:hover{border-color:var(--accent-line);background:var(--accent-tint)}
.ctx-evidence-card-head{font-size:.7407rem;font-weight:600;overflow-wrap:anywhere}
.ctx-evidence-card-cite{font-family:var(--mono);font-size:.6296rem;color:var(--accent);overflow-wrap:anywhere}
.ctx-evidence-card-body{margin-top:4px;font-size:.7407rem;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.ctx-impact-list{display:flex;flex-direction:column;gap:5px}
.ctx-impact-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.ctx-impact-row:hover{border-color:var(--accent-line);background:var(--accent-tint)}
.ctx-impact-label{flex:1;min-width:0;font-size:.8148rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-review-tools{display:flex;gap:12px;margin-top:6px}
.ctx-review-guide{margin-top:6px;padding:9px 10px;border:1px solid var(--accent-line);border-radius:8px;background:var(--accent-tint);color:var(--ink-2);font-size:.7778rem}
.ctx-review-options{display:flex;flex:1;gap:5px;flex-wrap:wrap;min-width:0}
.ctx-option{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink-2);font-size:.8148rem;padding:6px 11px}
.ctx-option:hover{border-color:var(--accent-line);color:var(--ink)}
.ctx-option.on{border-color:var(--accent);background:var(--accent-tint);color:var(--accent);font-weight:600}
.ctx-option[disabled]{opacity:.5}
.ctx-review-batch-members{display:flex;flex-direction:column;gap:5px;max-height:360px;overflow-y:auto}
.ctx-review-batch-member{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:start;gap:7px;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left;color:var(--ink)}
.ctx-review-batch-member:hover{border-color:var(--accent-line);background:var(--accent-tint)}.ctx-review-batch-member>span{font-family:var(--mono);font-size:.6296rem;color:var(--ink-3)}
.ctx-review-batch-member>strong{font-size:.7407rem;line-height:1.45}.ctx-review-batch-member>small{font-size:.6296rem;color:var(--ink-3);white-space:nowrap}
.ctx-field-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;margin-top:8px}
.ctx-review-answer{width:100%;min-height:84px;resize:vertical}.ctx-review-detail .qinput,.ctx-review-detail .qselect,.ctx-review-detail .qanswer{background:var(--bg)}
.ctx-artifact{align-items:center}.ctx-download-label{flex:0 0 auto;color:var(--accent);font-size:.7778rem;font-weight:600}
/* 交付页的文档行：一份文档一行，多种格式并排成入口。沿用 .ctx-artifact 的尺度，
   不引新的视觉语言 —— 变的是主次，不是长相。 */
.ctx-delivery-doc{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel)}
.ctx-delivery-doc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ctx-delivery-doc-title{font-size:.8519rem;line-height:1.4}
.ctx-delivery-doc-main>small{font-size:.6852rem;color:var(--ink-3)}
.ctx-delivery-formats{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ctx-format{border:1px solid var(--accent-line);border-radius:6px;background:var(--accent-tint);color:var(--accent);
  font-family:var(--mono);font-size:.6852rem;font-weight:600;padding:3px 7px}
.ctx-format:hover{background:var(--accent);color:var(--panel)}
.ctx-snapshot-toggle{align-self:flex-start;color:var(--ink-2);font-size:.7407rem;padding:5px 2px}
.ctx-snapshot-toggle:hover{color:var(--accent)}

/* Unified viewer. 紧凑栏采用 drill-in；只有明确进入宽屏后才同时保留目录和预览。 */
.ctx-model-toolbar{display:flex;align-items:flex-start;gap:8px;margin:0 0 6px}
.ctx-model-toolbar .ctx-filters{flex:1;min-width:0;padding-bottom:0}
.ctx-graph-open{flex:0 0 auto;white-space:nowrap;border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-empty-action{display:block;margin:14px auto 0}
/* 打开 viewer 时右栏交给 viewer 自己管高度：它内部滚，外层不滚。
   否则一份 5000px 的 JSON 会把整条侧栏拉长，而 .ctx-viewer-content 是一个
   「有 overflow:auto 却永远滚不动」的容器 —— 鼠标停在卡片上滚轮直接失效，
   只有移到最右边那条外层滚动条上才动得了。 */
.ctx-sidebar[data-viewer="1"] .ctx-body{display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
.ctx-sidebar[data-viewer="1"] .ctx-viewer,.ctx-sidebar[data-viewer="1"] .ctx-viewer-split{flex:1;min-height:0}
/* 画布在 viewer 里要吃满剩余高度：固定 clamp 高度会在长内容旁边留下一条死白边，
   在全屏下又矮得离谱。 */
.ctx-sidebar[data-viewer="1"] .ctx-viewer-content{display:flex;flex-direction:column}
.ctx-sidebar[data-viewer="1"] .ctx-graph{flex:1;min-height:0}
.ctx-sidebar[data-viewer="1"] .ctx-graph-viewport{flex:1;height:auto;min-height:220px}
.ctx-graph-notice{flex:0 0 auto}
.ctx-viewer-split{display:block;min-height:100%}
.ctx-viewer-directory{display:none;min-width:0}
.ctx-viewer{min-width:0;min-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ctx-viewer-head{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px 10px;
  padding:11px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ctx-viewer-back{align-self:start;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink-2);font-size:.7778rem;padding:5px 8px}
.ctx-viewer-back:hover{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.ctx-viewer-heading{min-width:0}.ctx-viewer-title{font-size:.9259rem;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-viewer-locator{font-family:var(--mono);font-size:.6667rem;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-viewer-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:6px}
.ctx-viewer-content{flex:1;min-height:0;padding:12px;overflow:auto;background:var(--panel-soft)}
.ctx-viewer-notice{margin-bottom:10px}
.ctx-viewer-error{max-width:560px;margin:20px auto;color:var(--ink-2);font-size:.8519rem;line-height:1.6}
.ctx-viewer-image-wrap{display:flex;align-items:center;justify-content:center;min-height:340px;border:1px solid var(--line);border-radius:9px;
  padding:12px;background:var(--panel);overflow:auto}
.ctx-viewer-image{display:block;max-width:100%;height:auto;object-fit:contain}
.ctx-viewer-pdf{display:block;width:100%;height:max(480px,65cqh);border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.ctx-viewer-sheets{display:flex;min-height:0;flex-direction:column;gap:14px}.ctx-viewer-sheet{display:flex;min-width:0;max-height:clamp(300px,58cqh,640px);flex-direction:column}
.ctx-viewer-table-wrap{position:relative;width:100%;max-width:100%;max-height:clamp(260px,54cqh,590px);overflow-x:auto;overflow-y:auto;
  overscroll-behavior-x:contain;scrollbar-gutter:stable both-edges;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.ctx-viewer-table-wrap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctx-viewer-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:.7778rem;line-height:1.45}
.ctx-viewer-table th,.ctx-viewer-table td{max-width:320px;padding:7px 9px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
.ctx-viewer-table th{position:sticky;top:0;z-index:2;background:var(--bg);color:var(--ink-2);font-weight:600;white-space:nowrap;
  box-shadow:0 1px 0 var(--line)}
.ctx-viewer-table tr:last-child td{border-bottom:0}.ctx-viewer-table th:last-child,.ctx-viewer-table td:last-child{border-right:0}
.ctx-viewer-document,.ctx-viewer-markdown{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px;
  color:var(--ink);font-size:.8889rem;line-height:1.75}
.ctx-viewer-document p{white-space:pre-wrap;overflow-wrap:anywhere}.ctx-viewer-document p:first-of-type{margin-top:0}.ctx-viewer-document p:last-child{margin-bottom:0}
.ctx-viewer-snippet{margin:0 0 16px;padding:9px 11px;border-left:3px solid var(--accent);background:var(--accent-tint);color:var(--ink-2);font-size:.8148rem}
.ctx-viewer-download-only{max-width:760px;margin:0 auto}.ctx-viewer-code{margin:0;min-height:180px;border:1px solid var(--line);border-radius:9px;
  padding:12px;background:var(--panel);color:var(--ink-2);font-family:var(--mono);font-size:.7407rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}

/* Workflow canvas. 边来自 live graph，canvas 只负责高效绘制；节点仍是可聚焦、可点击的语义按钮。 */
.ctx-graph{display:flex;min-height:0;flex-direction:column;gap:9px}
.ctx-graph-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ctx-graph-switch,.ctx-graph-zoom{display:flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.ctx-graph-switch button,.ctx-graph-zoom button,.ctx-graph-layers button{border-radius:6px;color:var(--ink-2);font-size:.7407rem;padding:5px 8px}
.ctx-graph-switch button:hover,.ctx-graph-zoom button:hover,.ctx-graph-layers button:hover{background:var(--hover);color:var(--ink)}
.ctx-graph-switch button.on,.ctx-graph-layers button.on{background:var(--accent-tint);color:var(--accent);font-weight:600}
.ctx-graph-direction button{white-space:nowrap}
.ctx-graph-zoom span{min-width:40px;padding:0 4px;color:var(--ink-3);font-family:var(--mono);font-size:.6667rem;text-align:right}
.ctx-graph-layers{display:flex;gap:5px;overflow-x:auto;padding-bottom:1px}.ctx-graph-layers button{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel)}
.ctx-graph-layers button.on{border-color:var(--accent-line)}
.ctx-graph-swatch{width:7px;height:7px;border-radius:2px;background:var(--ink-3)}
.ctx-graph-swatch.workflow{background:var(--accent)}.ctx-graph-swatch.action{background:#6f8fa8}
.ctx-graph-swatch.event{background:var(--warn)}.ctx-graph-swatch.object{background:#7c9a76}.ctx-graph-swatch.gateway{background:#a17bb0}
/* 手工连线只是本地草案，所以它有自己的一条可见清单：能删、能一次性送去对话确认。 */
.ctx-graph-drafts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 9px;border:1px dashed var(--accent-line);border-radius:9px;background:var(--accent-tint)}
.ctx-graph-drafts-label{font-size:.7037rem;font-weight:600;color:var(--accent)}
.ctx-graph-draft{display:inline-flex;align-items:center;gap:5px;padding:3px 4px 3px 8px;border:1px solid var(--accent-line);border-radius:999px;background:var(--panel);font-size:.7037rem;color:var(--ink-2)}
.ctx-graph-draft button{width:16px;height:16px;border-radius:50%;color:var(--ink-3);font-size:.7407rem;line-height:1}
.ctx-graph-draft button:hover{background:var(--hover-2);color:var(--ink)}
.ctx-graph-viewport{position:relative;height:clamp(360px,58cqh,620px);min-height:360px;overflow:hidden;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);background-image:radial-gradient(var(--line-soft) 1px,transparent 1px);background-size:22px 22px;
  cursor:grab;touch-action:none;user-select:none}
.ctx-graph-viewport:active{cursor:grabbing}.ctx-graph-world{position:relative;transform-origin:0 0;will-change:transform}
.ctx-graph-edges{position:absolute;inset:0;pointer-events:none}
/* 全屏是一层定位覆盖，不是浏览器 Fullscreen API：右栏本身还在 flex 布局里，
   真进 fullscreen 会把 container query 的参照系一起换掉。Esc 退出。 */
.ctx-graph-full{position:fixed;inset:0;z-index:60;gap:10px;padding:14px 16px;background:var(--panel-soft);overflow:auto}
.ctx-graph-full .ctx-graph-viewport{height:auto;flex:1;min-height:0}
.ctx-graph-full .ctx-graph-inspector{position:absolute;right:22px;bottom:22px;width:min(320px,38vw);box-shadow:0 8px 26px rgba(0,0,0,.16)}
.ctx-graph-fullscreen{font-weight:600;color:var(--accent)}
.ctx-graph-node{position:absolute;width:168px;min-height:62px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;
  font:inherit;cursor:grab;touch-action:none;
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.045)}
.ctx-graph-node:active{cursor:grabbing}
.ctx-graph-node:hover{border-color:var(--accent-line);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.ctx-graph-node-flag{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;background:var(--warn);color:#fff;font-family:var(--mono);font-size:.6296rem;font-weight:600}
.ctx-graph-port{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}
.ctx-graph-port.in{left:-6px}
.ctx-graph-port.out{right:-6px;cursor:crosshair;border-color:var(--accent-line);background:var(--accent-tint)}
.ctx-graph[data-layout-direction="TB"] .ctx-graph-port{top:auto;left:50%;right:auto;margin-top:0;margin-left:-5.5px}
.ctx-graph[data-layout-direction="TB"] .ctx-graph-port.in{top:-6px}
.ctx-graph[data-layout-direction="TB"] .ctx-graph-port.out{bottom:-6px}
.ctx-graph-port.out:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.ctx-graph-node.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow-ring)}
.ctx-graph-node.inferred{border-style:dashed;border-color:var(--warn-line);background:var(--warn-tint)}
.ctx-graph-node.workflow{border-color:var(--accent-line);background:var(--accent-tint)}
.ctx-graph-node.event{border-color:var(--warn-line)}
.ctx-graph-node-kind{font-family:var(--mono);font-size:.5926rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ctx-graph-node strong{display:block;width:100%;font-size:.7778rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-graph-node small{display:block;width:100%;margin-top:2px;color:var(--ink-3);font-family:var(--mono);font-size:.6296rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-graph-inspector{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:13px}
.ctx-graph-inspector-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ctx-viewer-back:focus-visible,.ctx-graph-switch button:focus-visible,.ctx-graph-zoom button:focus-visible,.ctx-graph-layers button:focus-visible,
.ctx-graph-node:focus-visible,.ctx-empty-action:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 320：保住固定工作台、当前资源、+ 与 overflow；长标题在 tab 内省略，不挤出栏。
   440：默认侧栏能多露出一个资源；680+：工作台拉宽后才放宽标题。 */
@container preview (max-width:359px){
  .wb-tabbar{gap:2px;padding-left:4px;padding-right:4px}
  .wb-tab-wrap{min-width:78px;max-width:118px;flex-basis:118px}
  .wb-tab{gap:4px;padding-left:6px}.wb-tab-title{font-size:.7037rem}
  .wb-tab-add,.wb-tab-overflow{width:28px;flex-basis:28px}
  .wb-add-resource{grid-template-columns:minmax(0,1fr) auto auto}.wb-add-resource label{display:none}.wb-add-error{grid-column:1/-1}
}
@container preview (min-width:440px){
  .wb-tab-wrap{max-width:180px;flex-basis:180px}
  .wb-tab-title{font-size:.7778rem}
}
@container preview (min-width:560px){
  .ctx-body{padding:16px 18px 24px}
  .ctx-model-grid{grid-template-columns:minmax(190px,35%) minmax(0,1fr)}
  .ctx-model-list{position:sticky;top:0;max-height:calc(100cqh - 210px);overflow-y:auto;padding-right:2px}
  .ctx-field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ctx-field-grid>*:last-child{grid-column:1/-1}
  .ctx-evidence-compare{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container preview (min-width:680px){
  .wb-tabbar{height:47px;padding:6px 10px}.wb-tab-wrap{max-width:230px;flex-basis:230px}
  .ctx-sidebar-head{padding-left:22px;padding-right:22px}.ctx-search{margin-left:22px;margin-right:22px}.ctx-nav{padding-left:18px;padding-right:18px}
  /* 审阅是两级导航（队列⇄详情二选一渲染）：宽屏既不摆两栏（两栏时唯一的子元素
     会被塞进 34% 的第一列），也不再给队列套内层滚动盒 —— 队列独占一屏，由侧栏
     自己滚就够，内层盒只会制造「滚轮滚不动 / 固定件被压扁」这类问题。 */
  .ctx-detail,.ctx-review-detail,.ctx-hero-card{padding:18px}
  .ctx-sticky-actions{bottom:-18px;margin:18px -18px -18px;padding:11px 18px 18px}
  .ctx-viewer-split{display:grid;grid-template-columns:minmax(220px,34%) minmax(0,1fr);gap:12px;align-items:stretch}
  .ctx-viewer-directory{display:block;min-height:0;overflow:auto;padding-right:3px}
  .ctx-viewer-directory .ctx-model-grid,.ctx-viewer-directory .ctx-review-grid{grid-template-columns:minmax(0,1fr)}
  .ctx-viewer-directory .ctx-detail,.ctx-viewer-directory .ctx-review-detail-wrap{display:none}
  .ctx-viewer-head{grid-template-columns:auto minmax(0,1fr) auto;padding:12px 14px}.ctx-viewer-actions{grid-column:auto}
  .ctx-viewer-content{padding:14px}.ctx-graph-inspector{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px}
  .ctx-graph-inspector>.ctx-eyebrow,.ctx-graph-inspector>.ctx-detail-title,.ctx-graph-inspector>.ctx-detail-api,.ctx-graph-inspector>.ctx-description{grid-column:1}
  .ctx-graph-inspector>.ctx-graph-inspector-meta,.ctx-graph-inspector>.ctx-actions{grid-column:2;align-self:start}
}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.f{font-family:var(--mono);font-size:0.7778rem;padding:3px 8px;border-radius:6px;background:var(--line-soft);color:var(--ink-2);cursor:pointer}
.f:hover{background:var(--hover-2)}
.f.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.chunk{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:6px;background:var(--panel);font-size:0.8593rem}
.chunk .c{font-family:var(--mono);font-size:0.7037rem;color:var(--accent);margin-bottom:3px}
.chunk mark{background:var(--warn-tint);padding:0 2px;border-radius:2px}
.elist .e{display:flex;gap:8px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--line-soft);font-size:0.9037rem}
.elist .e:last-child{border:0}
.elist .en{flex:1}
.elist .ec{font-family:var(--mono);font-size:0.7407rem;color:var(--ink-3)}
.cap{font-size:0.7778rem;color:var(--ink-3);margin:6px 0}
.ph{text-align:center;color:var(--ink-3);font-size:0.8889rem;padding:40px 16px;line-height:1.9}
.ph .ic{font-family:var(--mono);font-size:0.7407rem;letter-spacing:2px;margin-bottom:8px;color:var(--ink-3)}
pre.j{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-family:var(--mono);font-size:0.763rem;line-height:1.65;overflow-x:auto;color:var(--ink-2);white-space:pre-wrap;word-break:break-all}
input[type=file]{display:none}

/* FDE 问题工作台。完整 backlog 放在右栏，不再把 100+ 条问题塞进聊天气泡；
   卡片仍保持紧凑，访谈现场可在同屏看流程、证据和回答状态。 */
.qwbhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.qwbtitle{font-weight:600;font-size:0.963rem;flex:1}
.qwbsum{font-family:var(--mono);font-size:0.7407rem;color:var(--ink-3);margin-top:2px}
.qfilters{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0 10px}
.qfilter{border:1px solid var(--line);border-radius:12px;padding:3px 8px;font-size:0.7778rem;color:var(--ink-2);background:var(--panel)}
.qfilter.on{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.qnotice{border:1px solid var(--warn-line);background:var(--warn-tint);color:var(--warn);border-radius:6px;padding:7px 9px;font-size:0.8rem;margin-bottom:8px}
.qdeliver{border:1px solid var(--accent-line);background:var(--accent-tint);border-radius:8px;padding:9px 10px;margin-bottom:10px}
.qdeliver .acts{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.qcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;margin-bottom:8px}
.qcard.answered{border-left:3px solid var(--accent)}
.qcard.deferred{opacity:.78;border-left:3px solid var(--ink-3)}
.qmeta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.qbadge{font-family:var(--mono);font-size:0.6667rem;border-radius:8px;padding:1px 6px;background:var(--hover);color:var(--ink-2)}
.qbadge.high,.qbadge.blocking{background:var(--danger-tint);color:var(--danger)}
.qbadge.medium{background:var(--warn-tint);color:var(--warn)}
.qbadge.answered{background:var(--accent-tint);color:var(--accent)}
.qtext{font-size:0.9333rem;line-height:1.6;font-weight:550;word-break:break-word}
.qwhy{font-size:0.8rem;line-height:1.55;color:var(--ink-2);margin:5px 0}
.qimpact{font-size:0.763rem;color:var(--warn);margin:4px 0}
.qfields{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:7px 0}
.qinput,.qselect,.qanswer{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 7px;font:inherit;font-size:0.8rem}
.qanswer{resize:vertical;min-height:48px;line-height:1.5}
.qactions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px}
.qactions .act{font-size:0.7778rem;padding:4px 8px}
.qmore{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px;color:var(--ink-2);font-size:0.8148rem;background:var(--panel)}
.qempty{padding:24px 8px;text-align:center;color:var(--ink-3);font-size:0.8519rem}
.qnext{border:1px solid var(--accent-line);border-radius:8px;background:var(--panel);padding:8px 10px;margin-bottom:9px}
.qnext ol{padding-left:19px;margin-top:5px;color:var(--ink-2);font-size:0.8rem;line-height:1.55}
.retcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;margin-bottom:10px}
.retcard.warn{border-color:var(--warn-line);background:var(--warn-tint)}
.retstats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}
.retstat{background:var(--bg);border-radius:6px;padding:6px;text-align:center}
.retstat b{display:block;font-family:var(--mono);font-size:0.963rem}
.retlist{font-size:0.7778rem;color:var(--ink-2);max-height:100px;overflow:auto;margin:5px 0;padding-left:16px}

.sgc{border:1px solid var(--line);border-left:2px solid var(--accent-line);border-radius:3px;
     padding:12px 14px;margin:10px 0;background:var(--panel)}
.sgh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.sgi{font-size:0.963rem;color:var(--accent);width:16px;flex:none}
.sgt{font-weight:600;font-size:1.0rem;flex:1;color:var(--ink)}
.sgm{font-size:0.8148rem;color:var(--ink-3);letter-spacing:.02em;flex:none}
.sgr{font-size:0.9259rem;line-height:1.7;color:var(--ink-2);margin-bottom:6px}
.steps.reasoning-disclosure{max-width:min(78%,760px);margin:8px 0 10px 0;padding:0;border:1px solid var(--line);
  border-radius:10px;background:var(--panel-soft);overflow:hidden}
.reasoning-disclosure>summary{list-style:none;cursor:pointer;user-select:none}
.reasoning-disclosure>summary::-webkit-details-marker{display:none}
.reasoning-summary{display:flex;align-items:center;gap:8px;min-height:38px;padding:7px 11px;color:var(--ink-2)}
.reasoning-summary:focus-visible,.trace>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.reasoning-status{font-size:0.8889rem;font-weight:600;line-height:1.4}
.reasoning-count{font-family:var(--mono);font-size:0.7037rem;color:var(--ink-3)}
.reasoning-done{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:50%;
  background:var(--accent-tint);color:var(--accent);font-size:0.7037rem;font-weight:700}
.reasoning-chevron{width:7px;height:7px;margin-left:auto;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform var(--dur) var(--ease)}
.reasoning-disclosure[open] .reasoning-chevron,.trace[open] .reasoning-chevron{transform:rotate(225deg) translate(-1px,-1px)}
.reasoning-details{border-top:1px solid var(--line-soft);background:var(--panel);max-height:360px;overflow:auto;padding:10px 12px 3px}
.reasoning-disclosure[open] .reasoning-details,.trace[open] .tb{animation:reasoning-open .2s var(--ease-out) both}
@keyframes reasoning-open{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.reasoning-empty{padding:2px 0 9px;color:var(--ink-3);font-size:0.8148rem}
.reasoning-step-list{counter-reset:reasoning-step}
.stp{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.stp:last-child{margin-bottom:0;border-bottom:0}
.reasoning-step-head{display:flex;align-items:flex-start;gap:8px}
.reasoning-step-number{flex:0 0 auto;margin-top:2px;font-family:var(--mono);font-size:0.6667rem;color:var(--ink-3)}
.stt{font-size:0.9259rem;color:var(--ink-2);line-height:1.6}
.sto{font-family:var(--mono);font-size:0.7778rem;color:var(--accent);margin:5px 0 0 26px;word-break:break-word}
.stb{font-family:var(--mono);font-size:0.7778rem;color:var(--ink-3);margin-top:3px;
     background:var(--bg);border-radius:3px;padding:4px 7px;
     white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin-left:26px}
.fnd{font-size:0.8519rem;line-height:1.65;color:var(--warn);background:var(--warn-tint);
     border:1px solid var(--warn-line);border-radius:5px;padding:7px 9px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:0.8519rem}
.kvr{display:contents}
.kvk{color:var(--ink-3);white-space:nowrap;font-size:0.7778rem;padding-top:1px}
.kvv{color:var(--ink);word-break:break-word}
.conv{position:relative}
.conv .del{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  opacity:0;background:transparent;color:var(--ink-3);font-size:1.1111rem;line-height:1;
  padding:2px 6px;border-radius:4px;transition:opacity .12s}
.conv:hover .del{opacity:1}
.conv .del:hover{background:var(--danger-tint);color:var(--danger)}
/* 侧栏项目文件夹（只有工作模式；聊天模式整套不出现） */
.secrow{display:flex;align-items:flex-start}
.secrow .sec{flex:1}
.pjnew{color:var(--ink-3);font-size:0.9259rem;line-height:1;padding:0 14px 8px;border-radius:6px}
.pjnew:hover{color:var(--ink)}
/* 项目名必须比它底下的会话**更重**。原来 .pjname 是 0.8889rem 而 .conv .t 是
   0.963rem —— 容器比内容还小，层级是反的，看上去就是一串平级的东西里混了个灰标题。 */
.pjhead{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;
  cursor:pointer;color:var(--ink)}
.pjhead:hover{background:var(--hover)}
