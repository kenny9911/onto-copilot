.pjcaret{font-size:0.8148rem;color:var(--ink-2);width:11px;flex:0 0 auto;transition:transform .12s}
.pjhead.off .pjcaret{transform:rotate(-90deg)}
.pjname{flex:1;font-size:1rem;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pjn{font-family:var(--mono);font-size:0.7407rem;color:var(--ink-3)}
.pjmore{opacity:0;color:var(--ink-3);font-size:0.9259rem;line-height:1;padding:1px 4px;
  border-radius:4px;transition:opacity .12s}
.pjhead:hover .pjmore{opacity:1}
.pjmore:hover{background:var(--hover-2);color:var(--ink)}
/* 归属感靠**缩进 + 一条看得见的竖轨**。原来是 14px 外边距配一条 --line-soft 的
   1px 线、3px 内缩 —— 那条线在深色下几乎和背景同色，于是项目里的会话和「未归类」
   的会话看起来一模一样，分组等于白做。轨道跟着整组 hover 变深，鼠标扫过时
   "这几张卡是一伙的"立刻成立。 */
.pjbody{margin:0 0 8px 12px;padding-left:11px;border-left:2px solid var(--line);
  transition:border-color .12s}
.pjgroup:hover .pjbody{border-color:var(--thumb)}
/* 组内的卡片略收一点，进一步和顶格的「未归类」拉开 */
.pjbody .conv{margin-right:2px}
.pjempty{padding:2px 10px;margin:4px 0}
.pjsec{font-size:0.7778rem;color:var(--ink-3);padding:10px 10px 4px;letter-spacing:.5px}
/* 一个项目都没有时的入口。**必须是个能点的东西**，不是一行灰字 —— 这个功能
   如果只在"你已经有项目了"的时候才现身，新用户就永远迈不出第一步。 */
.pjadd{margin-left:auto;opacity:0;background:transparent;color:var(--ink-3);
  font-size:0.9259rem;line-height:1;padding:0 4px;border-radius:4px;transition:opacity .12s}
.pjhead:hover .pjadd{opacity:1}
.pjadd:hover{background:var(--hover-2);color:var(--ink)}
/* 拖拽反馈。**必须看得见落点** —— 看不出会掉进哪儿的拖拽，用户第一次就不敢松手。 */
.conv.dragging{opacity:.45}
.pjhead.dragover,.pjsec.dragover{background:var(--accent-tint);
  outline:1px dashed var(--accent-line);outline-offset:-1px;border-radius:8px}
.pjsec.droptarget{cursor:default}
.pjcreate{display:block;width:calc(100% - 20px);margin:2px 10px 4px;padding:7px 10px;
  text-align:left;font-size:0.8519rem;color:var(--ink-2);background:transparent;
  border:1px dashed var(--line);border-radius:8px}
.pjcreate:hover{background:var(--hover);color:var(--ink);border-color:var(--thumb)}
.conv .mv{position:absolute;right:30px;top:50%;transform:translateY(-50%);
  opacity:0;background:transparent;color:var(--ink-3);font-size:0.9259rem;line-height:1;
  padding:2px 6px;border-radius:4px;transition:opacity .12s}
.conv:hover .mv{opacity:1}
.conv .mv:hover{background:var(--hover-2);color:var(--ink)}
/* convRow 在聊天模式本来就不画 .mv；这条兜的是「切了模式、列表还没重画完」
   那一小段 —— 聊天模式一眼都不该看到项目入口 */
.app.mode-chat .conv .mv,.app.mode-chat .pjnew{display:none}
/* 行内弹出菜单。挂在 body 上而不是行里：.convs 是滚动容器，绝对定位的菜单会被裁掉。
   观感沿用账户菜单那套（.acctitem 直接复用）。 */
.popmenu{position:fixed;min-width:150px;max-width:210px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);
  padding:6px;z-index:90}
.popmenu[hidden]{display:none}
.popmenu .acctitem{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.popmenu .acctitem.on{background:var(--hover-2)}
.popmenu .acctitem.danger{color:var(--danger)}
.popmenu .acctitem.muted{color:var(--ink-3);cursor:default}
.popmenu .acctitem.muted:hover{background:none}
.pmsec{font-size:0.7407rem;color:var(--ink-3);padding:4px 9px 2px}
/* 思考中：默认只露一行业务进度；点击后才显示 Harness 思考、工具与结果。 */
.bub.oc.think .body.think{display:block;width:min(78%,760px);max-width:min(78%,760px);padding:0;color:var(--ink-2);overflow:hidden}
.bub.oc.think .reasoning-summary{min-height:42px;padding:8px 13px}
.bub.oc.think .reasoning-details{max-height:420px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);display:block;
  animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.22;transform:translateY(0)}
                 30%{opacity:1;transform:translateY(-2px)}}
.tsec{font-family:var(--mono);font-size:0.7778rem;color:var(--ink-3)}
/* 推理 tab */
.trw{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.trn{font-family:var(--mono);font-size:0.7407rem;color:var(--ink-3);width:16px;flex:0 0 auto;padding-top:2px}
.trb{flex:1;min-width:0}
.trt{font-size:0.9259rem;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.trc{font-family:var(--mono);font-size:0.7778rem;color:var(--accent);margin-top:4px;
     word-break:break-all}
.tro{font-family:var(--mono);font-size:0.7407rem;color:var(--ink-3);margin-top:4px;
     background:var(--bg);border-radius:4px;padding:5px 7px;white-space:pre-wrap;
     word-break:break-all;max-height:150px;overflow:auto}
.tgrp{margin-bottom:18px}
.tgq{font-size:0.8519rem;color:var(--ink-3);margin-bottom:6px;padding-bottom:5px;
     border-bottom:1px solid var(--line)}
/* 操作记录：一行一件事，时间靠右。行要密 —— 它是拿来扫的，不是拿来读的 */
.oprow{display:flex;align-items:flex-start;gap:8px;padding:5px 0;
       border-bottom:1px solid var(--line-soft)}
.oprow:last-child{border-bottom:0}
.oprow .opd{flex:1;min-width:0;font-size:0.8519rem;color:var(--ink-2);
            line-height:1.55;word-break:break-word}
.oprow .opt{font-family:var(--mono);font-size:0.7037rem;color:var(--ink-3);
            flex:0 0 auto;padding-top:3px}
.eng{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:14px;background:var(--panel-soft)}
.enghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.engtitle{font-size:0.9259rem;color:var(--ink)}
.engmeta{font-family:var(--mono);font-size:0.7037rem;color:var(--ink-3)}
.engsteps{display:flex;gap:5px;flex-wrap:wrap}
.engstep{font-family:var(--mono);font-size:0.7037rem;color:var(--ink-3);border:1px solid var(--line-soft);
  background:var(--panel);border-radius:12px;padding:3px 7px}
.engstep.completed{color:var(--accent);border-color:var(--accent-line);background:var(--accent-tint)}
.engstep.active{color:#fff;border-color:var(--btn);background:var(--btn)}
.cfm{border:1px solid var(--warn-line);background:var(--warn-tint);border-radius:8px;
  padding:11px 13px;margin:10px 0;font-size:0.9259rem;color:var(--warn);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfm .act{margin-left:auto}
.context-chat-bridge{display:flex;flex-direction:column;gap:6px;margin:12px 0 6px}
.context-receipts{border:1px solid var(--accent-line);border-radius:10px;
  background:color-mix(in srgb,var(--accent-tint) 58%,var(--panel));overflow:hidden}
.context-receipts-head{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--accent-line)}
.context-receipts-head strong{font-size:.8519rem;color:var(--accent)}
.context-receipts-head span{margin-left:auto;font-size:.7407rem;color:var(--ink-3)}
.context-receipts-list{display:flex;flex-direction:column}
.context-receipt{display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;gap:9px;padding:9px 11px}
.context-receipt+.context-receipt{border-top:1px solid var(--line-soft)}
.context-receipt-mark{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.context-receipt-copy{display:flex;flex-direction:column;min-width:0}
.context-receipt-copy strong{font-size:.8148rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-receipt-copy span{font-size:.7407rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-receipt-actions{display:flex;gap:4px}
.context-receipt-actions button{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink-2);
  font-size:.7037rem;padding:3px 7px;white-space:nowrap}
.context-receipt-actions button:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-tint)}
@media(max-width:760px){.context-receipt{grid-template-columns:7px minmax(0,1fr)}.context-receipt-actions{grid-column:2}}
.abar{max-width:var(--col);margin:0 auto 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.abar:empty{display:none}
.abtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:7px 14px;font-size:0.9259rem;text-decoration:none;
  display:inline-flex;align-items:center;line-height:1}
.abtn:hover{background:var(--bg)}
.abtn.pri{background:var(--btn);color:#fff;border-color:var(--btn)}
.abtn.pri:hover{opacity:.86}
.apend{font-size:0.9259rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.apend i{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:blink 1.2s infinite ease-in-out}
.pchips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.pchip{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  border-radius:16px;padding:6px 13px;font-size:0.8889rem;text-align:left;line-height:1.4}
.pchip:hover{background:var(--accent-tint);color:var(--accent);border-color:var(--accent-line)}
.fnode{display:inline-block;font-size:0.8148rem;border-radius:5px;padding:3px 7px;
  margin:3px 4px 0 0;border:1px solid transparent}
.fnode.action{background:#dbeafe;border-color:#93c5fd;color:#1e3a5f}
.fnode.event{background:#fef3c7;border-color:#fcd34d;color:#78350f}
.fnode.gateway{background:#fefce8;border-color:#eab308;color:#713f12}
.fnode.terminal{background:#dcfce7;border-color:#86efac;color:#14532d}
.fnode.external{background:#f5f3ff;border-color:#c4b5fd;color:#581c87}
.fnode.guess{border-style:dashed;opacity:.75}
.msheet{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.mshead{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  background:var(--panel);user-select:none}
.mshead:hover{background:var(--bg)}
.mstri{color:var(--ink-3);font-size:0.8148rem;width:10px}
.msname{font-weight:600;font-size:0.9259rem;color:var(--ink);flex:1}
.mscount{font-size:0.8148rem;color:var(--ink-3);font-family:var(--mono)}
.msshape{font-size:0.7778rem;color:var(--accent);background:var(--accent-tint);
  border-radius:10px;padding:1px 8px}
.msrows{padding:4px 12px 10px;border-top:1px solid var(--line-soft)}
.mrow{font-size:0.8519rem;line-height:1.55;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.fnode{cursor:pointer}
.fcitebox{margin-top:12px}
.fcite{border:1px solid var(--accent-line);background:var(--accent-tint);
  border-radius:8px;padding:11px 13px;font-size:0.9259rem}
.fcite b{color:var(--ink)}
.fccode{font-family:var(--mono);font-size:0.7407rem;color:var(--accent);margin-left:8px}
.fcw{display:block;margin-top:5px;color:var(--warn);font-size:0.8519rem}
.fcsnip{margin-top:6px;color:var(--ink-2);font-size:0.8519rem;line-height:1.6;
  border-left:2px solid var(--accent-line);padding-left:8px}
.sidebar{transition:width .15s,flex-basis .15s}
.sidebar.hidden{width:0;flex-basis:0;overflow:hidden;border-right:0}
@media(max-width:860px){
  /* 移动端抽屉：默认在视口外，汉堡切 mobile-open。旧规则无条件 width:0，
     toggleSidebar 只切 hidden，导致按钮无论点多少次都打不开。 */
  .sidebar,.sidebar.hidden{position:fixed;inset:0 auto 0 0;z-index:70;width:230px;flex-basis:230px;
    overflow:hidden;border-right:1px solid var(--line);transform:translateX(-100%);
    transition:transform var(--dur-2) var(--ease-out);box-shadow:none}
  .sidebar.mobile-open{transform:translateX(0);box-shadow:10px 0 30px rgba(0,0,0,.16)}
  .sidebar-close{display:block}
}
.preview.hidden{width:0;flex-basis:0;overflow:hidden;border-left:0}
.preview{position:relative}
/* 预览收起后，右缘留一个小把手把它拉回来 —— 否则收起按钮跟着面板一起没了 */
.pexpand{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:20;
  background:var(--panel);border:1px solid var(--line);border-right:0;
  border-radius:9px 0 0 9px;color:var(--ink-2);font-size:.7407rem;padding:12px 7px;
  writing-mode:vertical-rl;letter-spacing:.08em;
  cursor:pointer;box-shadow:-1px 0 5px rgba(0,0,0,.05)}
.pexpand:hover{background:var(--hover);color:var(--ink)}
.pdrag{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.pdrag:hover{background:var(--accent-line)}
.collapse{background:transparent;border:0;color:var(--ink-3);font-size:1.1111rem;
  padding:2px 7px;border-radius:5px;line-height:1;flex:0 0 auto}
.collapse:hover{background:var(--bg);color:var(--ink)}
.phead{display:flex;align-items:center}
.phead .pt{flex:1}
/* 待办：对话流里的一张卡片 */
.pcard{border:1px solid var(--warn-line);border-radius:12px;margin:12px 0;
  background:var(--panel);overflow:hidden}
.pchead{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;
  font-size:0.9259rem;font-weight:600;color:var(--ink);background:var(--warn-tint)}
.pchead:hover{background:var(--warn-tint)}
.pchi{color:var(--warn)}
.ptri{color:var(--ink-3);font-size:0.8148rem}
.pcbody{padding:8px 14px 12px}

/* ── P6/P5：登录、账户、设置 ────────────────────────────────────── */
.langsw{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;flex:0 0 auto}
.langsw button{border:0;background:transparent;color:var(--ink-2);font-size:0.8519rem;padding:4px 9px;border-radius:7px;cursor:pointer}
.langsw button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}

/* 这条分隔线以前是钉死的，用来隔开账户行和下面那行数据库状态。状态行现在只在
   出问题时才有内容 —— 线跟着内容走，否则侧栏底部会挂一条底下什么都没有的横线。 */
#store:not(:empty){padding-top:10px;margin-top:10px;border-top:1px solid var(--line-soft)}
.idrow{display:flex;align-items:center;gap:6px;font-size:0.8889rem;color:var(--ink)}
.idname{font-weight:500}
.idrole{font-family:var(--mono);font-size:0.7037rem;color:var(--ink-3);background:var(--hover);border-radius:4px;padding:1px 6px}
.idbtns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.ghost.sm{padding:3px 9px;font-size:0.8148rem;border:1px solid var(--line);border-radius:6px;color:var(--ink-2)}
.ghost.sm:hover{background:var(--hover)}
/* 账户区：侧栏底部的账号入口 + 上弹菜单（设置 / 语言 / 退出） */
.identity{position:relative}
.acct{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;color:var(--ink);cursor:pointer;text-align:left}
.acct:hover{background:var(--hover)}
.acctava{width:22px;height:22px;border-radius:6px;background:var(--btn);color:#fff;font-size:0.7778rem;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--mono)}
.acctname{font-size:0.9259rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctcaret{color:var(--ink-3);font-size:0.7407rem;flex:0 0 auto}
.acctmenu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px;z-index:30}
.acctmenu[hidden]{display:none}
.acctitem{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;font-size:0.9259rem;color:var(--ink);cursor:pointer;text-align:left}
.acctitem:hover{background:var(--hover)}
.acctitem .ai{width:15px;text-align:center;color:var(--ink-2);flex:0 0 auto}
.acctlang{cursor:default}.acctlang:hover{background:transparent}.acctlang .acctlangl{flex:1}
.acctsep{height:1px;background:var(--line-soft);margin:5px 4px}
/* 本地模式的头像淡一档：它不是一个"人"，只是还没登录。实心深底会让人以为
   自己已经是某个账号了。 */
.acctava.ghosted{background:var(--hover-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}

.overlay{position:fixed;inset:0;background:rgba(10,10,8,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.opanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 26px;
  width:360px;max-width:100%;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.opanel.wide{width:660px;max-height:84vh;display:flex;flex-direction:column}
.opanel h3{font-family:var(--serif);font-size:1.3333rem;font-weight:400;margin-bottom:4px}

.field{margin:10px 0}
.field label{display:block;font-size:0.8519rem;color:var(--ink-2);margin-bottom:4px}
.input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:0.963rem;
  background:var(--panel);color:var(--ink);font-family:inherit}
.input:focus{outline:0;border-color:var(--accent-line)}
.input.sm{padding:4px 7px;font-size:0.8889rem;width:auto}
.err{color:var(--danger);background:var(--danger-tint);border:1px solid var(--danger-tint);
  border-radius:6px;padding:7px 10px;font-size:0.8889rem;margin:8px 0}

.modal-head{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);margin-bottom:12px;flex:0 0 auto}
.modal-head h3{flex:1}
.modal-body{overflow-y:auto;flex:1}

.tbl{border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-bottom:14px}
.trow{display:grid;grid-template-columns:1.3fr 1fr .6fr 2fr;gap:8px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:0.9259rem}
.trow:last-child{border-bottom:0}
.trow.thead{background:var(--bg);color:var(--ink-3);font-size:0.8148rem}
.rowacts{display:flex;gap:6px;flex-wrap:wrap}
.inlineform{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.sgrp{margin-bottom:18px}
.slabel{font-size:0.8519rem;color:var(--ink-3);margin-bottom:8px;letter-spacing:.3px}
.schoice{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--ink)}
.badge{display:inline-block;font-size:0.7407rem;font-family:var(--mono);border-radius:4px;
  padding:1px 6px;background:var(--hover);color:var(--ink-2);margin-left:6px}
.badge.warn{background:var(--warn-tint);color:var(--warn)}
.badge.danger{background:var(--danger-tint);color:var(--danger)}
/* 模型分级的候选芯片：序号即优先序，↑ 上移、× 移除。沿用 .badge 的尺度，
   不引新的视觉语言 —— 它就是一个带两个动作的标签。 */
.tier-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px;min-height:24px}
.tier-chip{display:inline-flex;align-items:center;gap:5px;font-size:.7778rem;
  border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 6px;background:var(--panel)}
.tier-chip b{font-family:var(--mono);font-size:.7037rem;color:var(--accent);
  background:var(--accent-tint);border-radius:3px;padding:0 4px}
.tier-chip button{border:0;background:none;color:var(--ink-2);font-size:.8148rem;line-height:1;padding:1px 3px}
.tier-chip button:hover{color:var(--accent)}
.tier-chip .tier-drop:hover{color:var(--danger)}
.tier-hint{margin-top:8px;line-height:1.55}

.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;flex:0 0 auto}
.stab{padding:8px 14px;font-size:0.9259rem;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer;background:none}
.stab.on{color:var(--ink);border-color:var(--accent)}

.envtbl{border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.envrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft);font-size:0.8519rem}
.envrow:last-child{border-bottom:0}
/* 用量：按时间的柱状趋势。手搓 div，不引图表库 —— 这个文件没有打包步骤。
   颜色全部走 var(--accent)：它会被 applyAppearance() 在运行时改写成用户选的
   强调色，写死十六进制换个主题就脱节、深色模式下还会瞎。 */
.ubars{display:flex;align-items:flex-end;gap:2px;height:96px;padding:6px 8px;
  background:var(--bg);border:1px solid var(--line-soft);border-radius:8px}
.ubar{flex:1;min-width:2px;height:100%;display:flex;align-items:flex-end}
.ubar.tight{min-width:1px}
.ubar i{display:block;width:100%;background:var(--accent);border-radius:2px 2px 0 0;
  min-height:0;transition:height .12s}
.ubar:hover i{background:var(--ink)}
.uaxis{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:0.7037rem;color:var(--ink-3);margin-top:4px}
/* 每个模型占多少：行内那条细占比条 */
.ushare{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.ushare i{display:block;height:100%;background:var(--accent);border-radius:3px}
.unum{font-family:var(--mono);font-size:0.8148rem;color:var(--ink-2);min-width:54px;text-align:right}
.badge.danger{background:var(--danger-tint);color:var(--danger)}
.envname{font-family:var(--mono);color:var(--ink-2);flex:0 0 180px}
.envval{flex:1;color:var(--ink-3);word-break:break-all}
.saverow{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:6px;flex:0 0 auto}

/* 紧凑密度：只裁边距，不改字号/结构 */
body.dense .card{padding:9px 12px;margin-bottom:8px}
body.dense .conv{padding:6px 8px}
body.dense .bub .body{padding:6px 10px}
body.dense .mhead{padding:9px 16px}
body.dense .comp{padding:8px 16px 12px}
body.dense .stream{padding:0 16px}

/* OntoDocument：项目知识库与当前会话材料必须在视觉上分层。项目库承担长期版本、
   采用版和固定挂载；会话区只呈现这次上传的临时材料。 */
.od-library{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;padding:14px;border:1px solid var(--accent-line);
  border-radius:14px;background:linear-gradient(145deg,var(--accent-tint),var(--panel) 38%);box-shadow:0 1px 3px rgba(0,0,0,.035)}
.od-library-head,.od-session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.od-library-head>div,.od-session-head>div{min-width:0}.od-library h3,.od-session-section h3{margin:1px 0 0;font-size:1rem;line-height:1.35}
.od-library-head p,.od-session-head p{margin:5px 0 0;color:var(--ink-2);font-size:.7037rem;line-height:1.55}
.od-eyebrow{display:block;color:var(--accent);font-family:var(--mono);font-size:.5926rem;font-weight:700;letter-spacing:.09em}
.od-trust-note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start;padding:9px 10px;
  border:1px solid var(--accent-line);border-radius:9px;background:var(--panel);font-size:.7037rem;line-height:1.5}
.od-trust-note strong{color:var(--accent);white-space:nowrap}.od-trust-note span{color:var(--ink-2)}
.od-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end}
.od-search>label:first-child{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;color:var(--ink-2);font-size:.6667rem;font-weight:600}
.od-search input[type="search"],.od-editor input,.od-editor select,.od-promote select,.od-add-version select{width:100%;min-width:0;height:34px;
  padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;outline:none}
.od-search input[type="search"]:focus,.od-editor input:focus,.od-editor select:focus,.od-promote select:focus,.od-add-version select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--glow-ring)}
.od-check{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-size:.6667rem;line-height:1.4;cursor:pointer}
.od-check input{accent-color:var(--accent)}
.od-search-results{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.od-results-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.od-results-head strong{font-size:.7778rem}
.od-results-head span{color:var(--warn);font-size:.6296rem}.od-no-evidence{margin:0;padding:8px;border-radius:7px;background:var(--warn-tint);color:var(--ink-2);font-size:.7037rem;line-height:1.55}
.od-hit-list{display:flex;max-height:300px;flex-direction:column;gap:6px;overflow:auto}.od-hit{position:relative;display:flex;width:100%;flex-direction:column;gap:5px;
  padding:9px 10px;border:1px solid var(--line-soft);border-radius:8px;background:var(--bg);color:var(--ink);text-align:left}
.od-hit:hover{border-color:var(--accent-line);background:var(--accent-tint)}.od-hit>span{display:flex;min-width:0;justify-content:space-between;gap:8px}
.od-hit strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7037rem}.od-hit small{flex:0 0 auto;color:var(--ink-3);font-family:var(--mono);font-size:.5926rem}
.od-hit p{display:-webkit-box;margin:0;overflow:hidden;color:var(--ink-2);font-size:.7037rem;line-height:1.5;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.od-hit i{align-self:flex-end;color:var(--accent);font-size:.6296rem;font-style:normal}.od-open-evidence{display:flex;flex-direction:column;gap:7px;padding:10px;
  border:1px solid var(--accent-line);border-radius:9px;background:var(--accent-tint)}
.od-open-evidence>div{display:flex;justify-content:space-between;gap:9px}.od-open-evidence strong{font-size:.7407rem}.od-open-evidence>div span{color:var(--ink-3);font-family:var(--mono);font-size:.5926rem}
.od-open-evidence blockquote{margin:0;padding:9px;border-left:3px solid var(--accent);background:var(--panel);color:var(--ink);font-size:.7407rem;line-height:1.6;white-space:pre-wrap}
.od-evidence-context{margin:0;color:var(--ink-3);font-size:.6296rem}.od-open-evidence>small{color:var(--ink-3);font-family:var(--mono);font-size:.5926rem}
.od-promote{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,190px) auto;gap:7px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:9px;background:var(--panel)}
.od-promote>div,.od-add-version>div{display:flex;min-width:0;flex-direction:column;gap:2px}.od-promote strong,.od-add-version strong{font-size:.7037rem}
.od-promote small,.od-add-version small{color:var(--ink-3);font-size:.6296rem;line-height:1.45}.od-promote select,.od-add-version select{height:31px;font-size:.6667rem}
.od-library-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:.6667rem}
.od-feedback:empty{display:none}.od-notice,.od-inline-error{padding:8px 9px;border-radius:7px;font-size:.7037rem;line-height:1.45}
.od-notice{border:1px solid var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.od-inline-error{border:1px solid var(--warn-line);background:var(--warn-tint);color:var(--danger)}
.od-library-error,.od-library-empty,.od-library-loading{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:15px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
.od-library-error strong,.od-library-empty strong{font-size:.8148rem}.od-library-error p,.od-library-empty p{margin:0;color:var(--ink-2);font-size:.7037rem;line-height:1.55}
.od-library-error small{color:var(--ink-3);font-size:.6296rem}.od-library-loading{align-items:center;color:var(--ink-3);font-size:.7037rem}
.od-document-list{display:flex;flex-direction:column;gap:8px}.od-document{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.od-document.attached{border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}.od-document.archived{opacity:.78;background:var(--bg)}
.od-document-head{display:flex;align-items:center;gap:7px;padding:9px}.od-document-toggle{display:flex;min-width:0;flex:1;align-items:center;gap:8px;color:var(--ink);text-align:left}
.od-document-toggle:hover .od-document-title strong{color:var(--accent)}.od-disclosure{display:inline-flex;width:22px;height:22px;flex:0 0 22px;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink-2);font-family:var(--mono);font-size:.7778rem}
.od-document-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}.od-document-title,.od-version-name{display:flex;min-width:0;align-items:center;gap:5px;flex-wrap:wrap}
.od-document-title strong{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7778rem}.od-document-meta{color:var(--ink-3);font-size:.6296rem}
.od-document-actions{display:flex;flex:0 0 auto;gap:5px}.od-badge{display:inline-flex;align-items:center;min-height:19px;padding:1px 6px;border:1px solid var(--line);border-radius:999px;
  color:var(--ink-3);font-size:.5741rem;font-weight:600;white-space:nowrap}.od-badge.adopted,.od-badge.attached{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.od-badge.current{background:var(--bg);color:var(--ink-2)}.od-badge.archived{border-color:var(--warn-line);background:var(--warn-tint);color:var(--warn)}
.od-badge.pending{border-color:var(--warn-line);background:var(--warn-tint);color:var(--warn)}
.od-tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 8px 39px}.od-tags span{padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--ink-2);font-size:.5926rem}
.od-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel-soft)}
.od-editor label{display:flex;min-width:0;flex-direction:column;gap:4px;color:var(--ink-2);font-size:.6296rem}.od-editor input,.od-editor select{height:31px;font-size:.7037rem}
.od-editor-wide{grid-column:1/-1}.od-editor-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:6px}
.od-version-area{display:flex;flex-direction:column;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel-soft)}
.od-inline-state{padding:8px;color:var(--ink-3);font-size:.6667rem}.od-version-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.od-version{display:flex;align-items:flex-start;gap:8px;padding:9px;border:1px solid var(--line-soft);border-radius:8px;background:var(--panel)}
.od-version-main{display:flex;min-width:0;flex:1;flex-direction:column;gap:4px}.od-version-name strong{font-size:.7037rem;overflow-wrap:anywhere}
.od-version-meta{display:flex;flex-wrap:wrap;gap:4px 9px;color:var(--ink-3);font-family:var(--mono);font-size:.5741rem}.od-parse.ready{color:var(--accent)}.od-parse.degraded{color:var(--warn)}
.od-version-actions{display:flex;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;gap:5px}.od-version-actions .act{padding:5px 7px;font-size:.6296rem}
.od-add-version{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,180px) auto;gap:7px;align-items:center;padding:9px;border:1px dashed var(--line);border-radius:8px;background:var(--bg)}
.od-muted{color:var(--ink-3);font-size:.6296rem}.od-document-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-top:1px solid var(--line-soft);color:var(--ink-3);font-size:.5926rem}
.od-link{color:var(--ink-3);font-size:.6296rem;text-decoration:underline;text-underline-offset:2px}.od-link:hover{color:var(--accent)}.od-link[disabled]{opacity:.45}
.od-boundary-note{padding-top:2px;color:var(--ink-3);font-size:.6296rem;line-height:1.5}.od-session-section{display:flex;flex-direction:column;gap:9px;padding-top:4px}
.od-session-head{padding:2px 1px 5px;border-bottom:1px solid var(--line)}
@container (max-width:500px){
  .od-trust-note{grid-template-columns:1fr}.od-promote,.od-add-version{grid-template-columns:1fr}.od-search{grid-template-columns:1fr}
  .od-search>label:first-child{grid-column:1}.od-library-head,.od-session-head{flex-wrap:wrap}.od-version{flex-direction:column}.od-version-actions{justify-content:flex-start}
  .od-editor{grid-template-columns:1fr}.od-editor-wide,.od-editor-actions{grid-column:1}.od-document-head{align-items:flex-start}.od-document-actions{padding-top:1px}
}

/* ── 动效 ────────────────────────────────────────────────────────
   放在最后是有意的：这一段只改过渡与动画，不改任何布局/配色的取值，
   要排查"是不是动效搞的"，注释掉这一段即可，上面一行都不用动。 */

/* 1. 按钮与标签页。hover 抬 1px、按下缩到 .97 —— 抬起是"可以点"，
      缩回是"点到了"。少了按下那一下，鼠标点下去像点在图片上。
      **必须排除 disabled**：禁用态在多数浏览器里照样触发 :hover，
      不排除的话"发送"按钮灰着也会跟着浮起来，等于在骗人。 */
.act,.abtn,.pchip,.ghost,.ghost2,.cbtn,.tab,.msel,.newchat,.collapse{
  transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),
             color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),
             opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.act:not([disabled]):not(.disabled):hover,.abtn:not(.disabled):hover,.pchip:hover,
.ghost:hover,.ghost2:not([disabled]):hover,.cbtn:not([disabled]):hover,.newchat:hover{
  transform:translateY(-1px)}
.act:not([disabled]):not(.disabled):active,.abtn:not(.disabled):active,.pchip:active,
.ghost:active,.ghost2:not([disabled]):active,.cbtn:not([disabled]):active,
.newchat:active,.tab:active{transform:translateY(0) scale(.97)}
/* 标签页在一条分段控件里，抬起来会把整条撑歪，只给底色反馈 */
.tab:not(.on):hover{background:var(--hover)}

/* 2. 侧栏与会话项。删除/移动那两个悬浮小按钮本来是硬闪出来的。 */
.conv{transition:background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.conv .del,.conv .mv{transition:opacity var(--dur) var(--ease),
  background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
/* 收展用 --ease-out（收尾很慢），大块面积移动才不显得"啪"地一下。
   **拖动预览宽度时必须关掉** —— 拖拽是每次 mousemove 直接写 style.width，
   带着 .24s 过渡的话边框会橡皮筋一样吊在光标后面，手感全毁。 */
.sidebar,.preview{transition:width var(--dur-2) var(--ease-out),flex-basis var(--dur-2) var(--ease-out)}
@media(max-width:860px){.sidebar,.sidebar.hidden{transition:transform var(--dur-2) var(--ease-out)}}
body.dragging .preview{transition:none}

/* 3. 卡片与面板切换。
      淡入**只挂在 .pfade 上，由切标签页那一下临时加**，不是常驻在卡片上 ——
      paint() 会被 SSE 事件反复调用（推理面板每来一条 kernel.* 就重画一次），
      常驻的话那些卡片会跟着每条事件闪一遍。和气泡是同一个坑，换了个解法：
      气泡要区分"哪条是新的"所以得记数，面板是整块换掉，认"切没切标签页"就够了。 */
.card,.chunk,.q,.trace{transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.pbody.pfade>*{animation:fade-in .26s var(--ease-out) both}
.trace>summary{transition:background-color var(--dur) var(--ease)}
.trace>summary:hover{background:var(--hover)}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 4. 减弱动效。系统里打开"减少动态效果"的人，多半是前庭敏感或偏头痛 ——
      对他们来说旋转和呼吸不是精致，是难受。全部停掉，只留静态阴影和颜色变化，
      功能一点不少（发光的三档状态靠亮度差仍然分得出来）。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
  .cbox:focus-within::before{opacity:.5}
  .cbox.thinking::before{opacity:.9}
  .act:hover,.abtn:hover,.pchip:hover,.ghost:hover,.ghost2:hover,.cbtn:hover,.newchat:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="pane sidebar" id="sessionSidebar">
    <div class="brand"><h1>OntoCopilot</h1><button type="button" class="sidebar-close" id="sidebarClose"
      onclick="toggleSidebar()" aria-label="关闭会话栏">关闭</button></div>
    <button class="newchat" id="newchatBtn" onclick="newSession()">+ 新会话</button>
    <!-- 「＋」建项目：hidden 起手，后端确认有 /api/projects 且在工作模式才露出来 -->
    <div class="secrow">
      <div class="sec">会话</div>
      <button class="pjnew" id="pjnewBtn" hidden onclick="newProject()" aria-label="新建项目">+</button>
    </div>
    <div class="convs" id="convs"></div>
    <div class="side-foot">
      <div id="identity" class="identity"></div>
      <div id="store" class="k"></div>
    </div>
  </aside>

  <main class="pane main">
    <div class="mhead">
      <button class="collapse" id="sidetoggle" title="收起/展开会话栏" aria-label="收起或展开会话栏"
        aria-controls="sessionSidebar" aria-expanded="false"
        onclick="toggleSidebar()">☰</button>
      <div class="ava">OC</div>
      <h2 id="title">OntoCopilot</h2>
      <div class="modetog" id="modetog">
        <button data-mode="chat" aria-pressed="false" onclick="setMode('chat')">聊天</button>
        <button data-mode="work" class="on" aria-pressed="true" onclick="setMode('work')">工作</button>
      </div>
      <span class="pill" id="status"><i></i>就绪</span>
      <button class="ghost" id="refreshBtn" onclick="refresh()">刷新</button>
    </div>
    <!-- 额度提醒条：由 paintQuotaBar() 填。hidden 起手，没事的时候一格不占。 -->
    <div class="qbar" id="quotaBar" hidden></div>
    <div class="knowledge-page" id="knowledgePage"></div>
    <div class="stream" id="stream" role="log" aria-live="polite"
      aria-relevant="additions text" aria-atomic="false" aria-busy="false"></div>
    <div class="comp">
      <div class="abar" id="abar"></div>
      <div class="cbox">
        <textarea class="cin" id="cin" rows="1"
          placeholder="说点什么，或直接把材料拖进来"></textarea>
        <div class="crow">
          <button class="cbtn" id="attach" title="添加材料" aria-label="添加材料"
            onclick="document.getElementById('picker').click()">+</button>
          <span class="cfiles" id="chip"></span>
          <select class="msel" id="modelsel" title="这轮对话用哪个模型"
            onchange="setModel(this.value)"><option value=""></option></select>
          <span class="cspacer"></span>
          <button class="cbtn go" id="send" title="发送" aria-label="发送" onclick="sendChat()">↑</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="pane preview" id="preview">
    <div class="pdrag" id="pdrag" role="separator" aria-label="调节项目上下文宽度"
      aria-orientation="vertical" aria-valuemin="320" aria-valuemax="900" tabindex="0"
      title="拖动或使用方向键调节项目上下文宽度"></div>
    <div class="pbody" id="pbody"></div>
  </aside>
  <button class="pexpand" id="prevExpand" title="展开项目上下文" onclick="togglePreview()" style="display:none">展开上下文</button>
</div>
<input type="file" id="picker" multiple>
<!-- 回传件必须走预审再应用，不能和普通材料上传共用 onchange。 -->
<input type="file" id="returnPicker" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="auditReturnPicked()">

<!-- 侧栏行内菜单（项目的「⋯」、会话的「⋯」）。内容由 openPopMenu 用 DOM API 填，
     项目名/会话标题因此不经过任何拼串，也就没有内联处理器的转义问题。 -->
<div class="popmenu" id="popMenu" hidden></div>

<!-- 登录：未认证时全屏挡住整个应用 -->
<div class="overlay" id="loginOverlay" style="display:none">
  <div class="opanel">
    <h3 id="loginTitle"></h3>
    <p class="cap" id="loginSubtitle"></p>
    <div class="field"><label id="loginUserLabel"></label>
      <input class="input" id="loginUser" type="text" autocomplete="username"></div>
    <!-- 名字：只在注册模式显示（showLogin 控制）。用户名会被后端 lower()，
         称呼人得另存一个原样的 —— 空状态那句问候语用的就是它。 -->
    <div class="field" id="loginNameField" style="display:none"><label id="loginNameLabel"></label>
      <input class="input" id="loginName" type="text" autocomplete="name" maxlength="40"></div>
    <div class="field"><label id="loginPassLabel"></label>
      <input class="input" id="loginPass" type="password" autocomplete="current-password"></div>
    <div class="err" id="loginErr" style="display:none"></div>
    <button class="act pri" id="loginSubmit" style="width:100%;margin-top:8px" onclick="doAuthSubmit()"></button>
    <p class="cap" id="loginToggle" style="text-align:center;margin-top:10px;cursor:pointer;color:var(--accent)"
       onclick="toggleAuthMode()"></p>
    <!-- 从账户菜单主动点开时才给"以后再说"：强制鉴权下这层是闸，不能关 -->
    <p class="cap" id="loginCancel" style="text-align:center;margin-top:2px;cursor:pointer;display:none"
       onclick="closeLogin()"></p>
  </div>
</div>

<!-- 改密码：后端一直有 /api/me/password，界面上一直没有入口 -->
<div class="overlay" id="pwOverlay" style="display:none">
  <div class="opanel">
    <h3 id="pwTitle"></h3>
    <p class="cap" id="pwSubtitle"></p>
    <div class="field"><label id="pwOldLabel"></label>
      <input class="input" id="pwOld" type="password" autocomplete="current-password"></div>
    <div class="field"><label id="pwNewLabel"></label>
      <input class="input" id="pwNew" type="password" autocomplete="new-password"></div>
    <div class="err" id="pwErr" style="display:none"></div>
    <button class="act pri" id="pwSubmit" style="width:100%;margin-top:8px" onclick="doPassword()"></button>
    <p class="cap" id="pwCancel" style="text-align:center;margin-top:10px;cursor:pointer"
       onclick="closePassword()"></p>
  </div>
</div>

<!-- 个人资料：账号自己的称呼。username 是登录标识，这里不碰 -->
<div class="overlay" id="profileOverlay" style="display:none">
  <div class="opanel">
    <h3 id="profTitle"></h3>
    <p class="cap" id="profSubtitle"></p>
    <div class="field"><label id="profAccountLabel"></label>
      <input class="input" id="profAccount" type="text" disabled></div>
    <div class="field"><label id="profNameLabel"></label>
      <input class="input" id="profName" type="text" autocomplete="name" maxlength="40"></div>
    <div class="err" id="profErr" style="display:none"></div>
    <button class="act pri" id="profSubmit" style="width:100%;margin-top:8px" onclick="doProfile()"></button>
    <p class="cap" id="profCancel" style="text-align:center;margin-top:10px;cursor:pointer"
       onclick="closeProfile()"></p>
  </div>
</div>

<!-- 账户管理：仅管理员可见 -->
<div class="overlay" id="accountsModal" style="display:none">
  <div class="opanel wide">
    <div class="modal-head">
      <h3 id="acctTitle"></h3>
      <button class="collapse" onclick="closeAccounts()">×</button>
    </div>
    <div class="modal-body" id="acctBody"></div>
  </div>
</div>

<!-- 设置：外观对所有人开放，网关/模型/预算/环境变量仅管理员可见 -->
<div class="overlay" id="settingsModal" style="display:none">
  <div class="opanel wide">
    <div class="modal-head">
      <h3 id="setTitle"></h3>
      <button class="collapse" onclick="closeSettings()">×</button>
