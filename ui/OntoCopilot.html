<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OntoCopilot</title>
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --line:#e9e7e1; --line-soft:#f0eee9;
  --ink:#1c1c1a; --ink-2:#6b6862; --ink-3:#9d998f;
  --accent:#2f6b4f; --accent-tint:#e9f0ea; --accent-line:#c9dccf;
  --warn:#8a6d1f; --warn-tint:#fdf6e3; --warn-line:#ecdcae;
  --danger:#9c3b32; --danger-tint:#fbeeec;
  --btn:#16150f;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#dedbd3;border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ══ shell ══ */
.app{display:flex;height:100vh;min-width:1120px;overflow-x:auto}
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0}

/* ══ sidebar ══ */
.sidebar{width:222px;flex:0 0 222px;border-right:1px solid var(--line);background:var(--bg)}
.brand{padding:26px 20px 6px}
.brand h1{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.3px}
.brand .meta{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.8px;margin-top:3px}
.newchat{margin:16px 16px 20px;padding:9px;background:var(--btn);color:#fff;border-radius:8px;font-size:13px;text-align:center;transition:opacity .15s}
.newchat:hover{opacity:.85}
.sec{font-size:11px;color:var(--ink-3);padding:0 20px 8px;letter-spacing:.5px}
.convs{flex:1;overflow-y:auto;padding:0 10px}
.conv{padding:9px 10px;border-radius:8px;cursor:pointer;position:relative;margin-bottom:2px}
.conv:hover{background:#f2f0eb}
.conv.on{background:#eeece6;box-shadow:inset 0 0 0 1px var(--line)}
.conv .t{font-size:13px;line-height:1.4}
.conv .s{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.conv .dots{position:absolute;right:8px;top:9px;color:var(--ink-3);opacity:0;letter-spacing:1px;font-size:12px}
.conv:hover .dots{opacity:1}
.side-foot{border-top:1px solid var(--line);padding:12px 20px 16px}
.side-foot .who{font-size:11px;color:var(--ink-3);margin-bottom:9px}
.side-foot .lnks{display:flex;gap:18px}
.side-foot a{font-size:12px;color:var(--ink-2);text-decoration:none;cursor:pointer}
.side-foot a:hover{color:var(--accent)}

/* ══ main ══ */
.main{flex:1 1 auto;min-width:472px;border-right:1px solid var(--line)}
.mhead{display:flex;align-items:center;gap:11px;padding:14px 22px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.ava{width:26px;height:26px;border-radius:7px;background:var(--btn);color:#fff;font-family:var(--mono);font-size:9px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.mhead h2{font-size:14.5px;font-weight:500;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-tint);color:var(--accent);border-radius:20px;padding:4px 11px;font-size:11.5px}
.pill i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.ghost{border:1px solid var(--line);border-radius:7px;padding:4px 11px;font-size:12px;color:var(--ink-2)}
.ghost:hover{background:#f6f4f0}

.stream{flex:1;overflow-y:auto;padding:0 22px}
.wrap{max-width:660px;margin:0 auto;padding:26px 0 20px}

/* empty */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.empty .k{font-family:var(--mono);font-size:10.5px;letter-spacing:2.2px;color:var(--ink-3)}
.empty h3{font-family:var(--serif);font-size:25px;font-weight:400}
.sug{background:var(--accent-tint);color:var(--accent);border:1px solid var(--accent-line);border-radius:20px;padding:7px 17px;font-size:13px}
.sug:hover{background:#dfeae2}

/* messages */
.turn{margin-bottom:26px}
.user{display:flex;justify-content:flex-end}
.user .b{background:#f0eee8;border-radius:13px 13px 3px 13px;padding:9px 14px;max-width:76%;font-size:13.5px}
.user .att{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:5px;text-align:right}

.bot p{margin-bottom:11px}
.bot p:last-child{margin-bottom:0}
.lead{font-family:var(--serif);font-size:16px;line-height:1.75;margin-bottom:13px}

/* trace */
.trace{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;background:#fdfcfa}
.trace>summary{list-style:none;cursor:pointer;padding:8px 13px;display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.4px}
.trace>summary::-webkit-details-marker{display:none}
.trace>summary:hover{background:#f7f5f1}
.trace .car{transition:transform .18s;color:var(--ink-3)}
.trace[open] .car{transform:rotate(90deg)}
.trace .tb{border-top:1px solid var(--line-soft);padding:11px 13px 13px}
.step{display:flex;gap:9px;padding:5px 0;font-size:12.3px;align-items:flex-start}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.6px;padding:2px 5px;border-radius:4px;flex:0 0 auto;margin-top:2px;min-width:50px;text-align:center}
.tag.plan{background:#eef1f6;color:#4a5b76}
.tag.act{background:#f0eee8;color:#6b6255}
.tag.code{background:#eceff0;color:#4a6068}
.tag.crit{background:var(--warn-tint);color:var(--warn)}
.tag.ok{background:var(--accent-tint);color:var(--accent)}
.step code{font-family:var(--mono);font-size:11px;background:#f2f0ec;padding:1px 4px;border-radius:3px}
.step .sub{color:var(--ink-3);font-size:11.5px}

/* cards */
.card{border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:13px;background:var(--panel)}
.card.hi{border-color:var(--warn-line);background:var(--warn-tint)}
.card.gd{border-color:var(--accent-line);background:var(--accent-tint)}
.card h4{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h4 .n{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);font-weight:400;letter-spacing:.6px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-bottom:12px}
.stat{background:var(--panel);padding:10px 11px}
.stat .v{font-family:var(--serif);font-size:20px;line-height:1.2}
.stat .l{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.stat.a .v{color:var(--accent)}
.stat.w .v{color:var(--warn)}
.stat.d .v{color:var(--danger)}

.rows{display:flex;flex-direction:column;gap:0}
.row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;align-items:baseline}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink-2);flex:0 0 96px}
.row .v{flex:1}
.num{font-family:var(--mono);font-size:12px}

.ev{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;background:#f2f0ec;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2);cursor:pointer;vertical-align:1px}
.ev:hover{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent)}

/* clarify */
.q{border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.q .qh{padding:11px 15px 9px;border-bottom:1px solid var(--line-soft)}
.q .qm{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.6px;margin-bottom:5px}
.q .qt{font-size:13.5px;line-height:1.6}
.q .qbody{padding:11px 15px 13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.cmp .c{border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#fdfcfa}
.cmp .c .cl{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-bottom:4px;letter-spacing:.5px}
.cmp .c .cv{font-size:12.5px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.8px}
.opt:hover{background:#f7f5f1}
.opt.sel{background:var(--accent-tint)}
.opt .rd{width:13px;height:13px;border:1.5px solid #c5c1b8;border-radius:50%;flex:0 0 auto;margin-top:4px;position:relative}
.opt.sel .rd{border-color:var(--accent)}
.opt.sel .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
.opt .rr{color:var(--ink-3);font-size:11.5px;margin-top:1px}

/* audit */
.bar{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ret{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:7px}
.ret .rh{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.ret .rh b{font-weight:600}
.ret .rh span{font-family:var(--mono);font-size:11px;color:var(--danger)}
.ret .ri{font-size:11.8px;color:var(--ink-2);padding:2px 0}

.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:12.3px;background:var(--panel)}
.act:hover{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.act.pri{background:var(--btn);color:#fff;border-color:var(--btn)}
.act.pri:hover{opacity:.85;color:#fff}

/* composer */
.comp{flex:0 0 auto;padding:14px 22px 20px}
.cbox{max-width:660px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;align-items:center;gap:11px;padding:9px 9px 9px 13px}
.cbox:focus-within{border-color:#d6d2c8}
.chip{background:var(--accent-tint);color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:2px 8px;font-size:11px;flex:0 0 auto}
.cin{flex:1;font-size:13.3px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cin.ph{color:var(--ink-3)}
.send{background:var(--btn);color:#fff;border-radius:8px;padding:6px 14px;font-size:12.5px;flex:0 0 auto;display:flex;gap:6px;align-items:center}
.send:hover{opacity:.85}
.send.off{background:#ebe9e4;color:var(--ink-3);cursor:default}
.send.off:hover{opacity:1}
.send kbd{font-family:var(--mono);font-size:10px;opacity:.65}

/* ══ preview ══ */
.preview{width:372px;flex:0 0 372px;background:var(--bg);transition:flex-basis .22s,width .22s}
.preview.min{width:42px;flex:0 0 42px}
.phead{display:flex;align-items:center;padding:14px 16px 10px}
.phead .pt{font-size:13px;flex:1}
.phead .cl{color:var(--ink-3);font-size:14px;padding:0 3px}
.phead .cl:hover{color:var(--ink)}
.preview.min .phead{padding:14px 0;justify-content:center}
.preview.min>*:not(.phead){display:none}
.preview.min .pt{display:none}
.vstrip{display:none;writing-mode:vertical-rl;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink-3);margin:14px auto 0;cursor:pointer}
.preview.min .vstrip{display:block}

.tabs{display:flex;background:#f0eee9;border-radius:9px;padding:3px;margin:0 16px 13px}
.tab{flex:1;padding:5px;font-size:12.3px;color:var(--ink-2);border-radius:7px;text-align:center}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pbody{flex:1;overflow-y:auto;padding:0 16px 20px}

.files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.f{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:6px;background:#f0eee9;color:var(--ink-3);cursor:pointer}
.f:hover{background:#e8e5de}
.f.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px #d8d4ca}

.fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.fh .nm{font-size:12.3px}
.fh .st{font-family:var(--mono);font-size:9.5px;color:var(--accent)}
.sheets{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.sh{font-size:10.5px;padding:2px 7px;border-radius:5px;background:#f0eee9;color:var(--ink-3);cursor:pointer}
.sh.on{background:var(--accent-tint);color:var(--accent)}

table.g{width:100%;border-collapse:collapse;font-size:11.3px;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
table.g th{background:#faf9f6;font-weight:400;color:var(--ink-3);font-size:10px;text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)}
table.g td{padding:5px 7px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.g tr:last-child td{border-bottom:none}
table.g td.rn{font-family:var(--mono);font-size:9.5px;color:#c3bfb5;width:26px}
table.g tr.hl td{background:var(--warn-tint)}
table.g tr.hl td.rn{color:var(--warn)}
.cap{font-size:10.5px;color:var(--ink-3);margin-top:7px}

pre.code{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px 11px;font-family:var(--mono);font-size:10.5px;line-height:1.7;overflow-x:auto;color:var(--ink-2)}
pre.code .kw{color:#7a5aa8}.pre .s{color:var(--accent)}
pre.code .s{color:#3f7a56}
pre.code .c{color:#b0aca2}
pre.code mark{background:var(--warn-tint);color:var(--warn);padding:0 2px;border-radius:2px}

.doc{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 13px;font-size:11.8px;line-height:1.85;color:var(--ink-2)}
.doc mark{background:var(--warn-tint);color:var(--ink);padding:1px 3px;border-radius:3px;box-shadow:0 0 0 1px var(--warn-line)}
.doc h5{font-size:12px;color:var(--ink);margin:10px 0 5px;font-weight:600}
.doc h5:first-child{margin-top:0}

.scan{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px;text-align:center}
.scan .box{border:1px dashed #d8d4ca;border-radius:6px;padding:22px 12px;color:var(--ink-3);font-size:11px;font-family:var(--mono);margin-bottom:9px;background:repeating-linear-gradient(0deg,#fbfaf8,#fbfaf8 3px,#f6f4f0 3px,#f6f4f0 6px)}
.ocr{text-align:left;font-size:11px;color:var(--ink-2);line-height:1.8}
.ocr b{font-family:var(--mono);font-size:9.5px;color:var(--accent);font-weight:400}

.elist{display:flex;flex-direction:column;gap:0}
.e{display:flex;gap:9px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line-soft);font-size:12.2px}
.e:last-child{border-bottom:none}
.e .en{flex:1}
.e .ec{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.e .es{font-size:9.5px;font-family:var(--mono);padding:1px 5px;border-radius:4px}
.es.c{background:var(--accent-tint);color:var(--accent)}
.es.p{background:#f0eee8;color:var(--ink-2)}
.es.x{background:var(--danger-tint);color:var(--danger)}

.lg{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:10px;font-size:10.5px;color:var(--ink-2)}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)}
td.yl{background:var(--warn-tint)}
td.gy{background:#f3f1ed;color:var(--ink-3)}
td.cf{position:relative}
td.cf::after{content:"";position:absolute;top:0;right:0;border:4px solid transparent;border-top-color:var(--danger);border-right-color:var(--danger)}

.rule{padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.rule:last-child{border-bottom:none}
.rule .rc{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.5px}
.rule .rt{margin-top:2px}
.rule .rx{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-top:3px}

.ph-empty{text-align:center;color:var(--ink-3);font-size:12px;padding:44px 16px;line-height:1.9}
.ph-empty .ic{font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-bottom:8px;color:#c8c4ba}
</style>
</head>
<body>
<div class="app">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="pane sidebar">
    <div class="brand">
      <h1>OntoCopilot</h1>
      <div class="meta">ONT-112 · FDE 王工</div>
    </div>
    <button class="newchat" onclick="reset()">+ 新会话</button>
    <div class="sec">会话</div>
    <div class="convs">
      <div class="conv on"><div class="t">采购中台 Ontology 梳理</div><div class="s">进行中 · 6 份材料</div><div class="dots">···</div></div>
      <div class="conv"><div class="t">库存域对象补齐</div><div class="s">待业务回传 · 08-04</div><div class="dots">···</div></div>
      <div class="conv"><div class="t">合同域命名对齐</div><div class="s">已归档 · 07-29</div><div class="dots">···</div></div>
    </div>
    <div class="side-foot">
      <div class="who">项目组 · 只读</div>
      <div class="lnks"><a onclick="go('rule')">建模规范</a><a onclick="go('mat')">运行记录</a></div>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="pane main">
    <div class="mhead">
      <div class="ava">OC</div>
      <h2>采购中台 Ontology 梳理</h2>
      <span class="pill" id="hstat"><i></i>Harness 就绪</span>
      <button class="ghost" onclick="reset()">重放</button>
    </div>
    <div class="stream" id="stream"></div>
    <div class="comp">
      <div class="cbox">
        <span class="chip" id="chip">附件 6</span>
        <div class="cin ph" id="cin"></div>
        <button class="send" id="send" onclick="next()">发送 <kbd>↵</kbd></button>
      </div>
    </div>
  </main>

  <!-- ═══ PREVIEW ═══ -->
  <aside class="pane preview" id="prev">
    <div class="phead">
      <span class="pt">预览</span>
      <button class="cl" onclick="togglePrev()">›</button>
    </div>
    <div class="vstrip" onclick="togglePrev()">预览</div>
    <div class="tabs">
      <button class="tab on" data-t="mat" onclick="go('mat')">材料</button>
      <button class="tab" data-t="ent" onclick="go('ent')">实体</button>
      <button class="tab" data-t="tpl" onclick="go('tpl')">模板</button>
      <button class="tab" data-t="rule" onclick="go('rule')">规范</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   剧本：材料梳理 → 反问 3 个建模决策 → 出预填模板
        → 回传审核（68%）→ 打回 + 自动修 → 二轮达标发布
   ═══════════════════════════════════════════════════════════ */

const ev = (f,loc,label) => `<span class="ev" onclick="jump('${f}')">◧ ${label}</span>`;

const SCRIPT = [
/* ── 0 ─────────────────────────────────────────────────── */
{
  input:'这 6 份是采购中台的全部梳理材料，格式很杂，先拆解清洗，告诉我能建出什么',
  att:'实体梳理.xlsx · openapi.json · 流程说明.docx · schema.ddl · er_scan.png · material.csv',
  jump:'mat',
  bot:`
  <div class="lead">6 份都读完了。169 行梳理表里能挑出 46 个候选对象，对齐去重后收敛成 <b>23 个 ObjectType</b>。有两件事你现在就得知道。</div>

  <details class="trace" open>
    <summary><span class="car">›</span>推理轨迹 · 4 阶段 · 11 步 · 38s</summary>
    <div class="tb">

  $('chip').style.display = i === 0 ? '' : 'none';

    : i >= SCRIPT.length ? '<i></i>已发布' : '<i></i>Harness 运行中';

function next(){
  if(i >= SCRIPT.length) return;
  const st = SCRIPT[i], s = $('stream');
  if(i === 0) s.innerHTML = '<div class="wrap" id="wrap"></div>';
  const w = $('wrap');
  w.insertAdjacentHTML('beforeend',
    `<div class="turn user"><div><div class="b">${st.input}</div>${st.att?`<div class="att">◧ ${st.att}</div>`:''}</div></div>`);
  pin();
  setTimeout(()=>{
    w.insertAdjacentHTML('beforeend', `<div class="turn bot">${st.bot}</div>`);
    pin(); if(st.jump) go(st.jump);
  }, 420);
  i++; render();
}

function reset(){ i = 0; tab = 'mat'; file = 'xlsx'; render(); paint(); }

  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));

}

  $('prev').classList.remove('min');

  }
  else {
