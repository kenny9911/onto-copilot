// 切标签页时给预览区来一次淡入。**只在这里调**：paint() 本身会被 SSE 事件反复
// 触发，把淡入常驻在卡片上会让面板跟着每条事件闪（见那条 CSS 的注释）。
//
// **必须同步挂 class，不能等 requestAnimationFrame。** 上一版用双层 rAF 来"重启
// 动画"，结果是：paint() 已经把新内容写进 DOM 了，class 还要两帧后才到 —— 这两帧
// 里内容按 opacity:1 画出来，等 class 一挂，fill-mode:both 立刻套用 from{opacity:0}
// 把它摁灭，再淡入。用户看到的是"先亮一下、灭掉、再浮现"，比不做动画还难看。
// 同步挂上，第一帧画出来就已经是 opacity:0，淡入才是干净的。
//
// 重启动画不需要 rAF：paint() 每次都用 innerHTML 重建子节点，新元素本来就会重新
// 起跑。中间那句强制重排只是兜住"内容没被重建、class 还挂着"的边角情况。
let PFADE_T = null;
function pfade(){
  const b = $("pbody");
  if (!b) return;
  clearTimeout(PFADE_T);
  b.classList.remove("pfade");
  void b.offsetWidth;                       // 强制重排，让动画能重新起跑
  b.classList.add("pfade");
  // **播完必须摘掉。** 留着的话，之后每一次 SSE 触发的 paint() 重画出来的新节点
  // 都会再淡入一遍 —— 那正是这套改法要避免的闪烁，只是换了个地方发作。
  PFADE_T = setTimeout(() => b.classList.remove("pfade"), 400);
}

async function openSource(file, cite){
  // 证据 chip 有时只给 cite、不给文件名（流程图/建议里的引用就是 openSource('', cite)）。
  // cite 形如「文件名!sheet!R1C2」或「文件名#p2」——从前缀兜底出文件名，
  // 否则 file='' 会命中 /source?file= 的 500，而且什么都定位不到。
  if (!file && cite) file = String(cite).split(/[!#]/)[0];
  go("mat"); FILE = file; paint();
  if (file) await loadSource(file);
  if (!cite) return;
  const el = document.querySelector(`[data-cite="${CSS.escape(cite)}"]`);
  if (el) { el.scrollIntoView({block:"center"}); el.style.boxShadow = "0 0 0 2px var(--accent-line)"; }
}


// 打开一份材料时，默认展开第一张有内容的 sheet —— 全折叠等于什么都没显示。
function _openFirstSheet(file){
  const doc = SRC[file];
  if (!doc || !doc.chunks) return;
  const g = groupBySheet(doc.chunks);
  // 跳过纯元数据那张，展开第一张真表
  const first = g.find(x => x.sheet !== "文档元数据") || g[0];
  if (first) MAT_OPEN = new Set([first.sheet]);
}

async function loadSource(file){
  MAT_OPEN = new Set(); MAT_N = 100;
  if (!S || SRC[file]) { _openFirstSheet(file); paint(); return; }
  try { SRC[file] = await j(`/api/sessions/${S.id}/source?file=${encodeURIComponent(file)}`); }
  catch(e){ SRC[file] = {error: e.message, chunks: []}; }
  _openFirstSheet(file);
  paint();
}

function questionWorkbench(){
  const counts = {open:0, answered:0, deferred:0};
  const active = q => ["open","assigned","blocked"].includes(q.status);
  Q_BACKLOG.forEach(q => {
    const bucket = active(q) ? "open" : q.status;
    counts[bucket] = (counts[bucket] || 0) + 1;
  });
  const filtered = Q_BACKLOG.map((q, i) => ({q, i})).filter(({q}) => {
    if (Q_FILTER === "all") return true;
    if (Q_FILTER === "open") return active(q);
    if (Q_FILTER === "high") return active(q) && ["high","blocking"].includes(q.priority);
    return q.status === Q_FILTER;
  });
  const shown = filtered.slice(0, Q_LIMIT);
  const artifacts = (S.state?.artifacts || []).filter(a => /问题|question|ontology|oir\.json|flow\.json|流程图/i.test(a));
  const revision = S.state?.ontology_package?.revision ?? S.state?.artifact_revision
    ?? S.state_version ?? S.revision ?? S.state?.revision?.id;
  const version = revision === undefined || revision === null
    ? "当前会话快照" : `产物 revision ${revision}`;
  const release = releaseView();
  const deliver = `<div class="qdeliver">
    <div class="qtext">访谈清单与当前交付版本</div>
    <div class="qwbsum">${Q_BACKLOG.length} 个问题 · ${artifacts.length} 份关联产物 · ${esc(version)} · ${esc(release.state)}${release.blockers ? `（${release.blockers} 个阻塞项）` : ""}</div>
    <div class="acts">
      ${Q_API ? ["xlsx","md","json"].map(f => `<a class="act" download
        href="${API}/api/sessions/${encodeURIComponent(S.id)}/questions/export?format=${f}">${f.toUpperCase()}</a>`).join("") : ""}
      ${artifacts.slice(0,5).map(a => `<a class="act" download title="${eattr(a)}"
        href="${API}/api/sessions/${encodeURIComponent(S.id)}/artifacts/${encodeURIComponent(a)}">${esc(a)}</a>`).join("")}
      ${bundleLink("Bundle", "act pri")}
      <button class="act" onclick="openReturnPicker()">上传回传模板</button>
    </div></div>`;
  const notice = Q_API ? "" : `<div class="qnotice">兼容模式：已汇总材料问卷与冲突问题；当前后端未启用统一 Question Ledger，分派、延期和自由文本回答暂为只读。</div>`;
  const filters = [
    ["open", `待回答 ${counts.open||0}`], ["high", "高优先级"],
    ["answered", `已回答 ${counts.answered||0}`], ["deferred", `已延期 ${counts.deferred||0}`],
    ["all", `全部 ${Q_BACKLOG.length}`],
  ].map(([k, label]) => `<button class="qfilter ${Q_FILTER===k?"on":""}" onclick="qSetFilter('${k}')">${esc(label)}</button>`).join("");
  const nextBatch = Q_NEXT.length ? `<div class="qnext"><div class="qtext">建议下一批先问</div>
    <div class="qwbsum">按阻塞范围、信息价值与依赖排序</div><ol>${Q_NEXT.slice(0,5).map(q =>
      `<li>${esc(q.text)}${q.role?` · ${esc(q.role)}`:""}</li>`).join("")}</ol></div>` : "";
  const cards = shown.map(({q, i}) => {
    const busy = Q_BUSY.has(q.id), done = ["answered","cancelled"].includes(q.status);
    const needsReopen = ["deferred","blocked"].includes(q.status);
    const statusLabel = {open:"待回答",assigned:"已分派",blocked:"受阻",answered:"已回答",deferred:"已延期",cancelled:"已取消"}[q.status] || q.status;
    const roleOptions = ["", "业务负责人", "流程负责人", "ERP顾问", "数据负责人", "财务/法务", "FDE"];
    if (q.role && !roleOptions.includes(q.role)) roleOptions.push(q.role);
    const evidence = (q.evidence || []).slice(0,3).map(e => {
      const cite = typeof e === "object" ? (e.cite || e.location || e.id || "") : String(e);
      const file = typeof e === "object" ? (e.file_name || e.file || "") : "";
      return cite ? `<button class="ev" data-file="${eattr(file)}" data-cite="${eattr(cite)}"
        onclick="openSource(this.dataset.file,this.dataset.cite)">◧ ${esc(cite)}</button>` : "";
    }).join("");
    return `<div class="qcard ${done?"answered":needsReopen?"deferred":""}" data-qidx="${i}">
      <div class="qmeta">
        <span class="qbadge ${eattr(q.status)}">${esc(statusLabel)}</span>
        <span class="qbadge ${eattr(q.priority)}">${q.priority==="high"||q.priority==="blocking"?"高":q.priority==="low"?"低":"普通"}优先级</span>
        ${q.code ? `<span class="qbadge">${esc(q.code)}</span>` : ""}
        <span class="qbadge">${esc(q.source)}</span>
      </div>
      <div class="qtext">${esc(q.text)}</div>
      ${q.why ? `<div class="qwhy">为什么问：${esc(q.why)}</div>` : ""}
      ${q.impact ? `<div class="qimpact">影响：${esc(q.impact)}</div>` : ""}
      ${q.applies.length ? `<div class="cap">关联：${esc(q.applies.join("、"))}</div>` : ""}
      ${evidence}
      <div class="qfields">
        <input class="qinput" data-q-owner aria-label="负责人" placeholder="负责人 / owner" value="${eattr(q.owner)}" ${busy?"disabled":""}>
        <select class="qselect" data-q-role aria-label="应答角色" ${busy?"disabled":""}>${roleOptions.map(x =>
          `<option value="${eattr(x)}" ${x===q.role?"selected":""}>${esc(x || "应答角色")}</option>`).join("")}</select>
        <select class="qselect" data-q-priority aria-label="优先级" ${busy?"disabled":""}>
          ${[["low","低优先级"],["normal","普通优先级"],["high","高优先级"],["blocking","阻塞交付"]].map(([v,l]) =>
            `<option value="${v}" ${v===q.priority?"selected":""}>${l}</option>`).join("")}</select>
        ${q.options.length ? `<select class="qselect" data-q-option aria-label="参考选项" ${busy||done||needsReopen?"disabled":""}>
          <option value="">选择参考答案（可选）</option>${q.options.map(o =>
            `<option value="${eattr(o.id)}" ${q.answer===o.label?"selected":""}>${esc(o.label)}</option>`).join("")}</select>` : `<span></span>`}
      </div>
      <textarea class="qanswer" data-q-answer aria-label="问题答案" placeholder="记录业务人员的原话；可补充背景、例外和证据" ${busy||done||needsReopen?"disabled":""}>${esc(q.answer)}</textarea>
      <div class="qactions">
        ${done ? `<button class="act" onclick="qReopen(${i})" ${busy?"disabled":""}>重新打开</button>` : `
          ${needsReopen ? `<button class="act pri" onclick="qReopen(${i})" ${busy?"disabled":""}>恢复待答</button>` : `
            <button class="act pri" onclick="qSubmit(${i})" ${busy?"disabled":""}>${busy?"保存中…":"提交回答"}</button>
            <button class="act" onclick="qDefer(${i})" ${busy?"disabled":""}>延期</button>`}`}
        <button class="act" onclick="qSaveMeta(${i})" ${busy?"disabled":""}>保存分派</button>
      </div></div>`;
  }).join("");
  return `<div class="qwbhead"><div><div class="qwbtitle">FDE 问题工作台</div>
      <div class="qwbsum">回答会更新 Decision Ledger，并触发受影响产物的增量重算</div></div>
      <button class="act" onclick="loadQuestions()">刷新</button></div>
    ${deliver}${returnAuditCard()}${nextBatch}${notice}<div class="qfilters">${filters}</div>
    ${cards || `<div class="qempty">这个筛选下没有问题</div>`}
    ${filtered.length > shown.length ? `<button class="qmore" onclick="Q_LIMIT+=40;paint()">再显示 ${Math.min(40, filtered.length-shown.length)} 条</button>` : ""}`;
}

function releaseView(){
  const active = q => ["open","assigned","blocked"].includes(q.status);
  const pending = Q_BACKLOG.filter(active);
  const blockers = pending.filter(q => q.priority === "blocking" || (q.blockedArtifacts || []).length);
  let state = String(S?.state?.release_state || "").toUpperCase();
  // Question Ledger 是当前权威状态：一个已发布版本被重新打开阻塞问题后，旧的
  // release_state 可能仍是 RELEASED，但界面必须立即 fail closed 显示 BLOCKED。
  if (blockers.length) state = "BLOCKED";
  else if (pending.length) state = "DRAFT";
  else if (!["DRAFT","RELEASED"].includes(state)) state = S?.status !== "done"
    ? "DRAFT" : "RELEASED";
  return {state, blockers:blockers.length, pending:pending.length};
}

function bundleLink(label, classes="act"){
  const release = releaseView();
  if (release.state === "BLOCKED") return `<span class="${eattr(classes)} disabled" aria-disabled="true"
    title="${eattr(`${release.blockers} 个阻塞问题尚未处理；问题清单和单份草稿仍可下载`)}">${esc(label)} · BLOCKED</span>`;
  const suffix = release.state === "DRAFT" ? " · DRAFT" : "";
  return `<a class="${eattr(classes)}" download href="${API}/api/sessions/${encodeURIComponent(S.id)}/bundle"
    title="${release.state === "DRAFT" ? "草稿包：仍有非阻塞问题待澄清" : "已通过发布门禁"}">${esc(label)}${suffix}</a>`;
}

function engagementProgress(){
  const engagement = S?.state?.engagement;
  if (!engagement?.plan?.length) return "";
  const labels = {
    INTAKE:"盘点", PROCESS:"流程", ERP_MAP:"ERP 映射", RULES:"规则",
    DATA_OBJECTS:"数据对象", GAP:"缺口", INTERVIEW:"访谈", CANONICALIZE:"规范化",
    REVIEW:"交付审查", EXPORT:"导出",
  };
  const release = releaseView();
  return `<div class="eng"><div class="enghead">
    <div class="engtitle">FDE Engagement 工作流</div>
    <div class="engmeta">${engagement.frozen ? "FROZEN DAG" : "EDITABLE PLAN"} · ${esc(release.state)}${release.blockers ? ` (${release.blockers} BLOCKERS)` : ""} · ${esc(engagement.version || "")}</div>
  </div><div class="engsteps">${engagement.plan.map(n =>
    `<span class="engstep ${eattr(n.state || "pending")}" title="${eattr(n.mode || "")}">${esc(labels[n.id] || n.id)}</span>`
  ).join("")}</div></div>`;
}

function paint(){
  const b = $("pbody");
  if (!S) { b.innerHTML = ph("PREVIEW", "新建会话后这里显示材料与产物"); return; }

  if (TAB === "mat") {
    const fl = S.filelist || [];
    if (!fl.length) { b.innerHTML = ph("MATERIALS", "还没有上传材料<br><br>") +
      `<div style="text-align:center"><button class="act" onclick="document.getElementById('picker').click()">选择文件</button></div>`; return; }
    // 每份材料带一个「×」：传错了要能在开跑前拿掉，只能重传等于逼人重开会话。
    // 也带**解析状态** —— "这份读进来了没有"是个事实，应该看得见，而不是去问助手。
    const MST = {
      parsed:       f => ({t:t("mat.parsed","",{n:f.chunks}), c:"var(--accent)"}),
      scan_pending: () => ({t:t("mat.scanPending"), c:"var(--warn, #9a7a12)"}),
      unread:       () => ({t:t("mat.unread"),      c:"var(--ink-3)"}),
    };
    const chips = fl.map(f => {
      const st = (MST[f.state] || MST.unread)(f);
      return `<span class="f ${f.name===FILE?"on":""}"
        onclick="FILE='${earg(f.name)}';loadSource('${earg(f.name)}')">${esc(f.name)}
        <i style="font-style:normal;font-size:0.778rem;color:${st.c};margin-left:5px">${st.t}</i><b
          onclick="event.stopPropagation();dropMaterial('${earg(f.name)}')"
          title="${t("mat.remove")}" style="margin-left:6px;opacity:.45;cursor:pointer">×</b></span>`;
    }).join("");
    // 一眼能看出还有没有没读进来的，以及该做什么
    const nPend = fl.filter(f => f.state !== "parsed").length;
    const hint = `<div class="cap">${!nPend ? t("mat.allRead")
      : fl.some(f => f.state === "scan_pending") ? t("mat.pendingScan","",{n:nPend})
      : t("mat.pendingText","",{n:nPend})}</div>`;
    const doc = FILE ? SRC[FILE] : null;
    let body;
    if (!FILE) body = hint;
    else if (!doc) body = `<div class="cap">读取中…</div>`;
    else if (doc.error) body = `<div class="fnd">读取失败：${esc(doc.error)}</div>`;
    else {
      // 先给告警（元数据泄漏这类是 FDE 真正要看的），再给**按 sheet 分组的结构**。
      // 一堵 477 张卡片的墙没人看得下去；他要知道的是"这文件有几张表、各是什么"。
      const cs = doc.chunks || [];
      const groups = groupBySheet(cs);
      body = (doc.findings||[]).map(f =>
          `<div class="fnd">! ${esc(f.message)}</div>`).join("")
        + `<div class="cap">${groups.length} 张表 · ${cs.length} 行</div>`
        + groups.map((g, i) => {
            const open = MAT_OPEN.has(g.sheet);
            return `<div class="msheet">
              <div class="mshead" onclick="toggleSheet('${earg(g.sheet)}')">
                <span class="mstri">${open?"▾":"▸"}</span>
                <span class="msname">${esc(g.sheet)}</span>
                ${g.shape ? `<span class="msshape">${esc(g.shape)}</span>` : ""}
                <span class="mscount">${g.rows.length} 行</span></div>
              ${open ? `<div class="msrows">` + g.rows.slice(0, MAT_N).map(c =>
                  `<div class="mrow" data-cite="${eattr(c.cite)}" title="${eattr(c.cite)}">${chunkBody(c)}</div>`).join("")
                + (g.rows.length > MAT_N
                    ? `<button class="act" style="width:100%;margin-top:6px"
                         onclick="event.stopPropagation();MAT_N+=100;paint()">再看 100 行（共 ${g.rows.length}）</button>` : "")
                + `</div>` : ""}
            </div>`;
          }).join("");
    }
    b.innerHTML = `<div class="files">${chips}</div>` + body;
    return;
  }

  if (TAB === "ent") {
    const oir = S.state?.oir;
    if (!oir) { b.innerHTML = ph("ENTITIES", "梳理完成后这里显示抽取出的 ObjectType"); return; }
    const st = oir.stats || {};
    b.innerHTML = `<div class="cap">${st.objects||0} 个对象 · ${st.properties||0} 个属性 · ${st.links||0} 条关系</div><div class="elist">` +
      oir.objects.map(o => `<div class="e"><span class="en">${esc(o.displayName.value)}</span>
        <span class="ec">${esc(o.apiName.value)}</span></div>`).join("") + `</div>` +

      oir.properties.slice(0,40).map(p => `<div class="chunk"><div class="c">${esc(p.apiName.value)}</div>
        ${esc(p.definition.value || "（无口径）").slice(0,180)}</div>`).join("");
    return;
  }
  if (TAB === "cf") {
    const cs = S.state?.conflicts || [];
    if (!cs.length) { b.innerHTML = ph("CONFLICTS", "梳理完成后这里显示检出的冲突"); return; }
    b.innerHTML = cs.map(c => `<div class="chunk" style="border-color:${c.kind==="semantic_divergence"?"var(--warn-line)":"var(--line)"}">
      <div class="c">${esc(c.kind)} · ${esc(c.handling)}</div>${esc(c.summary)}
      ${(c.evidence||[]).slice(0,2).map(e => `<span class="ev" onclick="openSource('${earg(e.file_name)}','${earg(e.cite)}')">◧ ${esc(e.cite)}</span>`).join("")}
      </div>`).join("");
    return;
  }
  if (TAB === "q") {
    b.innerHTML = questionWorkbench();
    return;
  }
  if (TAB === "flow") {
    const fl = S.state?.flow;
    if (!fl) { b.innerHTML = ph("FLOW", "梳理材料后，这里显示抽出的业务流程图"); return; }
    const st = fl.stats || {};
    const grounded = (fl.nodes||[]).filter(n => n.grounded).length;
    const total = (fl.nodes||[]).length;
    const hasMain = (S.state?.artifacts||[]).includes("流程图_主干.svg");
    b.innerHTML = `<div class="cap">${st.actions||0} 个动作 · ${st.events||0} 个事件 · `
      + `${st.stages||0} 个阶段 · ${st.gateways||0} 个判断 · ${st.edges||0} 条边</div>`
      // 证据体检：每个节点有没有材料出处，一眼可见。"不是瞎编"要能核对。
      + `<div class="cap">${grounded}/${total} 个节点有材料依据`
      + (st.inferred_edges ? ` · ${st.inferred_edges} 条边是推断的（虚线，需确认）` : "")
      + `</div>`
      + `<div class="acts" style="margin:8px 0 14px;flex-wrap:wrap">
          <a class="act pri" target="_blank"
             href="${API}/api/sessions/${S.id}/artifacts/${encodeURIComponent("流程图.svg")}">完整图</a>`
      + (hasMain ? `<a class="act" target="_blank"
             href="${API}/api/sessions/${S.id}/artifacts/${encodeURIComponent("流程图_主干.svg")}">主干图</a>` : "")
      + `<a class="act" download
             href="${API}/api/sessions/${S.id}/artifacts/${encodeURIComponent("流程图.mmd")}">mermaid</a>
         </div>`
      + `<div style="height:6px"></div>`
      + (fl.stages||[]).map(sg => {
          const ns = (fl.nodes||[]).filter(n => n.stage === sg.key);
          return `<div class="chunk"><div class="c">${esc(sg.title)}</div>`
            + ns.map((n, i) => `<span class="fnode ${eattr(n.kind)}${n.grounded?"":" guess"}"
                 onclick="flowCite('${earg(sg.key)}',${i})"
                 title="${n.grounded?'点看出处':'系统推断，无出处'}">${esc(n.label?.value || "")}</span>`).join("")
            + `</div>`;
        }).join("")
      + `<div id="fcite" class="fcitebox"></div>`;
    return;
  }
  if (TAB === "think") {
    const workflow = engagementProgress();
    if (!TRACE.length && !OPS.length) {
      b.innerHTML = workflow + ph("REASONING", "问一句话，这里会显示它想了什么、查了什么");
      return;
    }
    // 按轮次分组。不分组的话不同问题的步骤混在一起，步号还会重复 ——
    // 看的人分不清哪一步属于哪个问题。
    const groups = [];
    for (const x of TRACE) {
      const g = groups.find(y => y.turn === x.turn);
      if (g) g.rows.push(x); else groups.push({turn: x.turn, q: x.q, rows: [x]});
    }
    const thinking = groups.reverse().map((g, i) => `
      <div class="tgrp">
        <div class="tgq">${i === 0 ? "" : "· "}${esc(g.q || "")}</div>
        ${g.rows.sort((a, b2) => a.n - b2.n).map(traceRow).join("")}
      </div>`).join("");
    b.innerHTML = workflow + thinking + opsLog();
    return;
  }

  const arts = S.state?.artifacts || [];
  const bundleRow = `<div class="chunk"><div class="c">交付包（含清单与溯源）</div>
      <div class="acts">${bundleLink("导出 Bundle")}
      <button class="act pri" onclick="openReturnPicker()">上传业务方回传模板</button></div></div>`;
  const returnRow = returnAuditCard();
  b.innerHTML = arts.length ? bundleRow + returnRow + arts.map(a => `<div class="chunk"><div class="c">${esc(a)}</div>
      <a class="act" href="${API}/api/sessions/${S.id}/artifacts/${encodeURIComponent(a)}">下载</a></div>`).join("")

    : ph("ARTIFACTS", "编译出模板后这里可以下载");
}

// ── 账户管理（仅管理员） ────────────────────────────────────────
let USERS = [];
let RESET_ID = null;   // 正在给哪个用户重置密码，行内展开一个小表单

function acctError(msg){
  const el = $("acctErr");
  if (!el) return;
  el.textContent = msg; el.style.display = "block";
}

async function openAccounts(){
  RESET_ID = null;
  $("acctTitle").textContent = t("accounts.title");
  $("accountsModal").style.display = "flex";
  await loadUsers();
}
function closeAccounts(){ $("accountsModal").style.display = "none"; }

async function loadUsers(){
  try { USERS = await j("/api/users"); renderAccounts(); }
  catch(e) { $("acctBody").innerHTML = `<div class="fnd">${esc(e.message)}</div>`; }
}

// 账号表。**属性和内联 JS 里一律 eattr，不能用 esc** —— esc 只转 & < >，不转引号，
// 而这里每个值都落在一对单引号中间。用户名只经过 strip().lower()（auth.py），
// 引号一个都没拦：`o'brien` 就能让这一行的 onclick 语法错误、按钮直接失灵，
// 而 `x','');alert(1);//` 是一次对管理员的存储型 XSS —— 他只是打开了账号面板。
function renderAccounts(){
  const rows = USERS.map(u => `
    <div class="trow">
      <span>${esc(u.username)}</span>
      <span><select class="input sm" onchange="changeRole('${earg(u.id)}', this.value)">
        <option value="user" ${u.role==="user"?"selected":""}>${esc(t("role.user"))}</option>
        <option value="admin" ${u.role==="admin"?"selected":""}>${esc(t("role.admin"))}</option>
      </select></span>
      <span><input type="checkbox" ${u.active?"checked":""} onchange="toggleActive('${earg(u.id)}', this.checked)"></span>
      <span class="rowacts">
        ${RESET_ID === u.id ? `
          <span class="inlineform">
            <input class="input sm" id="resetPwInput" type="password" placeholder="${eattr(t("accounts.newPwPrompt"))}">
            <button class="act" onclick="doResetPassword('${earg(u.id)}')">${esc(t("common.confirm"))}</button>
            <button class="act" onclick="cancelReset()">${esc(t("common.cancel"))}</button>
          </span>` : `
          <button class="act" onclick="beginReset('${earg(u.id)}')">${esc(t("accounts.resetPw"))}</button>`}
        <button class="act" onclick="doDeleteUser('${earg(u.id)}','${earg(u.username)}')">${esc(t("accounts.delete"))}</button>
      </span>
    </div>`).join("");
  $("acctBody").innerHTML = `
    <div class="err" id="acctErr" style="display:none"></div>
    <div class="tbl">
      <div class="trow thead">
        <span>${esc(t("accounts.username"))}</span>
        <span>${esc(t("accounts.role"))}</span>
        <span>${esc(t("accounts.active"))}</span>
        <span>${esc(t("accounts.actions"))}</span>
      </div>
      ${rows}
    </div>
    <div class="sgrp">
      <div class="slabel">${esc(t("accounts.add"))}</div>
      <div class="field"><input class="input" id="newUsername" placeholder="${eattr(t("accounts.username"))}"></div>
      <div class="field"><input class="input" id="newPassword" type="password" placeholder="${eattr(t("accounts.password"))}"></div>
      <div class="field"><select class="input" id="newRole">
        <option value="user">${esc(t("role.user"))}</option>
        <option value="admin">${esc(t("role.admin"))}</option>
      </select></div>
      <button class="act pri" onclick="doAddUser()">${esc(t("accounts.addBtn"))}</button>
    </div>`;
}

async function doAddUser(){
  const username = ($("newUsername").value || "").trim();
  const password = $("newPassword").value || "";
  const role = $("newRole").value;
  if (!username || !password) return;
  try {
    await j("/api/users", {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({username, password, role})});
    await loadUsers();
  } catch(e) { renderAccounts(); acctError(/409/.test(e.message) ? t("accounts.errDup") : e.message); }
}

async function changeRole(id, role){
  try { await j(`/api/users/${id}`, {method:"PATCH", headers:{"content-type":"application/json"}, body: JSON.stringify({role})}); await loadUsers(); }
  catch(e) { await loadUsers(); acctError(/409/.test(e.message) ? t("accounts.errLastAdmin") : e.message); }
}

async function toggleActive(id, active){
  try { await j(`/api/users/${id}`, {method:"PATCH", headers:{"content-type":"application/json"}, body: JSON.stringify({active})}); await loadUsers(); }
  catch(e) { await loadUsers(); acctError(/409/.test(e.message) ? t("accounts.errLastAdmin") : e.message); }
}

function beginReset(id){ RESET_ID = id; renderAccounts(); }
function cancelReset(){ RESET_ID = null; renderAccounts(); }
async function doResetPassword(id){
  const val = ($("resetPwInput").value || "");
  if (!val) return;
  try {
    await j(`/api/users/${id}/reset-password`, {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({password: val})});
    RESET_ID = null; await loadUsers();
  } catch(e) { acctError(e.message); }
}

async function doDeleteUser(id, username){
  if (!confirm(`${t("accounts.confirmDelete")} (${username})`)) return;
  try { await j(`/api/users/${id}`, {method:"DELETE"}); await loadUsers(); }
  catch(e) {
    await loadUsers();
    acctError(/409/.test(e.message) ? (/self/i.test(e.message) ? t("accounts.errSelfDelete") : t("accounts.errLastAdmin")) : e.message);
  }
}

// ── 设置（外观对所有人；网关/模型/预算/环境变量仅管理员） ──────────
let SET_TAB = "appearance";
let CONFIG = null;   // GET /api/config 的缓存，只有管理员会去拿

function openSettings(){
  SET_TAB = "appearance";
  $("setTitle").textContent = t("settings.title");
  $("settingsModal").style.display = "flex";
  renderSettingsShell();
}
function closeSettings(){ $("settingsModal").style.display = "none"; }

function switchSetTab(tab){ SET_TAB = tab; renderSettingsShell(); }

function renderSettingsShell(){
  const isAdmin = CURRENT_USER && CURRENT_USER.role === "admin";
  $("setTabs").innerHTML = `
    <button class="stab ${SET_TAB==="appearance"?"on":""}" onclick="switchSetTab('appearance')">${esc(t("appearance.title"))}</button>
    <button class="stab ${SET_TAB==="usage"?"on":""}" onclick="switchSetTab('usage')">${esc(t("usage.title"))}</button>
    ${isAdmin ? `<button class="stab ${SET_TAB==="system"?"on":""}" onclick="switchSetTab('system')">${esc(t("settings.gateway"))}</button>` : ""}`;
  if (SET_TAB === "system" && isAdmin) loadAndRenderConfig();
  else if (SET_TAB === "usage") loadAndRenderUsage();
  else renderAppearanceTab();
}

  const accentPick = localStorage.getItem("oc_accent");

    <div class="sgrp">
      <div class="slabel">${esc(t("appearance.theme"))}</div>

        <button class="act ${theme==="light"?"pri":""}" onclick="setTheme('light')">${esc(t("appearance.theme.light"))}</button>

      </div>
    </div>

      <div class="schoice">
        <button class="act ${!accentPick?"pri":""}" onclick="resetAccent()"
          >${esc(t("appearance.accent.default"))}</button>
        ${Object.keys(ACCENTS).map(k => `<button class="swatch ${accentPick===k?"on":""}"
          title="${eattr(accentName(k))}" aria-label="${eattr(accentName(k))}"

          onclick="setAccent('${k}')"></button>`).join("")}
      </div>
    </div>
    <div class="sgrp">
      <div class="slabel">${esc(t("appearance.font"))}</div>
      <div class="schoice">
        <button class="act ${fs==="s"?"pri":""}" onclick="setFontScale('s')">${esc(t("appearance.font.s"))}</button>
        <button class="act ${fs==="m"?"pri":""}" onclick="setFontScale('m')">${esc(t("appearance.font.m"))}</button>
        <button class="act ${fs==="l"?"pri":""}" onclick="setFontScale('l')">${esc(t("appearance.font.l"))}</button>
      </div>
    </div>
    <div class="sgrp">
      <div class="slabel">${esc(t("appearance.density"))}</div>
      <div class="schoice">
        <button class="act ${density==="comfortable"?"pri":""}" onclick="setDensity('comfortable')">${esc(t("appearance.density.comfortable"))}</button>
        <button class="act ${density==="compact"?"pri":""}" onclick="setDensity('compact')">${esc(t("appearance.density.compact"))}</button>

}

function setTheme(v){ savePref("theme", v); applyAppearance(); renderAppearanceTab(); }
function setAccent(v){ savePref("accent", v); applyAppearance(); renderAppearanceTab(); }
// 回默认：强调色退回 CSS 里深浅各一的那套，主按钮也跟着回到 #16150f / #4a4842。
// 存空串而不是 removeItem —— 空串一样是假值（判定处都当"没选过"），但它会**同步到
// 服务端**：removeItem 只清本地，换台机器登录，旧的强调色又从 prefs 里回来了。
function resetAccent(){ savePref("accent", ""); applyAppearance(); renderAppearanceTab(); }
function setFontScale(v){ savePref("fontscale", v); applyAppearance(); renderAppearanceTab(); }
function setDensity(v){ savePref("density", v); applyAppearance(); renderAppearanceTab(); }
function setTz(v){ savePref("tz", v); renderAppearanceTab(); if (S) loadSessions(); }

// ── 用量：模型调用流水的汇总 ──────────────────────────────────────
let USAGE = null, USAGE_DAYS = 7, USAGE_ROWS_OPEN = false;

async function loadAndRenderUsage(){
  $("setBody").innerHTML = `<div class="cap">${esc(t("usage.loading"))}</div>`;
  try {
    // 一天以内按小时看，否则按天 —— 30 根柱子按小时是 720 根，什么也看不出来
    const bucket = USAGE_DAYS <= 1 ? "hour" : "day";
    USAGE = await j(`/api/usage?days=${USAGE_DAYS}&bucket=${bucket}`);
    renderUsageTab();
  } catch(e) {
    $("setBody").innerHTML = `<div class="fnd">${esc(e.message)}</div>`;
  }
}
function setUsageDays(d){ USAGE_DAYS = d; loadAndRenderUsage(); }
function toggleUsageRows(){ USAGE_ROWS_OPEN = !USAGE_ROWS_OPEN; renderUsageTab(); }

function nfmt(n){
  n = +n || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}

// 按时间的消耗曲线。**手搓 div 柱子，不引任何图表库** —— 这个文件没有打包步骤，
// 也没有任何既有的绘图代码可参照（全文 0 个 <svg>/<canvas>）。
// 颜色一律走 var(--accent)：applyAppearance() 会在运行时把 --accent 改写成用户
// 选的强调色，写死十六进制的话换主题就脱节，深色模式下还会瞎。
function usageChart(series){
  const max = Math.max(1, ...series.map(b => b.tokens));
  const wide = series.length > 40;          // 太密就不画间隙，否则柱子比缝还细
  return `<div class="ubars">${series.map(b => {
    const h = Math.round((b.tokens / max) * 100);
    const lbl = `${b.t} · ${nfmt(b.tokens)} tok · ${b.calls} ${t("usage.callsUnit")}`;
    return `<div class="ubar${wide?" tight":""}" title="${eattr(lbl)}">
      <i style="height:${b.tokens ? Math.max(h, 2) : 0}%"></i></div>`;
  }).join("")}</div>
  <div class="uaxis"><span>${esc(series[0] ? series[0].t : "")}</span>
    <span>${esc(t("usage.peak","",{n: nfmt(max)}))}</span>
    <span>${esc(series.length ? series[series.length-1].t : "")}</span></div>`;
}

function renderUsageTab(){
  const u = USAGE;
  if (!u) return;
  const tot = u.total || {};
  const RANGES = [[1,"usage.d1"],[7,"usage.d7"],[30,"usage.d30"],[90,"usage.d90"]];

  // 金额：**只认网关回的真实账单**。本地价目表对经网关发现的模型是统一编的，
  // 拿它算出来的钱看着精确其实是错的 —— 显示一个假的金额比不显示更糟。
  const money = u.cost_note === "none" ? "" : `
    <div class="sgrp">
      <div class="slabel">${esc(t("usage.cost"))}</div>
      <div class="envtbl"><div class="envrow">
        <b>$${(tot.usd_billed || 0).toFixed(4)}</b>
        <span>${esc(t(u.cost_note === "billed" ? "usage.costAll" : "usage.costPartial",
                      "", {n: tot.billed_calls, total: tot.calls}))}</span>
      </div></div>
    </div>`;

  const rows = u.rows || [];
  $("setBody").innerHTML = `
    <div class="sgrp">
      <div class="slabel">${esc(t("usage.range"))}</div>
      <div class="schoice">${RANGES.map(([d, k]) =>
        `<button class="act ${USAGE_DAYS===d?"pri":""}" onclick="setUsageDays(${d})"
          >${esc(t(k))}</button>`).join("")}</div>
    </div>

    <div class="stats">
      <div class="stat"><b class="v">${nfmt(tot.tokens)}</b><span class="l">${esc(t("usage.tokens"))}</span></div>
      <div class="stat"><b class="v">${nfmt(tot.calls)}</b><span class="l">${esc(t("usage.calls"))}</span></div>
      <div class="stat"><b class="v">${nfmt(tot.tok_in)}</b><span class="l">${esc(t("usage.tokIn"))}</span></div>
      <div class="stat"><b class="v">${nfmt(tot.tok_out)}</b><span class="l">${esc(t("usage.tokOut"))}</span></div>
    </div>
    ${tot.failed ? `<div class="cap">${esc(t("usage.failed","",{n:tot.failed}))}</div>` : ""}

    <div class="sgrp" style="margin-top:16px">
      <div class="slabel">${esc(t("usage.trend"))}</div>
      ${tot.calls ? usageChart(u.series || [])
                  : `<div class="fnd">${esc(t("usage.empty"))}</div>`}
    </div>

    ${(u.by_model || []).length ? `<div class="sgrp">
      <div class="slabel">${esc(t("usage.byModel"))}</div>
      <div class="envtbl">${u.by_model.map(m => {
        const pct = tot.tokens ? Math.round(m.tokens / tot.tokens * 100) : 0;
        return `<div class="envrow">
          <b>${esc(m.name)}</b>
          <span class="ushare"><i style="width:${pct}%"></i></span>
          <span class="unum">${nfmt(m.tokens)}</span>
          <span class="badge">${pct}%</span>
          <span class="badge">${m.calls} ${esc(t("usage.callsUnit"))}</span>
        </div>`; }).join("")}</div>
    </div>` : ""}

    ${(u.by_kind || []).length ? `<div class="sgrp">
      <div class="slabel">${esc(t("usage.byKind"))}</div>
      <div class="envtbl">${u.by_kind.map(k => `<div class="envrow">
        <b>${esc(t("usage.kind." + k.name, k.name))}</b>
        <span class="unum">${nfmt(k.tokens)}</span>
        <span class="badge">${k.calls} ${esc(t("usage.callsUnit"))}</span>
      </div>`).join("")}</div>
    </div>` : ""}

    ${money}

    ${rows.length ? `<div class="sgrp">
      <div class="slabel">${esc(t("usage.detail"))}</div>
      <div class="envtbl">${(USAGE_ROWS_OPEN ? rows : rows.slice(0, 8)).map(r =>
        `<div class="envrow">
          <b>${esc(fmtWhen(r.ts))}</b>
          <span>${esc(r.model)}</span>
          <span class="unum">${nfmt(r.tokens)}</span>
          ${r.attempts > 1 ? `<span class="badge warn">${r.attempts}×</span>` : ""}
          ${r.status !== "ok" ? `<span class="badge danger">${esc(t("usage.failedTag"))}</span>` : ""}
        </div>`).join("")}</div>
      ${rows.length > 8 ? `<button class="act" style="margin-top:6px" onclick="toggleUsageRows()"
        >${esc(USAGE_ROWS_OPEN ? t("table.collapse") : t("table.expand","",{n:rows.length}))}</button>` : ""}
      ${u.truncated ? `<div class="cap">${esc(t("usage.truncated"))}</div>` : ""}
    </div>` : ""}`;
}

async function loadAndRenderConfig(){
  $("setBody").innerHTML = `<div class="cap">…</div>`;
  try { CONFIG = await j("/api/config"); renderConfigForm(); }
  catch(e) { $("setBody").innerHTML = `<div class="fnd">${esc(e.message)}</div>`; }
}

// 「预算」段下面那一行余额。
// 铁律 C1：**查不到就是查不到**。多数网关根本没有余额接口，那是常态不是故障 ——
// 这一行留空会被当成还没加载完，显示 0 会被当成钱花光了，两种都是假消息。
function balanceLine(b){
  const num = v => v !== null && v !== undefined && Number.isFinite(Number(v));
  // known 缺字段时按有没有数来判（老后端 / 字段改名都不该导致误报"没钱"）
  const known = b && (b.known === true
    || (b.known === undefined && (num(b.remaining) || num(b.total) || num(b.used))));
  if (!known) return esc(t("balance.unknown"));
  const cur = b.currency || "USD";
  const bits = [];
  const left = num(b.remaining) ? fmtAmount(b.remaining, cur)
    : (num(b.total) && num(b.used) ? fmtAmount(Number(b.total) - Number(b.used), cur) : "");
  if (left) bits.push(t("balance.remaining", "", {v: left}));
  if (num(b.total)) bits.push(t("balance.ofTotal", "", {v: fmtAmount(b.total, cur)}));
  if (!bits.length) return esc(t("balance.unknown"));
  if (b.source) bits.push("· " + t("balance.source", "", {v: b.source}));
  return esc(bits.join(" "));
}

function renderConfigForm(){
  const c = CONFIG || {};
  const gw = c.gateway || {};
  const tiers = c.tiers || {};
  const catalog = c.catalog || [];
  const budget = c.budget || {};
  const env = c.env || [];
  const tierField = tk => {
    const cur = tiers[tk] || {};
    const opts = [`<option value="">${esc(t("settings.default"))}</option>`]
      .concat(catalog.map(m => `<option value="${eattr(m.name)}" ${cur.model===m.name?"selected":""}>${esc(m.name)}${m.vendor?" · "+esc(m.vendor):""}${m.quality?"/"+esc(m.quality):""}</option>`));
    const tierLabel = "settings.tier" + tk.charAt(0).toUpperCase() + tk.slice(1);
    return `<div class="field">
      <label>${esc(t(tierLabel))}</label>
      <select class="input" id="tier_${tk}">${opts.join("")}</select>
      <span class="cap">${esc(cur.effort || "")}${cur.overridden
        ? `<span class="badge warn">${esc(t("settings.overridden"))}</span>`
        : `<span class="badge">${esc(t("settings.default"))}</span>`}</span>
    </div>`;
  };
  $("setBody").innerHTML = `
    <div class="sgrp"><div class="slabel">${esc(t("settings.gateway"))}</div>
      ${gw.insecure ? `<div class="badge danger">${esc(t("settings.insecure"))}</div>` : ""}
      <div class="field"><label>${esc(t("settings.baseUrl"))}</label>
        <input class="input" id="cfgBaseUrl" value="${eattr(gw.base_url || "")}"></div>
      <div class="field"><label>${esc(t("settings.apiKey"))}</label>
        <input class="input" id="cfgApiKey" type="password" placeholder="${eattr(gw.api_key || "")}">
        <span class="cap">${esc(t("settings.apiKeyHint"))}</span></div>
    </div>
    <div class="sgrp"><div class="slabel">${esc(t("settings.models"))}</div>
      ${tierField("low")}${tierField("medium")}${tierField("high")}${tierField("critical")}
    </div>
    <div class="sgrp"><div class="slabel">${esc(t("settings.budget"))}</div>
      <div class="field"><label>${esc(t("settings.usdCap"))}</label>
        <input class="input" id="cfgUsdCap" type="number" step="0.01" value="${eattr(budget.usd_cap ?? "")}"></div>
      <div class="field"><label>${esc(t("settings.chatUsdCap"))}</label>
        <input class="input" id="cfgChatUsdCap" type="number" step="0.01" value="${eattr(budget.chat_usd_cap ?? "")}"></div>
      <div class="field"><label>${esc(t("balance.label"))}</label>
        <span class="cap">${balanceLine(c.balance)}</span></div>
    </div>
    <div class="sgrp"><div class="slabel">${esc(t("settings.env"))}</div>
      <div class="envtbl">${env.map(e => `<div class="envrow">
        <span class="envname">${esc(e.name)}</span>
        <span class="envval">${esc(e.set ? (e.value ?? "") : "—")}</span>
        ${e.secret ? `<span class="badge">${esc(t("settings.secret"))}</span>` : ""}
        ${e.restart ? `<span class="badge warn">${esc(t("settings.restartRequired"))}</span>` : ""}
      </div>`).join("")}</div>
    </div>
    <div class="saverow">
      <span class="err" id="cfgErr" style="display:none"></span>
      <span class="cap" id="cfgSaved" style="display:none">${esc(t("settings.saved"))}</span>
      <button class="act pri" onclick="saveConfig()">${esc(t("settings.save"))}</button>
    </div>`;
}

async function saveConfig(){
  const errEl = $("cfgErr"), savedEl = $("cfgSaved");
  errEl.style.display = "none"; savedEl.style.display = "none";
  const body = {};
  const baseUrl = ($("cfgBaseUrl").value || "").trim();
  if (baseUrl !== (CONFIG.gateway?.base_url || "")) body.base_url = baseUrl;
  const apiKey = $("cfgApiKey").value || "";
  // api_key 是只写字段：placeholder 就是服务端返回的脱敏串（含"…"），
  // 只有用户真的敲了新值、且这个值不含"…"，才当成一次真实修改发回去。
  if (apiKey && !apiKey.includes("…")) body.api_key = apiKey;
  const models = {};
  for (const tk of ["low","medium","high","critical"]) {
    const sel = $("tier_" + tk);
    const cur = (CONFIG.tiers?.[tk] || {}).model || "";
    if (sel && sel.value !== cur) models[tk] = sel.value;
  }
  if (Object.keys(models).length) body.models = models;
  const usdCapRaw = $("cfgUsdCap").value;
  if (usdCapRaw !== "" && Number(usdCapRaw) !== CONFIG.budget?.usd_cap) body.usd_cap = Number(usdCapRaw);
  const chatCapRaw = $("cfgChatUsdCap").value;
  if (chatCapRaw !== "" && Number(chatCapRaw) !== CONFIG.budget?.chat_usd_cap) body.chat_usd_cap = Number(chatCapRaw);
  try {
    const r = await fetch(API + "/api/config", {method:"PUT", headers:{"content-type":"application/json"}, body: JSON.stringify(body)});
    if (!r.ok) { errEl.textContent = (await r.text()).slice(0,300); errEl.style.display = "block"; return; }
    CONFIG = await r.json();
    renderConfigForm();
    $("cfgSaved").style.display = "inline";
  } catch(e) { errEl.textContent = String(e.message || e); errEl.style.display = "block"; }
}
