// 改密码。后端 /api/me/password 一直存在、也一直没有入口 —— 一个"账户系统"里
// 个人资料。**账号是账号，资料是资料**：username 是登录标识，这里只读地摆出来，
// 能改的只有称呼。注册时填的名字不该是一锤子买卖 —— 打错了、换了称呼都得能改。
function openProfile(){
  const o = $("profileOverlay");
  if (!o || !CURRENT_USER) return;
  $("profTitle").textContent = t("prof.title");
  $("profSubtitle").textContent = t("prof.subtitle");
  $("profAccountLabel").textContent = t("prof.account");
  $("profNameLabel").textContent = t("prof.name");
  $("profSubmit").textContent = t("prof.submit");
  $("profCancel").textContent = t("common.cancel");
  $("profAccount").value = CURRENT_USER.username || "";
  $("profName").value = CURRENT_USER.display_name || "";
  $("profErr").textContent = ""; $("profErr").style.display = "none";
  o.style.display = "flex";
  $("profName").focus();
  $("profName").select();
}
function closeProfile(){ const o = $("profileOverlay"); if (o) o.style.display = "none"; }

async function doProfile(){
  const err = $("profErr");
  const name = ($("profName").value || "").trim();
  err.style.display = "none";
  if (!name) { err.textContent = t("register.needName"); err.style.display = "block"; return; }
  const btn = $("profSubmit");
  btn.disabled = true;
  try {
    const r = await fetch(API + "/api/me/profile", {
      method: "POST", headers: {"Content-Type": "application/json"},
      // 字段名必须是 display_name —— 端点读的就是它，裸 dict 会静默丢掉别的键
      body: JSON.stringify({display_name: name})});
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      err.textContent = d.detail || t("prof.failed");
      err.style.display = "block";
      return;
    }
    const body = await r.json().catch(() => ({}));
    // 就地生效：问候语、左下角、头像首字都读 CURRENT_USER，不用刷新页面
    CURRENT_USER.display_name = (body.user && body.user.display_name) || name;
    closeProfile();
    renderIdentity();
    render();
  } catch(e) {
    err.textContent = String(e.message || e); err.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}

// 用户改不了自己的密码，说不过去。复用登录框那套 .opanel/.field/.input/.err。
function openPassword(){
  const o = $("pwOverlay");
  if (!o) return;
  // 文案在打开时填，不在启动时填 —— 切语言后再打开要跟着变
  $("pwTitle").textContent = t("pw.title");
  $("pwSubtitle").textContent = t("pw.subtitle");
  $("pwOldLabel").textContent = t("pw.old");
  $("pwNewLabel").textContent = t("pw.new");
  $("pwSubmit").textContent = t("pw.submit");
  $("pwCancel").textContent = t("common.cancel");
  $("pwOld").value = ""; $("pwNew").value = "";
  // .err 有底色和边框，空着也会画出一条红条 —— 每次打开都先藏起来，别让人
  // 在还没出错的时候就先看见一个报错框
  $("pwErr").textContent = ""; $("pwErr").style.display = "none";
  o.style.display = "flex";
  $("pwOld").focus();
}
function closePassword(){ const o = $("pwOverlay"); if (o) o.style.display = "none"; }

async function doPassword(){
  const err = $("pwErr");
  const oldp = $("pwOld").value, newp = $("pwNew").value;
  if (newp.length < 6) { err.textContent = t("auth.pwTooShort"); return; }
  const btn = $("pwSubmit");
  btn.disabled = true;
  try {
    const r = await fetch(API + "/api/me/password", {
      method: "POST", headers: {"Content-Type": "application/json"},
      // 字段名必须是 old/new —— /api/me/password 读的就是这两个（authgate.py:293）。
      // 用 old_password/new_password 的话 new 恒为空，服务端在校验旧密码之前就
      // 400「新密码不能为空」，界面把它翻成"改不了，稍后再试"，于是这个功能
      // 对每个人、每一次都是坏的。
      body: JSON.stringify({old: oldp, new: newp})});
    if (!r.ok) {
      err.textContent = r.status === 401 || r.status === 403
        ? t("auth.pwWrong")
        : r.status === 400 ? t("auth.pwTooShort") : t("auth.pwFailed");
      err.style.display = "block";
      return;
    }
    // 改密码会踢掉这个账号的**全部**会话，包括当前这条 —— 直接回登录页，
    // 比让他点下一个按钮时莫名其妙 401 要清楚。
    closePassword();
    location.reload();
  } catch(e) { err.textContent = t("auth.pwFailed"); }
  finally { btn.disabled = false; }
}

async function loadSessions(){
  // 聊天与工作各自一份列表（像 ChatGPT 的对话 vs 项目），按当前模式过滤
  await loadProjects();
  const all = await j("/api/sessions");
  SESSION_LIST = all.filter(s => (s.mode || "work") === MODE);
  paintSessions();
  // 当前会话若不属于本模式，就不强开；否则在当前列表里挑第一个
  if ((!S || (S.mode || "work") !== MODE) && SESSION_LIST.length) openSession(SESSION_LIST[0].id);
  else if (!S) render();
}

// 单独拆出来是为了折叠项目、切语言这类**纯重画**不用再跑一次网络请求。
function paintSessions(){
  syncProjectChrome();
  const emptyHint = MODE === "chat" ? t("sidebar.emptyChat") : t("sidebar.emptyWork");
  const flat = list => list.length ? list.map(convRow).join("")
    : `<div class="cap" style="padding:0 10px">${esc(emptyHint)}</div>`;
  // 平铺只在**两种情况**下发生：聊天模式（不进项目），或后端没有 /api/projects
  // （老版本 server）。**工作模式下即使一个项目都没有也要出分区结构** ——
  // 否则这个功能要等到"你已经有项目了"才现身，而新用户永远迈不出第一步：
  // 侧栏和从前一模一样，唯一入口是一个不起眼的 ＋。
  if (MODE !== "work" || !PROJECTS_OK) { $("convs").innerHTML = flat(SESSION_LIST); return; }
  if (!PROJECTS.length) {
    $("convs").innerHTML =
      `<div class="pjsec">${esc(t("project.section"))}</div>`
      + `<button class="pjcreate" onclick="newProject()">${esc(t("project.createFirst"))}</button>`
      + `<div class="pjsec">${esc(t("project.unfiled"))}</div>`
      + flat(SESSION_LIST);
    return;
  }
  const known = new Set(PROJECTS.map(p => p.id));
  const groups = PROJECTS.map(p => {
    const mine = SESSION_LIST.filter(s => (s.project_id || "") === p.id);
    const off = PJ_OFF.has(p.id);
    return `
      <div class="pjgroup">
        <div class="pjhead${off ? " off" : ""}" onclick="toggleProject('${earg(p.id)}')"
          ondragover="dragOver(event,this)" ondragleave="dragOut(this)"
          ondrop="dropOnProject(event,'${earg(p.id)}')">
          <span class="pjcaret">▾</span>
          <span class="pjname">${esc(p.name)}</span>
          <span class="pjn">${mine.length}</span>
          <button class="pjadd" title="${eattr(t("project.newSessionHere"))}"
            onclick="event.stopPropagation();newSessionIn('${earg(p.id)}')">+</button>
          <button class="pjmore" onclick="event.stopPropagation();projectMenu(event,'${earg(p.id)}')">⋯</button>
        </div>
        ${off ? "" : `<div class="pjbody">${mine.length ? mine.map(convRow).join("")
          : `<div class="cap pjempty">${esc(t("project.empty"))}</div>`}</div>`}
      </div>`;
  }).join("");
  // project_id 指向一个这里看不见的项目（刚被别处删掉、或不属于我）时也归「未归类」——
  // 宁可多露一次面，也不能让一个会话从侧栏凭空消失。
  const loose = SESSION_LIST.filter(s => !known.has(s.project_id || ""));
  // 「未归类」也是一组，同样能收起来。会话攒到几十个之后，一个收不起来的分区会把
  // 下面的项目全顶出屏幕 —— 那时候"分好类了"反而更难找东西。
  const uoff = PJ_OFF.has(UNFILED);
  const loose_html = loose.length ? loose.map(convRow).join("")
    : `<div class="cap pjempty">${esc(
        SESSION_LIST.length ? t("project.noUnfiled") : emptyHint)}</div>`;
  $("convs").innerHTML = groups + `
    <div class="pjgroup">
      <div class="pjhead${uoff ? " off" : ""}" onclick="toggleProject('${UNFILED}')"
        ondragover="dragOver(event,this)" ondragleave="dragOut(this)"
        ondrop="dropOnUnfiled(event)">
        <span class="pjcaret">▾</span>
        <span class="pjname">${esc(t("project.unfiled"))}</span>
        <span class="pjn">${loose.length}</span>
      </div>
      ${uoff ? "" : `<div class="pjbody">${loose_html}</div>`}
    </div>`;
}

function convRow(s){
  const meta = MODE === "chat" ? t("sidebar.chatMeta")
    : `${statusText(s.status)} · ${t("mat.count","",{n:s.files})}`;
  return `
    <div class="conv ${S && s.id===S.id ? "on" : ""}" onclick="openSession('${s.id}')"
      ${PROJECTS_OK && MODE === "work" ? `draggable="true"
        ondragstart="dragSession(event,'${earg(s.id)}')" ondragend="dragEnd(event)"` : ""}>
      <div class="t" title="${eattr(t("session.renameTip"))}"
        ondblclick="event.stopPropagation();renameSession('${earg(s.id)}')">${esc(s.title)}</div>
      <div class="s">${meta}${s.created ? " · " + esc(fmtWhen(s.created)) : ""}</div>
      ${PROJECTS_OK && MODE === "work" ? `<button class="mv" title="${eattr(t("project.moveTo"))}"
        onclick="event.stopPropagation();sessionMenu(event,'${earg(s.id)}')">⋯</button>` : ""}
      <button class="del" title="删除会话"
        onclick="event.stopPropagation();dropSession('${earg(s.id)}','${earg(s.title)}')">×</button>
    </div>`;
}

// ── 项目文件夹 ──────────────────────────────────────────────────
// 拉项目列表。**故意不走 j()**：j() 对非 2xx 直接抛、401 还会弹登录框，而这个
// 接口在旧后端上就是 404 —— 那种情况该安静地退回平铺列表，不是弹一个错。
async function loadProjects(){
  if (MODE !== "work") { PROJECTS = []; return; }   // 聊天模式不进项目（R5）
  try {
    const r = await fetch(API + "/api/projects");
    if (!r.ok) throw new Error(String(r.status));
    PROJECTS = (await r.json()).projects || [];
    PROJECTS_OK = true;
  } catch(e) { PROJECTS = []; PROJECTS_OK = false; }
}

// 「＋建项目」只在后端支持、且在工作模式时露出来
function syncProjectChrome(){
  const b = $("pjnewBtn");
  if (b) b.hidden = !(PROJECTS_OK && MODE === "work");
}

function savePjOff(){ localStorage.setItem("oc_pj_off", JSON.stringify([...PJ_OFF])); }

function toggleProject(pid){
  if (PJ_OFF.has(pid)) PJ_OFF.delete(pid); else PJ_OFF.add(pid);
  savePjOff();
  paintSessions();
}

function closePopMenu(){ const m = $("popMenu"); if (m) { m.hidden = true; m.innerHTML = ""; } }
document.addEventListener("click", e => {
  if (!e.target.closest(".popmenu")) closePopMenu();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopMenu(); });

// items：{label, run, cls?} 或 {sec:"分组标题"}。
// **用 DOM API 而不是拼 innerHTML** —— 菜单项的文字是项目名/会话标题这类自由文本，
// textContent 天然不解析，也就不存在内联处理器里那种转义陷阱。
function openPopMenu(ev, items){
  ev.stopPropagation();   // 否则同一次点击立刻被下面那个 document 监听器关掉
  const m = $("popMenu");
  if (!m) return;
  m.innerHTML = "";
  for (const it of items) {
    if (it.sec !== undefined) {
      const d = document.createElement("div");
      d.className = "pmsec"; d.textContent = it.sec; m.appendChild(d);
      continue;
    }
    const b = document.createElement("button");
    b.className = "acctitem" + (it.cls ? " " + it.cls : "");
    b.textContent = it.label;
    b.title = it.label;                       // 长项目名会被省略号截掉
    if (it.run) b.onclick = () => { closePopMenu(); it.run(); };
    m.appendChild(b);
  }
  // 先显示再量尺寸：贴着屏幕下沿/右沿的那一行否则会把菜单顶出视口
  m.style.left = "0px"; m.style.top = "0px"; m.hidden = false;
  const r = ev.currentTarget.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = (r.bottom + m.offsetHeight + 8 > innerHeight
    ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4) + "px";
}

function projectMenu(ev, pid){
  const p = PROJECTS.find(x => x.id === pid);
  if (!p) return;
  openPopMenu(ev, [
    {label: t("project.rename"), run: () => renameProject(pid)},
    {label: t("project.delete"), cls: "danger", run: () => deleteProject(pid)},
  ]);
}

// 会话行的「⋯」：移入/移出项目。**用菜单不做拖拽** —— 侧栏是滚动容器，
// 拖到一个折叠起来的项目上没有可视目标，菜单反而说得清"现在在哪、能去哪"。
function sessionMenu(ev, sid){
  const s = SESSION_LIST.find(x => x.id === sid);
  if (!s) return;
  const cur = s.project_id || "";
  // 改名放在最上面：双击标题这个手势界面上没有任何可见提示（只有一条 title
  // 悬浮字），菜单是它被发现的地方。聊天模式下这颗 ⋯ 根本不存在（R5：那里
  // 一点项目痕迹都不能有），所以双击才是**每种模式都在**的那条路。
  const items = [{label: t("session.rename"), run: () => renameSession(sid)},
                 {sec: t("project.moveTo")}];
  if (PROJECTS.length) {
    for (const p of PROJECTS) items.push({
      label: p.name, cls: p.id === cur ? "on" : "",
      run: p.id === cur ? null : () => moveSession(sid, p.id)});
  } else {
    items.push({label: t("project.none"), cls: "muted"});
  }
  if (cur) items.push({label: t("project.moveOut"), run: () => moveSession(sid, null)});
  items.push({label: t("project.new"), run: () => newProject(sid)});
  openPopMenu(ev, items);
}

// ── 会话改名 ────────────────────────────────────────────────────
// 侧栏一行只看得见头几十个字，再长的名字在界面上没有任何意义，服务端也要挡。
const SESSION_TITLE_MAX = 120;

// 把新标题就地贴到显示它的**三处**：侧栏那一行、当前会话对象、顶栏 <h2>。
// 不走 loadSessions()：自动命名发生在"第一份材料上传完"和"第一轮对话之后"，
// 那两刻侧栏和中栏正忙着别的事，为改一个字符串再拉一次全量列表既是多余的
// 往返，也会让列表整块闪一下。
function applySessionTitle(sid, title){
  if (!sid || typeof title !== "string" || !title) return;
  let hit = false;
  const row = SESSION_LIST.find(x => x.id === sid);
  if (row && row.title !== title) { row.title = title; hit = true; }
  if (S && S.id === sid && S.title !== title) { S.title = title; hit = true; }
  if (!hit) return;                      // 名字没变就别重画，省掉一次无谓的闪烁
  paintSessions();
  // 顶栏只代表**当前**会话；别的会话改名不该动它。
  if (S && S.id === sid) { const h = $("title"); if (h) h.textContent = title; }
}

// 改名入口有两个：会话行标题上双击（每种模式都在），和工作模式 ⋯ 菜单里那一项。
async function renameSession(sid){
  const known = SESSION_LIST.find(x => x.id === sid) || (S && S.id === sid ? S : null);
  const cur = (known && known.title) || "";
  // 折叠空白，和服务端的规范化保持一致：换行留在标题里没有任何意义，却会把
  // 侧栏那一行撑成两行；不折的话本地会先显示一个服务端并没有存下的样子。
  let name = (prompt(t("session.renamePrompt"), cur) || "").replace(/\s+/g, " ").trim();
  if (!name || name === cur) return;
  // 超长先截断而不是提交完被 400 顶回来 —— 用户当场就能看到"最后叫什么"。
  if (name.length > SESSION_TITLE_MAX) name = name.slice(0, SESSION_TITLE_MAX);
  let saved;
  try {
    saved = await j(`/api/sessions/${encodeURIComponent(sid)}`, {method:"PATCH",
      headers:{"content-type":"application/json"}, body: JSON.stringify({title: name})});
  } catch(e) {
    // 老后端的这条接口对 title 直接 400。**失败时一个字都不许本地改**：
    // 界面上先变成新名字、刷新一下又变回去，比当场说"没改成"更让人困惑。
    alert(t("session.renameFailed"));
    return;
  }
  // 以服务端存下的那个为准（它会再规范化一次），本地那份只是接口没回标题时的兜底。
  applySessionTitle(sid, (saved && saved.title) || name);
}

// moveSid：从会话菜单进来的那次，建完顺手把这个会话放进去 —— 否则用户得再点一遍。
async function newProject(moveSid){
  const name = (prompt(t("project.namePrompt"), "") || "").trim();
  if (!name) return;
  try {
    const p = await j("/api/projects", {method:"POST",
      headers:{"content-type":"application/json"}, body: JSON.stringify({name})});
    if (moveSid && p && p.id) await j(`/api/sessions/${encodeURIComponent(moveSid)}`,
      {method:"PATCH", headers:{"content-type":"application/json"},
       body: JSON.stringify({project_id: p.id})});
  } catch(e) { alert(t("project.failed")); return; }
  await loadSessions();
}

async function renameProject(pid){
  const p = PROJECTS.find(x => x.id === pid);
  if (!p) return;
  const name = (prompt(t("project.renamePrompt"), p.name) || "").trim();
  if (!name || name === p.name) return;
  try {
    await j(`/api/projects/${encodeURIComponent(pid)}`, {method:"PATCH",
      headers:{"content-type":"application/json"}, body: JSON.stringify({name})});
  } catch(e) { alert(t("project.failed")); return; }
  await loadSessions();
}

// 确认框必须把两件后果分开说清楚：**会话不会跟着没**（掉回未归类），
// **项目记忆会跟着没**。只说"删除项目？"的话，前者会让人不敢删，后者会让人乱删。
async function deleteProject(pid){
  const p = PROJECTS.find(x => x.id === pid);
  if (!p) return;
  if (!confirm(t("project.confirmDelete", "", {name: p.name}))) return;
  try { await j(`/api/projects/${encodeURIComponent(pid)}`, {method:"DELETE"}); }
  catch(e) { alert(t("project.failed")); return; }
  PJ_OFF.delete(pid); savePjOff();
  await loadSessions();
}

async function moveSession(sid, pid){
  try {
    await j(`/api/sessions/${encodeURIComponent(sid)}`, {method:"PATCH",
      headers:{"content-type":"application/json"}, body: JSON.stringify({project_id: pid})});
  } catch(e) { alert(t("project.failed")); return; }
  await loadSessions();
}

// ── 拖拽归类 ────────────────────────────────────────────────────
// 菜单那条路留着（键盘/触屏/无障碍都还得靠它），拖拽是**加**上来的一条快路：
// 侧栏里"把这个会话丢进那个文件夹"是空间操作，用菜单要点三下。
let DRAG_SID = null;

function dragSession(ev, sid){
  DRAG_SID = sid;
  ev.dataTransfer.effectAllowed = "move";
  // 必须 setData，否则 Firefox 根本不认这次拖拽
  try { ev.dataTransfer.setData("text/plain", sid); } catch(e) {}
  ev.currentTarget.classList.add("dragging");
}
function dragEnd(ev){ DRAG_SID = null; ev.currentTarget.classList.remove("dragging"); }

function dragOver(ev, el){
  if (!DRAG_SID) return;              // 从桌面拖文件进来的不算，那是上传的活
  ev.preventDefault();                // 不 preventDefault 就不会触发 drop
  ev.dataTransfer.dropEffect = "move";
  el.classList.add("dragover");
}
function dragOut(el){ el.classList.remove("dragover"); }

async function dropOnProject(ev, pid){
  ev.preventDefault();
  ev.currentTarget.classList.remove("dragover");
  const sid = DRAG_SID || (ev.dataTransfer && ev.dataTransfer.getData("text/plain"));
  DRAG_SID = null;
  if (sid) await moveSession(sid, pid);
}

// 「未归类」那一段同样是放置目标 —— 只能进不能出的文件夹是个陷阱。
async function dropOnUnfiled(ev){
  ev.preventDefault();
  ev.currentTarget.classList.remove("dragover");
  const sid = DRAG_SID || (ev.dataTransfer && ev.dataTransfer.getData("text/plain"));
  DRAG_SID = null;
  if (sid) await moveSession(sid, null);
}

// 在某个项目里直接开新会话。等价于「新建会话 + 移进去」，但用户点的是项目上的
// ＋，他的心智是"在这个文件夹里新建"，不该让他建完再自己搬一次。
async function newSessionIn(pid){
  await newSession();
  if (S && S.id) await moveSession(S.id, pid);
}

const statusText = s => t("status." + s, s);

async function newSession(silent){
  S = await j("/api/sessions", {method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({
      title: MODE === "chat" ? t("session.newChat") : t("session.newWork"),
      mode: MODE})});
  S.state = {}; S.events = []; ANSWERS = {}; SRC = {}; FILE = null; PENDING = []; MAT_N = 100;
  S.filelist = []; S.files = 0; PROMPTS = []; FOLLOWUPS = [];
  Q_BACKLOG = []; Q_API = false; Q_FILTER = "open"; Q_LIMIT = 40; Q_NEXT = [];
  RETURN_AUDIT = null; RETURN_FILE = null; RETURN_BUSY = false;
  // 每 per-session 状态都得清，否则会残留上一个会话的内容（推理 tab 尤其明显）
  TRACE = []; OPS = []; STEPS = []; NEEDS_CONFIRM = false; CONFIRM_NEXT = false; stopThinking();
  // 新会话立刻拿开场提示 —— 不然第一屏是个空白输入框
  try { PROMPTS = (await j(`/api/sessions/${S.id}/state`)).prompts || []; } catch(e) {}
  await loadSessions(); connect(); render();
  // silent：文件已经拖进来了，再弹一次选择器是打断
  if (!silent) $("cin")?.focus();
}

async function openSession(id){
  const st = await j(`/api/sessions/${id}/state`);
  S = st; S.events = []; ANSWERS = {}; SRC = {}; FILE = null; PENDING = []; MAT_N = 100;
  // 上一轮的 chips 跟着会话回来（服务端存着）。以前这里写死清空，于是**每次
  // 重开一个聊过的会话、每次刷新，"接下来能问什么"就永久消失** —— 而那正是
  // 最需要它的时刻：隔了一天回来，对着一段旧对话，不知道该接着问什么。
  PROMPTS = st.prompts || []; FOLLOWUPS = st.followups || [];
  Q_BACKLOG = []; Q_API = false; Q_FILTER = "open"; Q_LIMIT = 40; Q_NEXT = [];
  RETURN_AUDIT = null; RETURN_FILE = null; RETURN_BUSY = false;
  // 切会话同样要清掉推理/待确认/思考残留 —— TRACE 是「推理」tab 唯一数据源
  TRACE = []; OPS = []; STEPS = []; NEEDS_CONFIRM = false; CONFIRM_NEXT = false; stopThinking();
  // 视图跟随会话自身的模式（聊天/工作），并同步顶部切换
  if (st.mode && st.mode !== MODE) { MODE = st.mode; localStorage.setItem("oc_mode", MODE); }
  applyMode();
  S.model = st.model || "";
  loadModels();          // 下拉要反映**这个**会话选的模型
  S.files = (st.filelist || []).length;
  await loadSessions(); connect(); render();
  await loadQuestions(); paint();
}

// ── 事件流 ──────────────────────────────────────────────────────
function connect(){
  if (ES) ES.close();
  if (!S) return;
  ES = new EventSource(`${API}/api/sessions/${S.id}/stream?since=0`);
  ES.onmessage = e => {
    const ev = JSON.parse(e.data);
    // 服务端从头重放前先发这一条。EventSource 掉线会自动重连（服务重启、部署、
    // 网络抖一下都会），而重连总是 ?since=0；不清空的话新旧两轮的 seq 会交叠，
    // 同一张表画两遍，其中一份的导出按钮指向一个已经不存在的 seq。
    if (ev.kind === "stream.reset") { S.events = []; OPS = []; TBL_OPEN.clear(); return; }
    S.events = S.events.filter(x => x.seq !== ev.seq).concat([ev]).sort((a,b)=>a.seq-b.seq);
    // 操作记录：**除了对话本身，发生的每一件事都记一笔**，给右栏「推理」用。
    // 对话内容不进来（它在聊天窗口里，抄一遍是噪声），但对话过程中 AI 调了什么
    // 工具、系统改了什么产物、哪一步失败了，都要留痕。
    if (!["chat.turn", "chat.step"].includes(ev.kind)) {
      if (!OPS.some(x => x.seq === ev.seq && x.kind === ev.kind)) {
        OPS.push({seq: ev.seq, kind: ev.kind, ts: ev.ts,
                  label: evLabel(ev.kind), detail: evDetail(ev), tag: evTag(ev.kind)});
        if (OPS.length > OPS_CAP) OPS.splice(0, OPS.length - OPS_CAP);
        if (TAB === "think") paint();
      }
    }
    // 额度提醒条。事件按 seq 顺序到达，所以"先没钱、后又跑通了"的历史会话
    // 重放一遍之后自然停在"跑通了"上，不会挂着一条隔夜的红条。
    if (QUOTA_KINDS.includes(ev.kind)) noteQuota(ev);
    if (ev.kind === "run.completed" || ev.kind === "artifact.ready"
        || (ev.kind === "chat.turn" && ev.turn?.speaker === "assistant")) clearQuota();
    // 自动命名（上传完第一份材料、第一轮对话之后）在服务端发生，改完发这一条。
    // 事件走的是**当前会话**那条流，所以没带会话 id 时它说的就是当前这条。
    if (ev.kind === "session.renamed") applySessionTitle(ev.id || S.id, ev.title);
    if (ev.kind === "clarify.request") { S.state.questions = ev.questions; loadQuestions(); }
    if (ev.kind === "suggest.ready") S.state.suggestions = ev.suggestions;
    if (ev.kind === "chat.step") {
      // 同一步会回调两次（发起时、拿到结果后），按 n 就地更新而不是追加
      const key = x => `${x.turn}#${x.n}`;
      // 后台辅助调用（措辞、推荐问题）**只进「推理」tab，不进对话流**。它们大多
      // 发生在回答落地之后，而 STEPS 在那一刻刚被清空 —— 于是答案下方又冒出一张
      // "想推荐问题：…"的思考卡，像是还没答完。那一栏叫「推理」，它归那儿。
      if (ev.step.turn !== "aux") {
        const i = STEPS.findIndex(x => key(x) === key(ev.step));
        if (i >= 0) STEPS[i] = ev.step; else STEPS.push(ev.step);
      }
      const j = TRACE.findIndex(x => key(x) === key(ev.step));
      if (j >= 0) TRACE[j] = {...ev.step, ts: ev.ts};
      else TRACE.push({...ev.step, ts: ev.ts});
      if (TAB === "think") paint();
    }
    // 梳理过程的内核推理也要进「推理」面板。以前那一栏只认 chat.step（对话侧），
    // 于是抽取跑几分钟、AI 一直在想在查，面板却是空的 —— FDE 分不清"在干活"
    // 还是"卡住了"。这里把内核事件映成同一种行结构，归到「材料梳理」这一轮下。
    if (ev.kind && ev.kind.indexOf("kernel.") === 0) {
      const KROW = {
        "kernel.thought":     x => ({thought: x.detail}),
        "kernel.plan":        x => ({thought: "计划：" + (x.detail || "")}),
        "kernel.observation": x => ({tool: x.node || "查证", observation: x.detail}),
        "kernel.critic":      x => ({observation: "审查：" + (x.detail || "")}),
        "kernel.node_failed": x => ({observation: `${x.node || ""} 失败：${x.detail || ""}`}),
        "kernel.degraded":    x => ({observation: "降级：" + (x.detail || "")}),
      };
      const mk = KROW[ev.kind];
      if (mk) {
        const n = TRACE.filter(x => x.turn === "build").length + 1;
        TRACE.push({turn:"build", q:"材料梳理", n, ...mk(ev), ts: ev.ts});
        if (TAB === "think") paint();
      }
    }
    if (ev.kind === "chat.turn") {
      if (ev.turn.speaker === "assistant") STEPS = [];   // 回答落地，过程收起
      addTurn(ev.turn);
      // 回执到了，撤掉对应的乐观占位
      if (ev.turn.speaker === "user") PENDING = PENDING.filter(x => x.text !== ev.turn.text);
      if (ev.turn.speaker === "assistant") stopThinking();
    }
    // AI 算出的**开场**提示到了，把启发式那批换掉。一轮对话的追问不走这条路 ——
    // 它跟着回答一起从 /chat 回来（res.followups），和答案同一刻上屏，
    // 所以这里不再需要对轮次。
    if (ev.kind === "prompts.ready" && ev.slot === "opening") PROMPTS = ev.questions || [];
    if (ev.kind === "node.completed" && ev.node === "CONFLICT") S.state.conflicts = ev.conflicts;
    if (["run.completed","run.failed","run.suspended","run.cancelled","artifact.ready","human.recorded","question.updated","question.answered","audit.applied"].includes(ev.kind))
      fetch(`${API}/api/sessions/${S.id}/state`).then(r=>r.json()).then(st => {
        mergeStateSnapshot(st);
        S.files = (st.filelist || []).length; loadQuestions(); render(); paint();
      });
    render();
  };
}

// ── 额度提醒条 ──────────────────────────────────────────────────
// 三种事件三种含义，**分清 S1 与 S3 是这一段的全部重点**：
//   quota.exhausted  网关账户真的没钱了 —— 得去网关充值（危险色）
//   quota.low        查得到余额且偏低 —— 提前告知，不阻断（警告色）
//   budget.capped    我们自己在设置里设的花费闸用满了 —— **网关没欠费**（警告色）
// 把 budget.capped 说成"余额不足"，用户会跑去给一个好端端的账户充值，
// 然后回来发现还是跑不动 —— 这是这个功能最容易造成的实际伤害。
// QUOTA / QUOTA_KINDS / QUOTA_STALE_SEC 三个声明**不在这里**，在文件顶上那批
// 全局旁边 —— applyI18n 在 init 同步段里就要读它们，放这儿会撞 TDZ。

function noteQuota(ev){
  const rank = k => (k === "quota.exhausted" ? 2 : 1);
  const ts = +ev.ts || 0;
  if (ts && Date.now() / 1000 - ts > QUOTA_STALE_SEC) return;
  // 已经在喊"没钱了"的时候，别被一条 quota.low 降级成温和的黄条
  if (QUOTA && rank(QUOTA.kind) > rank(ev.kind)) return;
  QUOTA = {
    kind: ev.kind, ts,
    sid: S?.id || null,                       // budget.capped 是这一次运行的事
    detail: String(ev.detail ?? ev.error ?? ev.message ?? "").slice(0, 200),
    amount: ev.remaining ?? ev.balance?.remaining ?? null,
    currency: ev.currency ?? ev.balance?.currency ?? "USD",
    cap: ev.cap ?? ev.usd_cap ?? ev.limit ?? null,
  };
  paintQuotaBar();
}

// 清掉的判据是**证据**，不是时间：网关刚成功回了一次，就说明它有钱。
function clearQuota(){ if (QUOTA) { QUOTA = null; paintQuotaBar(); } }

function dismissQuota(){ clearQuota(); }

function fmtAmount(v, cur){
  const n = Number(v);
  if (v === null || v === undefined || !Number.isFinite(n)) return "";
  cur = String(cur || "USD").toUpperCase();
  if (cur === "USD") return "$" + n.toFixed(2);
  if (cur === "CNY" || cur === "RMB") return "¥" + n.toFixed(2);
  // New-API 那一类返回的是 token 额度，不是美元。换算不确定就**不假装是钱**。
  return t("balance.quotaUnit", "", {v: nfmt(n)});
}

function paintQuotaBar(){
  const el = $("quotaBar");
  if (!el) return;
  // 本地闸是"这一次运行"的事，换到别的会话再挂着它就是句错话
  if (QUOTA && QUOTA.kind === "budget.capped" && QUOTA.sid && QUOTA.sid !== (S?.id || null))
    QUOTA = null;
  if (!QUOTA) { el.hidden = true; el.innerHTML = ""; return; }

  const bad = QUOTA.kind === "quota.exhausted";
  let head, hint, act = "";
  if (bad) {
    head = t("quota.exhausted"); hint = t("quota.exhaustedHint");
  } else if (QUOTA.kind === "quota.low") {
    const amt = fmtAmount(QUOTA.amount, QUOTA.currency);
    head = amt ? t("quota.low", "", {v: amt}) : t("quota.lowGeneric");
    hint = t("quota.lowHint");
  } else {
    const cap = fmtAmount(QUOTA.cap, "USD");
    head = cap ? t("budget.cappedAmount", "", {v: cap}) : t("budget.capped");
    hint = t("budget.cappedHint");
    act = `<button class="qact" onclick="openSettings()">${esc(t("quota.openSettings"))}</button>`;
  }
  el.className = "qbar" + (bad ? " bad" : "");
  el.innerHTML = `<div class="qtxt"><b>${esc(head)}</b> ${esc(hint)}`
    + (QUOTA.detail ? `<span class="qraw">${esc(QUOTA.detail)}</span>` : "")
    + `</div>${act}`
    // 余额不足没有「关掉」：关掉它也照样跑不动，只是把坏消息藏起来。
    // 它自己会在下一次调用成功时消失。
    + (bad ? "" : `<button class="qx" title="${eattr(t("quota.dismiss"))}"
        onclick="dismissQuota()">×</button>`);
  el.hidden = false;
}

// ── FDE 问题工作台 ──────────────────────────────────────────────
// 新 Question Ledger 与历史 OIR/clarify 形态在这里收口。前端后续只认这一种结构，
// 避免每个卡片各自猜字段，也让后端可以渐进迁移已有会话。
const qval = v => (v && typeof v === "object" && "value" in v) ? v.value : (v ?? "");
function normalizeQuestion(raw, source){
  const activeDecision = raw.activeDecision || raw.decision || {};
  const directRaw = qval(raw.answer), ledgerRaw = qval(activeDecision.answer);
  const directAnswer = directRaw == null ? "" : directRaw;
  const ledgerAnswer = ledgerRaw == null ? "" : ledgerRaw;
  const answer = String(directAnswer !== "" ? directAnswer : ledgerAnswer || "").trim();
  let status = String(raw.status || "").toLowerCase().replace(/^status\./, "");
  const ledgerStatus = ["open","assigned","blocked","answered","deferred","cancelled"].includes(status);
  // 统一 Ledger 的显式 lifecycle 赢过历史 Decision（reopen 后仍会保留旧决定）；
  // 只有遗留 OIR/Candidate 形态才用非空 answer 推断已回答。
  if (!ledgerStatus && answer) status = "answered";
  else if (status === "candidate" || status === "draft" || !status) status = "open";
  else if (status === "confirmed") status = "answered";
  else if (status === "rejected") status = "cancelled";
  else if (!["open","assigned","blocked","answered","deferred","cancelled"].includes(status)) status = "open";
  const impactN = Number(raw.blastRadius || raw.blast_radius || raw.impact_count || raw.impactCount || 0);
  let priority = String(raw.priority || raw.severity || "").toLowerCase();
  if (!priority) priority = (raw.blocking || raw.reversible === false || impactN >= 10)
    ? "high" : "normal";
  const options = (raw.options || []).map((o, i) => typeof o === "object"
    ? {id:String(o.id ?? i), label:String(o.label ?? o.value ?? ""), rationale:o.rationale || ""}
    : {id:String(i), label:String(o), rationale:""}).filter(o => o.label);
  const applies = raw.appliesTo || raw.applies_to || raw.blockedArtifacts || [];
  const blockedArtifacts = raw.blockedArtifacts || raw.blocked_artifacts || [];
  return {
    id: String(raw.id || raw.rid || raw.conflict_rid || `q_${source}_${Math.random()}`),
    text: String(qval(raw.text) || raw.title || raw.q || "（未命名问题）"),
    status, priority, answer, options,
    answerSchema: raw.answerSchema || raw.answer_schema || {type:"string"},
    owner: String(raw.ownerUserId || raw.owner_user_id || raw.owner || ""),
    role: String(raw.audienceRole || raw.audience_role || raw.role || raw.audience || raw.askedBy || ""),
    why: String(raw.why || raw.rationale || raw.group || raw.reason || ""),
    impact: String(raw.impact || raw.impactSummary || (impactN ? `影响 ${impactN} 个实体` : "")),
    applies: Array.isArray(applies) ? applies.map(String) : [String(applies)],
    blockedArtifacts: Array.isArray(blockedArtifacts) ? blockedArtifacts.map(String) : [String(blockedArtifacts)],
    evidence: raw.evidence || raw.citations || raw.evidenceIds || raw.evidence_ids || [], code: String(raw.code || ""),
    source: String(raw.sourceKind || raw.source_kind || raw.source || source || "system"), conflictRid: raw.conflict_rid || raw.conflictRid || "",
    revision: raw.revision ?? raw.version ?? raw.updated_at ?? null, raw,
  };
}

function localQuestionBacklog(){
  if (!S) return [];
  const out = [], seen = new Set();
  const add = (raw, source) => {
    const q = normalizeQuestion(raw, source);
    const key = String(q.text || "").trim().toLocaleLowerCase() || q.id;
    if (!seen.has(key)) { seen.add(key); out.push(q); }
  };
  for (const q of (S.state?.oir?.questions || [])) add(q, q.askedBy || "oir");
  const answered = new Set(S.state?.answered || []);
  for (const q of (S.state?.questions || [])) {
    const copy = {...q};
    if (answered.has(q.conflict_rid)) copy.status = "answered";
    add(copy, "conflict");
  }
  return out;
}

async function loadQuestions(){
  if (!S) { Q_BACKLOG = []; Q_API = false; return; }
  const sid = S.id;
  try {
    const r = await fetch(`${API}/api/sessions/${sid}/questions`);
    if (r.status === 401) showLogin();
    if (!r.ok) throw new Error(String(r.status));
    const body = await r.json();
    if (!S || S.id !== sid) return;             // 切会话后的迟到响应不能污染新会话
    const rows = Array.isArray(body) ? body : (body.questions || []);
    Q_BACKLOG = rows.map(q => normalizeQuestion(q, q.source || "ledger"));
    Q_NEXT = (body.nextBatch || body.next_batch || []).map(item => {
      if (typeof item === "string") return Q_BACKLOG.find(q => q.id === item) || null;
      return normalizeQuestion(item, item.source || "ledger");
    }).filter(Boolean);
    Q_API = true;
  } catch(e) {
    if (!S || S.id !== sid) return;
    Q_BACKLOG = localQuestionBacklog(); Q_NEXT = [];
    Q_API = false;
  }
  if (TAB === "q") paint();
}

function qSetFilter(v){ Q_FILTER = v; Q_LIMIT = 40; paint(); }
function qRow(i){ return Q_BACKLOG[i]; }
function qCard(i){ return document.querySelector(`.qcard[data-qidx="${i}"]`); }

async function qRequest(i, path, method, body){
  const q = qRow(i);
  if (!q || !S || Q_BUSY.has(q.id)) return false;
  if (!Q_API) {
    alert("当前服务端尚未启用 Question Ledger；问题可查看和下载，但分派、延期与自由文本回答需要升级后端。");
    return false;
  }
  Q_BUSY.add(q.id); paint();
  try {
    const payload = {...body};
    if (q.revision !== null && q.revision !== undefined) payload.expected_revision = q.revision;
    const r = await fetch(`${API}/api/sessions/${S.id}/questions/${encodeURIComponent(q.id)}${path}`, {
      method, headers:{"content-type":"application/json"}, body:JSON.stringify(payload)});
    if (r.status === 409) throw new Error("问题已被其他人更新，请刷新后重试");
    if (!r.ok) throw new Error((await r.text()).slice(0,240) || `HTTP ${r.status}`);
    await loadQuestions();
    return true;
  } catch(e) { alert(`没有保存：${e.message || e}`); return false; }
  finally { Q_BUSY.delete(q.id); paint(); }
}

async function qDefer(i){

  if (reason === null) return;
  await qRequest(i, "", "PATCH", {status:"deferred", reason});

async function qReopen(i){ await qRequest(i, "/reopen", "POST", {reason:"FDE 重新打开"}); }
async function qSubmit(i){
  const q = qRow(i), card = qCard(i); if (!q || !card) return;
  const answer = card.querySelector("[data-q-answer]")?.value.trim() || "";
  const optionId = card.querySelector("[data-q-option]")?.value || "";
  const option = q.options.find(o => o.id === optionId);
  const text = answer || option?.label || "";
  if (!text) { alert("请先选择选项或填写答案"); return; }
  // 旧冲突卡仍走稳定的 /answer；Ledger API 到位后所有问题统一走 answer endpoint。
  if (!Q_API && q.conflictRid && optionId) {
    try {
      await j(`/api/sessions/${S.id}/answer`, {method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify({conflict_rid:q.conflictRid, option_id:optionId,
          note:answer || "由 FDE 在问题工作台确认", lang:LANG})});
      await refresh();
    } catch(e) { alert(`没有保存：${e.message || e}`); }
    return;
  }
  const allowed = q.answerSchema?.enum || [];
  const typedAnswer = optionId && (q.source === "conflict" || allowed.length)
    ? (allowed.length && !allowed.includes(optionId) && allowed.includes(text) ? text : optionId)
    : text;
  const idem = (globalThis.crypto?.randomUUID?.() || `fde-${Date.now()}-${Math.random()}`);
  await qRequest(i, "/answer", "POST", {
    answer:typedAnswer, answerText:text, option_id:optionId || null,
    actor:"fde", idempotencyKey:idem,
  });
}

async function applyReturnAudit(){
  if (!S || !RETURN_FILE || RETURN_BUSY) return;
  if (!RETURN_AUDIT || RETURN_AUDIT.error || RETURN_AUDIT.readable !== true) {
    alert("请先完成且通过回传件预审；未取得明确可读结果时不会应用任何数据。");
    return;
  }
  const damaged = (RETURN_AUDIT?.damage || []).length;
  if (damaged) {
    alert(`检测到 ${damaged} 处结构损伤，系统不会应用任何数据。请按提示修复模板后重新上传。`);
    return;
  }
  const msg = "确认把预审通过的业务答复写入当前 Ontology，并生成新 revision？";
  if (!confirm(msg)) return;
  RETURN_BUSY = true; paint();
  try {
    const form = new FormData(); form.append("files", RETURN_FILE, RETURN_FILE.name);
    const r = await fetch(`${API}/api/sessions/${S.id}/audit?apply=true`, {method:"POST", body:form});
    if (r.status === 401) showLogin();
    if (!r.ok) throw new Error((await r.text()).slice(0,300) || `HTTP ${r.status}`);
    const applied = await r.json();
    RETURN_AUDIT = {...RETURN_AUDIT, ...applied, applied:true};
    const st = await j(`/api/sessions/${S.id}/state`);
    const evs = S.events; Object.assign(S, st); S.events = evs;
    S.files = (st.filelist || []).length;
    await loadQuestions(); render(); paint();
  } catch(e) {
    RETURN_AUDIT = {...(RETURN_AUDIT || {}), error:String(e.message || e)};
  } finally { RETURN_BUSY = false; paint(); }
}

function cancelReturnAudit(){
  RETURN_AUDIT = null; RETURN_FILE = null; RETURN_BUSY = false;
  const p = $("returnPicker"); if (p) p.value = "";
  paint();
}

function returnAuditCard(){
  if (RETURN_BUSY) return `<div class="retcard"><div class="qtext">正在${RETURN_AUDIT?"应用":"预审"}回传件…</div>
    <div class="cap">先校验锚点、遗漏、结构损伤和非目标变更，不会直接覆盖当前产物。</div></div>`;
  if (!RETURN_AUDIT) return "";
  if (RETURN_AUDIT.error) return `<div class="retcard warn"><div class="qtext">回传件没有通过预审</div>
    <div class="qwhy">${esc(RETURN_AUDIT.error)}</div><div class="qactions">
      <button class="act" onclick="cancelReturnAudit()">关闭</button></div></div>`;
  const a = RETURN_AUDIT;
  const findings = a.findings || a.counts || {};
  const findingN = typeof findings === "number" ? findings : Array.isArray(findings) ? findings.length
    : Object.values(findings).reduce((n, x) => n + (Number.isFinite(Number(x)) ? Number(x) : 0), 0);
  const changed = Number(a.cells_changed ?? a.changed?.length ?? a.applied_count ?? 0);
  const asList = x => Array.isArray(x) ? x : x ? [x] : [];
  const diffs = asList(a.diff || a.diffs || a.changes);
  const dropped = asList(a.dropped || a.unmatched_rows);
  const damage = asList(a.damage);
  const previewBlocked = !a.applied && (a.readable !== true || damage.length > 0);
  const revision = a.revision ?? a.artifact_revision ?? S.state?.artifact_revision;
  return `<div class="retcard ${(damage.length||findingN)?"warn":""}">
    <div class="qtext">${a.applied?"回传答复已应用":"回传件预审"} · ${esc(RETURN_FILE?.name || "")}</div>
    <div class="retstats">
      <div class="retstat"><b>${Math.round(Number(a.completeness || 0)*100)}%</b>完成度</div>
      <div class="retstat"><b>${changed}</b>处变化</div>
      <div class="retstat"><b>${findingN}</b>项待处理</div>
    </div>
    ${damage.length ? `<div class="qimpact">结构损伤 ${damage.length} 处</div><ul class="retlist">${damage.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${diffs.length ? `<div class="qimpact">差异预览（前 ${Math.min(8,diffs.length)} 项）</div><ul class="retlist">${diffs.slice(0,8).map(x=>{
      if (typeof x !== "object") return `<li>${esc(x)}</li>`;
      const at = x.path || [x.rid,x.field].filter(Boolean).join(".") || "字段";
      return `<li>${esc(at)}：${esc(x.before ?? "")} → ${esc(x.after ?? "")}</li>`;
    }).join("")}</ul>` : ""}
    ${dropped.length ? `<div class="qimpact">未合并 / 丢弃 ${dropped.length} 项</div><ul class="retlist">${dropped.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${a.applied ? `<div class="qwhy">已生成 ${revision===undefined?"新":"revision "+revision}；问题清单和关联产物已刷新。</div>` : previewBlocked
      ? `<div class="qwhy">已阻断应用：请恢复隐藏锚点与表结构后重新上传；当前 Ontology 未发生任何变化。</div>`
      : `<div class="qwhy">此时尚未写入 Ontology。确认后才会应用安全差异并生成新 revision。</div>`}
    <div class="qactions">
      ${a.applied ? bundleLink("下载新 Bundle", "act pri")
        : previewBlocked ? "" : `<button class="act pri" onclick="applyReturnAudit()">确认应用并生成新版本</button>`}
      <button class="act" onclick="cancelReturnAudit()">${a.applied?"完成":"取消"}</button>
    </div></div>`;
}

// ── 渲染：中栏 ──────────────────────────────────────────────────
function render(){
  const st = $("status");
  const s = S?.status || "idle";
  st.className = "pill" + (["queued","parsing","extracting"].includes(s) ? " busy" : s==="failed" ? " err" : "");
  st.innerHTML = `<i></i>${esc(S ? statusText(s) : t("status.ready"))}`;
  $("title").textContent = S?.title || "OntoCopilot";
  $("chip").textContent = `附件 ${S?.files ?? 0}`;
  // 输入框永远可用 —— 跑着的时候恰恰是最想插话的时候。
  $("cin").disabled = !S;
  $("cin").placeholder = !S ? "" : t("composer.placeholder");
  $("chip").textContent = S?.files ? t("mat.count", "", {n: S.files}) : "";
  paintSendBtn();
  paintActions();
  paintQuotaBar();     // 换会话时那条「本次上限用满」得跟着走

  const box = $("stream");
  if (!S) { box.innerHTML = ph("NO SESSION", "新建一个会话开始"); return; }

  const dlg = (S.state?.dialogue?.turns || []).filter(t => t.speaker !== "system");
  const hasChat = dlg.length || PENDING.length;

  // 空状态**不再直接 return** —— 用户完全可能还没上传材料就先聊起来（"我手上有
  // 三份材料，先跟你说说背景"），这恰恰是最常见的入口。空状态是一块内容，
  // 不是一个终点。
  let intro = "";
  if (!S.files) {
    // 问候语只在**还没开口**时出现。intro 在有对话时会被钉在消息流最上方
    // （下面 parts 的第一项），不分叉的话「欢迎回来，张三」会永久挂在一段
    // 半年前的五十轮对话顶上。
    intro = `<div class="empty"><h3>OntoCopilot</h3>`
      + (hasChat ? "" : `<div class="esub">${greetLine()}</div>`) + `</div>`;
  } else if (!S.events.length && S.status === "idle") {
    intro = `<div class="empty"><h3>${S.files} 份材料已读完</h3>
      <button class="sug" onclick="startBuild()">开始梳理</button></div>`;
  }
  if (intro && !hasChat) {
    // 空状态也要带提示条 —— 那正是最需要它的时候。上一次这里的 early return
    // 把聊天气泡挡在外面，这次挡的是开场提示，同一类错误。
    box.innerHTML = intro + (PROMPTS.length
      ? `<div class="pchips" style="justify-content:center">${PROMPTS.map(c =>
          `<button class="pchip" onclick="ask(this.dataset.s)"
             data-s="${eattr(c.send || c.text)}">${esc(c.text)}</button>`).join("")}</div>`
      : "");
    return;
  }

  const parts = [`<div class="wrap">`, intro, traceCard()];
  // 待办（决策 + 建议）作为**对话流里的一条消息**，插在梳理刚完成、用户还没
  // 开口那个时间点。用户一旦提问，后面的气泡自然把它推上去 —— 它不再钉在
  // 最下方，而是像所有消息一样往上滚。这是一个连续的聊天窗口，不是两块区域。
  // 待办卡片钉在**它发生的时间点** —— 梳理刚完成、第一句对话之前。之后每一句
  // 对话都排在它后面，自然把它往上推。它不再永远在最下方（那正是用户抱怨的）。
  parts.push(pendingCard());
  for (const it of timeline(dlg)) parts.push(it.html);
  for (const t of PENDING) parts.push(bubble(t));
  if (STEPS.length) parts.push(stepsCard());
  if (THINKING) parts.push(thinkingBubble());
  // CHAT_ABORT 非空 = 这一轮还在路上。答案先由 SSE 上屏、chips 跟着 HTTP 响应
  // 才到，中间那几十~几百毫秒里若照常画，用户会先看到上一轮/开场那批闪一下再
  // 被换掉 —— 就在输入框正上方，整块跳一跳。这一小段索性不画。
  if (!THINKING && !CHAT_ABORT) {
    // 有追问就出追问，没有就退回开场那批。两者不同时出 —— 提示的位置很贵，
    // 占一条就少一条真正有用的。
    //
    // **但不能两者都不出。** 旧逻辑在聊过一句后会把 PROMPTS 直接清空：只要聊过
    // 一句，追问一旦为空（梳理刚跑完、材料刚传完、上一轮出错），聊天窗口就一条
    // 出口都没有 —— 而服务端那时刚算好一批开场提示，正躺在 PROMPTS 里没人用。
    const chips = FOLLOWUPS.length ? FOLLOWUPS : PROMPTS;
    if (chips.length) parts.push(
      `<div class="pchips">${chips.map(c =>
        `<button class="pchip" onclick="ask(this.dataset.s)"
           data-s="${eattr(c.send || c.text)}">${esc(c.text)}</button>`).join("")}</div>`);
  }
  if (NEEDS_CONFIRM && !THINKING) parts.push(
    `<div class="cfm">这一步会改产物或花钱，需要你点头。
      <button class="act pri" onclick="confirmAct()">确认执行</button>
      <button class="act" onclick="NEEDS_CONFIRM=false;render()">先不要</button></div>`);
  parts.push("</div>");
  // 建议/决策**不进消息流** —— 它们以前 push 在流尾，于是永远钉在最下方，
  // 用户重新提问也不动。搬到中栏顶部的独立固定区（paintPending），
  // 消息流归消息流。
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = parts.filter(Boolean).join("");
  markNewBubbles(box);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// 哪些气泡该播入场动画。
//
// 难点在于 render() 是整段重画：每次轮询之后所有气泡都是新造的 DOM，CSS 分不出
// "这条刚到"和"这条已经在屏幕上五分钟了"。所以在 JS 这边记一个数——上次这个会话
// 画出了几条气泡，这次超出的那些才是新的，只给它们加 .in。
//
// 换会话时把计数直接对齐总数：载入一段三十条的历史，不该三十条一起飞进来。
let SEEN_BUBBLES = 0, SEEN_SID = null;
function markNewBubbles(box){
  // **排除「思考中」那颗占位气泡。** 它和真气泡一样是 .bub，但会被答案替换掉：
  // 算进来的话，那一步是「思考中 -1、答案 +1」，净变化为零，于是助手的回答 ——
  // 整个界面上最该被看见的那条 —— 反而是唯一拿不到入场动画的。
  const bubs = box.querySelectorAll(".bub:not(.think)");
  const sid  = S?.id || null;
  if (sid !== SEEN_SID){ SEEN_SID = sid; SEEN_BUBBLES = bubs.length; return; }
  for (let i = SEEN_BUBBLES; i < bubs.length; i++) bubs[i].classList.add("in");
  // 只增不减会让删了消息之后的新气泡不播动画，取当前值而不是取大值。
  SEEN_BUBBLES = bubs.length;
}


// 事件卡片和聊天气泡以前是**两段拼起来的**：先 push 全部事件，再 push 全部气泡。
// 于是一张在对话末尾产生的表（AI 调 ui.table 列出 192 条问题）被画在**整段对话的
// 最上方**，而渲染完又自动滚到底 —— 用户看到的是助手说"请见下表"，下面什么都没有。
// 他两次报"表没画出来"，其实每次都画了，只是画在他看不到的地方。
//
// 两边都带绝对时间戳 ts（事件有，Utterance.to_dict 也有），按它归并成一条时间线。
// 用 ts 而不是 seq：seq 是进程内计数，重启后 s.events 从 0 重新开始，而历史轮次
// 是从库里读回来的 —— 两套 seq 撞在一起就乱了，ts 不会。
function timeline(dlg){
  const isAsst = t => String(t.speaker || "").toLowerCase().includes("assistant");
  const asc = dlg.map(t => ({ts: +t.ts || 0, a: isAsst(t)})).sort((x, y) => x.ts - y.ts);
  const nextTurn = ts => {                       // 紧随这一刻之后的那条发言
    let lo = 0, hi = asc.length;
    while (lo < hi){ const m = (lo + hi) >> 1; if (asc[m].ts > ts) hi = m; else lo = m + 1; }
    return asc[lo] || null;
  };

  const items = dlg.map(t => ({key: +t.ts || 0, ord: 0, html: bubble(t)}));
  S.events.forEach((ev, i) => {
    const ts = +ev.ts || 0;
    // 工具在助手这一轮里产出的卡片，时间上**早于**助手那句话（先调工具后成文），
    // 但读起来属于那句话之后 —— 他写的是"已列出 192 条，见下表"。所以挂到紧随
    // 其后的那条助手发言之后，而不是插在提问和回答中间。梳理过程自己产出的卡片
    // （后面没有助手发言）按自己的时刻排，位置不变。
    const n = nextTurn(ts);
    items.push({key: n && n.a ? n.ts : ts, ord: 1 + i * 1e-6, html: evCard(ev)});
  });
  return items.filter(x => x.html).sort((a, b) => a.key - b.key || a.ord - b.ord);
}

// 值得单独占一张卡片的事件。大多数事件只进推理轨迹那条时间线，
// 只有**需要人读全文**的才升级成卡片：材料里发现的问题、人拍的板、产出的东西。
function evCard(ev){
  if (ev.kind === "corpus.ready") {
    const f = ev.findings || [];
    if (!f.length) return "";
    return `<div class="card"><h4>材料解析<span class="n">${ev.stats?.files ?? 0} 份 · ${ev.stats?.chunks ?? 0} 切片</span></h4>`
      + f.map(x => `<div class="fnd">${esc(x.message)}</div>`).join("") + `</div>`;
  }
  if (ev.kind === "parse.failed")
    return `<div class="card"><h4>解析失败</h4><div class="cap">${esc(ev.error || "")}</div></div>`;
  if (ev.kind === "human.recorded")
    return `<div class="card"><h4>已确认<span class="n">${esc(ev.conflict || "")}</span></h4>
      ${esc(ev.label || "")}
      ${(ev.changed||[]).length ? `<div class="cap">变更 ${esc((ev.changed||[]).join("、"))}</div>` : ""}</div>`;
  if (ev.kind === "artifact.ready") {
    const st = ev.stats || {};
    return `<div class="card"><h4>${esc(ev.name || "产物")}</h4>
      <div class="cap">${st.sheets ?? 0} 张表 · ${st.business_required ?? 0} 格待业务方填写</div>
      <a class="act" href="${API}/api/sessions/${S.id}/artifacts/${encodeURIComponent(ev.name)}">下载</a></div>`;
  }
  if (ev.kind === "audit.applied") {
    const rev = ev.revision ?? ev.artifact_revision ?? "新";
    return `<div class="card"><h4>业务回传已合并<span class="n">revision ${esc(rev)}</span></h4>
      <div class="cap">${ev.changed ?? ev.cells_changed ?? 0} 处变化 · ${ev.dropped?.length ?? 0} 项未合并</div>
      ${bundleLink("下载新 Bundle", "act pri")}</div>`;
  }
  // AI 列清单用的动态表格。**数据由服务端直接从产物出**，不经模型复述 ——
  // 202 个对象让模型一条条打出来，必然截断、还可能记错，而且很贵。
  if (ev.kind === "ui.table") {
    const cols = ev.columns || [], rows = ev.rows || [];
    const N = ev.seq;                       // 每张表独立的“展开”状态
    const shown = (TBL_OPEN.has(N) ? rows : rows.slice(0, 30));
    return `<div class="card"><h4>${esc(ev.title || "清单")}</h4>
      <div style="overflow:auto;max-height:420px;margin-top:6px">
      <table style="border-collapse:collapse;width:100%;font-size:0.926rem">
        <thead><tr>${cols.map(c=>`<th style="text-align:left;padding:5px 8px;
          border-bottom:1px solid var(--line);position:sticky;top:0;
          background:var(--panel);white-space:nowrap">${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${shown.map(r=>`<tr>${r.map(v=>`<td style="padding:5px 8px;
          border-bottom:1px solid var(--line-soft);vertical-align:top">${esc(String(v??""))}</td>`
          ).join("")}</tr>`).join("")}</tbody>
      </table></div>
      ${rows.length > 30 ? `<button class="act" style="margin-top:8px"
        onclick="toggleTable(${N})">${TBL_OPEN.has(N)
          ? t("table.collapse") : t("table.expand","",{n:rows.length})}</button>` : ""}
      <div class="cap" style="margin-top:4px">${t("table.total","",{n:rows.length})}</div></div>`;
  }
  // 对话里导出的文件。**不进产物列表** —— 产物是梳理跑出来的东西，这是他随口要的
  // 一份拷贝，混在一起会让"全部产物"变成一个垃圾堆。
  if (ev.kind === "export.ready")
    return `<div class="card"><h4>${esc(ev.title || ev.name || "导出")}</h4>
      <div class="cap">${esc(ev.label || "")} · ${fmtSize(ev.size)}${
        ev.rows ? ` · ${ev.rows} 行` : ""}</div>
      <a class="act pri" style="margin-top:8px" download
         href="${API}/api/sessions/${S.id}/exports/${encodeURIComponent(ev.name)}"
        >${t("export.download","",{name: ev.name})}</a></div>`;
  if (ev.kind === "run.failed")
    return `<div class="card"><h4>没跑完</h4><div class="cap">${esc(ev.error || "")}</div></div>`;
  if (ev.kind === "session.restored")
    return `<div class="card"><h4>会话已恢复</h4>
      <div class="cap">${ev.files ?? 0} 份材料${ev.stats ? ` · ${ev.stats.objects ?? 0} 个对象` : ""}</div></div>`;
  return "";
}

// ── 事件词汇表：所有事件类型的中文说法，聊天流轨迹和右栏推理共用 ────────
//
// **一处定义，两处用。** 以前只有聊天流那张表有标签，而它只覆盖了一半的事件
// 类型 —— 剩下的靠 `LABEL[kind] || kind` 兜底，于是界面上直接冒出
// `materials.registered`、`prompts.ready` 这种原始 key。用户看到的是内部实现，
// 而这些恰恰是他最想知道"系统刚才干了什么"的时刻。
const EV_LABEL = {
  // 材料
  "files.attached":"收到材料", "materials.registered":"材料已登记",
  "corpus.ready":"读完材料", "corpus.restored":"恢复语料", "parse.failed":"解析失败",
  "session.restored":"恢复会话", "session.renamed":"会话改名",
  "session.rename_failed":"自动命名失败",
  // 梳理流水线
  "plan.frozen":"冻结计划", "node.entered":"进入", "node.completed":"完成",
  "extract.dropped":"抽取时丢弃", "gaps.mined":"挖出缺口",
  "run.completed":"梳理结束", "run.failed":"梳理失败",
  "run.suspended":"挂起等拍板", "run.cancelled":"已取消",
  // 产物
  "artifact.ready":"产物就绪", "artifact.validation_failed":"产物校验失败",
  "flow.ready":"流程图就绪", "flow.linked":"流程接上接口", "flow.from_api":"由接口反推流程",
  "flow.bpmn":"BPMN", "flow.scenes":"流程场景", "flow.skipped":"跳过流程图",
  "flow.step":"流程步骤", "flow.stale_edits":"流程编辑已失效",
  "oir.edited":"改了本体", "oir.stale_edits":"本体编辑已失效",
  "template.edited":"改了模板", "template.stale_edits":"模板编辑已失效",
  "export.ready":"导出文件", "ui.table":"列出表格",
  // 决策与问题
  "clarify.request":"待拍板", "question.answered":"答复问题",
  "human.recorded":"记下决策", "suggest.ready":"给出建议", "prompts.ready":"推荐问题",
  "audit.previewed":"回传预览", "audit.applied":"回传已应用", "audit.completed":"审核完成",
  // Engagement
  "engagement.stage":"交付阶段", "engagement.frozen":"冻结交付计划",
  "engagement.checkpoint_migrated":"迁移检查点",
  // 运行时（出问题时最该看见的那些）
  "quota.low":"额度不足", "quota.exhausted":"额度耗尽", "budget.capped":"到达花费上限",
  "persist.failed":"落库失败", "memory.failed":"记忆写入失败",
  "memory.not_shared":"记忆未共享", "hydrate.partial":"会话恢复不完整",
  "mutation.refresh_failed":"刷新状态失败", "queue.drained":"排队任务已执行",
};

//: 统计字段的中文。JSON 摆在界面上等于没说 —— 用户得自己在脑子里翻译一遍。
const EV_STAT_CN = {objects:"对象", properties:"属性", links:"关系", actions:"行动",
  rules:"规则", questions:"问题", open_questions:"待答", orphans:"孤儿",
  confirmed:"已确认", files:"文件", chunks:"切片", sheets:"表",
  prefilled:"预填", business_required:"业务必填", total_cells:"格",
  clusters:"聚簇", merged_away:"合并", endpoints:"接口", profiles:"列画像"};

function evLabel(kind){
  // 兜底也要像人话：把 `some.thing` 拆成可读的词，而不是原样吐 key
  return EV_LABEL[kind] || String(kind || "").replace(/[._]/g, " ");
}

// 这条事件是好消息、坏消息还是在跑。**失败必须一眼看得出来** ——
// 一屏灰条里混着一条 persist.failed，等于没报。
function evTag(kind){
  const k = String(kind || "");
  // `_failed` 和 `.failed` 是同一件事（session.rename_failed / kernel.node_failed）——
  // 只认点号的话，一屏灰条里混着一条失败等于没报。
  if (k.endsWith(".failed") || k.endsWith("_failed") || k === "quota.exhausted") return "err";
  if (k === "run.suspended" || k === "quota.low" || k === "budget.capped"
      || k === "extract.dropped" || k.endsWith(".stale_edits")) return "warn";
  if (k.endsWith("completed") || k.endsWith(".ready") || k === "corpus.ready") return "ok";
  return "run";
}

function evStats(o){
  return Object.entries(o || {})
    .filter(([k, v]) => v !== 0 && v !== null && EV_STAT_CN[k])
    .map(([k, v]) => `${EV_STAT_CN[k]} ${v}`).join(" · ");
}

// 一条事件的要点。**按事件类型分别说**，不是所有带 questions 的都叫"决策" ——
// 以前 prompts.ready（推荐给用户点的问题）被显示成"2 个决策"，那是两件完全
// 不同的事：一个是聊天框上方的提示，一个是必须人拍板的建模决策。
function evDetail(ev){
  const k = ev.kind;
  if (k === "prompts.ready") return `${(ev.questions || []).length} 条`;
  if (k === "clarify.request") return `${(ev.questions || []).length} 个待拍板`;
  if (k === "suggest.ready") return `${(ev.suggestions || []).length} 条`;
  if (k === "gaps.mined") return `${ev.count ?? 0} 条${ev.groups?.length ? "（" + ev.groups.slice(0,3).join("、") + "）" : ""}`;
  if (k === "files.attached" || k === "materials.registered")
    return (ev.files || []).join("、") || `${(ev.files || []).length} 份`;
  if (k === "export.ready") return ev.name || "";
  if (k === "session.renamed") return ev.title || "";
  if (k === "ui.table") return ev.title || `${(ev.rows || []).length} 行`;
  if (k === "question.answered") return ev.question_id || ev.qid || "";
  if (k === "engagement.stage") return ev.node || "";
  if (k === "node.entered" || k === "node.completed")
    return `${ev.node || ""}${ev.title ? " · " + ev.title : ""}`;
  const stat = evStats(ev.stats);
  if (stat) return stat;
  return ev.error || ev.reason || ev.detail || ev.name || "";
}

// 操作记录 —— **这个会话里发生过的每一件事**，倒序，最新的在最上面。
//
// 它和上面的推理分组是两回事：推理是「AI 想了什么」（每轮一组），操作是
// 「系统做了什么」（一条时间线）。以前后者只在聊天流里那张折叠卡上，
// 而那张卡的标签表只覆盖一半事件、且会随对话滚走 —— 想回头查"刚才那次梳理
// 到底跑了哪几步、哪一步失败了"，没有地方可查。
function opsLog(){
  if (!OPS.length) return "";
  const rows = OPS.slice().reverse().map(o => `
    <div class="oprow">
      <span class="tag ${o.tag}">${esc(o.label)}</span>
      <span class="opd">${esc(o.detail || "")}</span>
      <span class="opt">${esc(hhmm(o.ts))}</span>
    </div>`).join("");
  return `<div class="tgrp opgrp">
    <div class="tgq">操作记录 · ${OPS.length} 条</div>${rows}</div>`;
}

function hhmm(ts){
  const n = Number(ts);
  if (!Number.isFinite(n) || n <= 0) return "";
  const d = new Date(n * 1000);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function traceCard(){
  // 对话事件不进轨迹 —— 轨迹是"系统做了什么"，对话是"我们说了什么"，
  // 混在一起两边都读不清。
  const evs = S.events.filter(e => !["chat.turn","chat.step"].includes(e.kind));
  if (!evs.length) return "";

  const rows = evs.map(ev => {
    const extra = ev.model ? `<div class="sub">${esc(ev.model)} · $${ev.usd}</div>`
      : (d => d ? `<div class="sub">${esc(d)}</div>` : "")(evDetail(ev));
    return `<div class="step"><span class="tag ${evTag(ev.kind)}">${esc(evLabel(ev.kind))}</span>
      <div>${extra}</div></div>`;
  }).join("");
  // 只有几条事件时默认收起 —— 一个只有"附件、读完材料"的展开面板占了半屏，
  // 却什么也没说。完整的操作记录在右栏「推理」里，这里只是就地看一眼。
  return `<details class="trace"${evs.length > 4 ? " open" : ""}>
    <summary>推理轨迹 · ${evs.length} 条</summary><div class="tb">${rows}</div></details>`;
}


// 必须人拍板的决策。选项带证据，点证据能跳回原文。

// 待办卡片：AI 发现的决策与建议，作为对话流里的一条消息。可折叠 ——
// 处理过一轮后它就该让位给对话，而不是一直占半屏。
let PENDING_OPEN = true;
function pendingCard(){
  const q = (S?.state?.questions || []).filter(x =>
    !(S?.state?.answered || []).includes(x.conflict_rid));
  const sg = S?.state?.suggestions || [];
  if (!q.length && !sg.length) return "";
  const head = `${q.length?`${q.length} 个待拍板`:""}${q.length&&sg.length?" · ":""}${sg.length?`${sg.length} 条建议`:""}`;
  return `<div class="pcard">
    <div class="pchead" onclick="PENDING_OPEN=!PENDING_OPEN;render()">
      <span class="ptri">${PENDING_OPEN?"▾":"▸"}</span>
      <span class="pchi">◔</span> 我梳理时发现了这些 · ${head}
    </div>
    ${PENDING_OPEN ? `<div class="pcbody">${questionCards()}${suggestionCards()}</div>` : ""}
  </div>`;
}

function questionCards(){
  const qs = S.state?.questions || [];
  if (!qs.length) return "";
  const answered = new Set(S.state?.answered || []);
  return qs.map((q, i) => {
    const done = answered.has(q.conflict_rid);
    return `<div class="q ${done ? "answered" : ""}">
      <div class="qh">
        <div class="qm">决策 ${i+1}/${qs.length} · 影响 ${q.impact_count} 个实体 · ${q.reversible ? "可逆" : "不可逆"}</div>
        <div class="qt">${esc(q.title)}</div></div>
      <div class="qbody">
        ${(q.options||[]).map(o => `<div class="opt" onclick="${done ? "" : `pick(this,'${q.id}','${o.id}')`}">
          <span class="rd"></span><div>${esc(o.label)}
            ${o.rationale ? `<div class="rr">${esc(o.rationale)}</div>` : ""}
            ${(o.evidence||[]).slice(0,3).map(e => `<span class="ev" onclick="event.stopPropagation();openSource('${earg(e.file_name)}','${earg(e.cite)}')">◧ ${esc(e.cite)}</span>`).join("")}
          </div></div>`).join("")}
        ${done ? `<div class="cap">已确认</div>`
          : `<div class="acts"><button class="act pri" data-submit="${q.id}" disabled
               onclick="submitAnswer('${q.id}','${q.conflict_rid}')">确认</button></div>`}
      </div></div>`;
  }).join("");
}

// 建议：不阻塞流程，排在必答决策之后。**每条都要能直接采纳** ——
// 一个采纳不了的建议不如不给，它让人以为做了决定而实际什么都没发生。
function suggestionCards(){
  const ss = S.state?.suggestions || [];
  if (!ss.length) return "";
  const ICON = {ADD_LINK:"⇢", ASK_MATERIAL:"◱", EXCLUDE:"⊘", NAMING:"Aa",
                BIND_RULE:"§", REVIEW:"◎"};
  return ss.map((x, i) => `<div class="sgc">
    <div class="sgh"><span class="sgi">${ICON[x.kind] || "▸"}</span>
      <span class="sgt">${esc(x.title)}</span>
      <span class="sgm">影响 ${x.impact} · 把握 ${Math.round(x.confidence*100)}%</span></div>
    <div class="sgr">${esc(x.rationale)}</div>
    ${(x.citations||[]).slice(0,3).map(c =>
      `<span class="ev" onclick="openSource('', '${earg(c)}')">◧ ${esc(c)}</span>`).join("")}
    ${x.kind === "ASK_MATERIAL" ? "" :
      `<div class="acts"><button class="act" onclick="adopt(${i+1})">采纳</button></div>`}
  </div>`).join("");
}

// 采纳走对话通道，和用户自己打字说「第 N 条建议采纳」完全同一条路径 ——
// 两条路径会漂移，而漂移的那天你不会知道该信哪个。
async function adopt(n){
  const el = $("cin");
  el.value = `第${n}条建议采纳`;
  await sendChat();
}


const ph = (k, t) => `<div class="ph"><div class="ic">${k}</div>${t}</div>`;



// 拖拽上传。"把文件拖进来"是这类工具的默认预期 —— 让人去找一个「附件」按钮
// 是多余的一步。整个中栏都是投放区，不只是输入框那一小条。
function bindDrop(){
  const zone = document.querySelector(".main");
  const box = document.querySelector(".cbox");
  let depth = 0;   // dragenter/dragleave 会在子元素间反复触发，用计数而不是布尔
  zone.addEventListener("dragover", e => { e.preventDefault(); });
  zone.addEventListener("dragenter", e => {
    e.preventDefault();
    if (++depth === 1) box.classList.add("drag");
  });
  zone.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; box.classList.remove("drag"); } });
  zone.addEventListener("drop", async e => {
    e.preventDefault(); depth = 0; box.classList.remove("drag");
    const fs = [...(e.dataTransfer?.files || [])];
    if (!fs.length) return;
    if (!S) await newSession(true);
    await uploadFiles(fs);
  });
}

async function uploadFiles(list){
  const fd = new FormData();
  for (const f of list) fd.append("files", f);
  $("chip").textContent = "读取中…";
  const r = await j(`/api/sessions/${S.id}/files`, {method:"POST", body: fd});
  S.files = r.files.length; S.filelist = r.files;
  PROMPTS = r.prompts || PROMPTS; FOLLOWUPS = [];   // 材料进来了，能问的完全变了
  render(); go("mat");
  // **上传不自动开跑。** FDE 传完还要增删材料、还要写一句话说清这轮要什么
  // （"重点看采购包的状态流转"），那句话正是梳理的输入。自动开始等于替他
  // 决定，而且把他还没传完的材料先跑一遍。他写完 prompt 发出来，或点
  // 「开始梳理」，再跑。
}

// ── 模型选择 ────────────────────────────────────────────────────
// 「自动」= 按难度路由。选了具体模型就用它对话。**梳理管线不受影响** ——
// 扫描件 OCR 这类需要视觉的环节仍按能力自动挑带视觉的模型，否则选了个纯文本
// 模型就等于把 OCR 关掉了。
let MODELS = [];
async function loadModels(){
  try {
    const r = await j("/api/models");
    MODELS = r.models || [];
    const sel = $("modelsel");
    if (!sel) return;
    const cur = (S && S.model) || "";
    sel.innerHTML = `<option value="">${esc(t("model.auto"))}</option>` + MODELS.map(m =>
      `<option value="${eattr(m.name)}"${m.name===cur?" selected":""}>${esc(m.name)}${
        (m.capabilities||[]).includes("vision") ? " 👁" : ""}</option>`).join("");
  } catch(e) { /* 模型列表拉不到不该挡住输入框 */ }
}

async function setModel(name){
  if (!S) return;
  try {
    await j(`/api/sessions/${S.id}/model`, {method:"POST",
      headers:{"content-type":"application/json"}, body: JSON.stringify({model:name})});
    S.model = name;
  } catch(e){ alert("没能切换模型：" + e.message); }
}

// 开跑前撤掉一份材料。传错/传多了要能拿掉，不必重开会话。
async function dropMaterial(name){
  if (!S) return;
  if (!confirm(`移除材料「${name}」？`)) return;
  try {
    const r = await j(`/api/sessions/${S.id}/files/${encodeURIComponent(name)}`,
                      {method:"DELETE"});
    S.filelist = r.files; S.files = r.files.length;
    // 材料少了一份，能问的也就变了 —— 和上传那条路对称地换掉提示
    PROMPTS = r.prompts || PROMPTS; FOLLOWUPS = [];
    if (FILE === name) { FILE = null; }
    render(); paint();
  } catch(e){ alert("没能移除：" + e.message); }
}

// ── 对话 ────────────────────────────────────────────────────────
// 输入框在梳理进行中也可用。发出去的话不阻塞流水线，后端按意图决定是立即执行
// 还是排到本轮结束 —— 前端不做这个判断。
async function sendChat(){
  const el = $("cin");
  const text = (el.value || "").trim();
  if (!text) return;
  // 没会话就建一个 —— 想说话之前先点「新会话」是多余的一步
  if (!S) await newSession(true);
  el.value = ""; autoGrow(el);
  // 乐观上屏：网络往返期间用户要能看见自己说了什么，否则会以为没发出去
  PENDING.push({speaker:"user", text, pending:true});
  STEPS = [];
  // 上一轮的追问在这一刻就作废：它们是**针对上一个回答**的。留着的话，这一轮
  // 若被停止或发失败，屏幕上会浮出一批看似新鲜、其实答非所问的旧提示。
  // 清空不会留下空档 —— 思考中本来就不画 chips，落地时 res.followups 顶上，
  // 顶不上还有 PROMPTS。
  FOLLOWUPS = [];
  startThinking();
  // 每一轮挂一个 AbortController，停止按钮据此 abort 掉这条 fetch，前端不再干等。
  CHAT_ABORT = new AbortController();
  try {
    const res = await j(`/api/sessions/${S.id}/chat`, {method:"POST",
      headers:{"content-type":"application/json"},
      signal: CHAT_ABORT.signal,
      body: JSON.stringify({text, confirm: CONFIRM_NEXT, lang:LANG})});
    // 确认是**一轮限定**的，不是给会话开长期后门
    CONFIRM_NEXT = false;
    // 被停止：占位气泡由 SSE 的「（已停止）」chat.turn 接管。提示还是要收下 ——
    // 停下来之后「接下来干什么」比平时更需要一个出口。
    FOLLOWUPS = res.followups || [];
    if (res.stopped) return;
    NEEDS_CONFIRM = !!res.needs_confirm;
  } catch(e) {
    // 是我们自己 abort 的（点了停止），不是错误 —— 别弹"没发出去"
    if (e.name === "AbortError") return;
    PENDING.push({speaker:"assistant", text:"没发出去：" + e.message, error:true});
  } finally {
    CHAT_ABORT = null;
    stopThinking();
    render();
  }
}

// 发送 ⇄ 停止：一个按钮四种状态。**前景优先** —— 对话轮在跑就先停它；否则输入框
// 有字就是发送（梳理跑着也能插话，这是这产品的定义性交互）；再否则梳理在跑就停梳理。
function paintSendBtn(){
  const btn = $("send");
  if (!btn) return;
  const hasText = ($("cin")?.value || "").trim().length > 0;
  const runActive = ["queued","parsing","extracting"].includes(S?.status);
  const mode = THINKING ? "stopChat"
             : hasText  ? "send"
             : runActive ? "stopRun"
             : "send";
  const stop = mode !== "send";
  btn.classList.toggle("stop", stop);
  btn.textContent = stop ? "■" : "↑";
  btn.title = stop ? t("composer.stop","停止") : t("composer.send","发送");
  btn.disabled = !S;
  btn.onclick = mode === "stopChat" ? stopChat
              : mode === "stopRun"  ? stopRun
              : sendChat;
  // 输入框的流光跟"有没有事在跑"同步。**状态源就用这里已经算好的两个** ——
  // 另起一套判断迟早会和按钮的形态对不上（按钮显示■、边框却不亮）。
  document.querySelector(".cbox")?.classList.toggle("thinking", THINKING || runActive);
}

// 停对话轮：abort 掉自己那条 fetch（立刻不等），再并发 /stop 让服务端真的停下来。
async function stopChat(){
  if (!S) return;
  CHAT_ABORT?.abort();
  stopThinking();
  try {
    await j(`/api/sessions/${S.id}/stop`, {method:"POST",
      headers:{"content-type":"application/json"}, body: JSON.stringify({target:"chat"})});
  } catch(e) { /* 停止本身失败无所谓，abort 已让前端归位 */ }
  // abort 把那条 /chat 的响应连同它带的 chips 一起丢了 —— 服务端为这一轮算好的
  // 那批只落进了会话状态。去把它取回来，否则停止之后剩下的是一批开场白：
  // 第一条往往正是他十轮前问过的那句。
  try {
    const st = await j(`/api/sessions/${S.id}/state`);
    FOLLOWUPS = st.followups || [];
  } catch(e) { /* 取不回就退回 PROMPTS，render 那边有兜底 */ }
  render();
}

// 停梳理任务：状态与事件由 SSE 的 run.cancelled + /state 刷新驱动，这里只发指令。
async function stopRun(){
  if (!S) return;
  try {
    await j(`/api/sessions/${S.id}/stop`, {method:"POST",
      headers:{"content-type":"application/json"}, body: JSON.stringify({target:"run"})});
  } catch(e) { /* 忽略 */ }
}


// 点一条提示 = 把它当成用户自己打的字发出去。**不走特殊路径** ——
// 特殊路径会和手打的行为漂移，而漂移的那天你不知道该信哪个。
async function ask(text){
  const el = $("cin");
  el.value = text;
  await sendChat();
}

async function confirmAct(){
  CONFIRM_NEXT = true; NEEDS_CONFIRM = false;
  $("cin").value = "确认执行";
  await sendChat();
}

function autoGrow(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

// 回车发送、Shift+回车换行。输入法组词期间的回车不能当发送 ——
// 中文用户按回车选词时会把半截词发出去。
function bindComposer(){
  const el = $("cin");
  let composing = false;
  el.addEventListener("compositionstart", () => { composing = true; });
  el.addEventListener("compositionend", () => { composing = false; });
  el.addEventListener("input", () => { autoGrow(el); paintSendBtn(); });
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !composing && !e.isComposing) {
      e.preventDefault(); sendChat();
    }
  });
}

// 对话气泡。与推理轨迹卡片刻意用不同的视觉语言 ——
// 轨迹是"系统在做事"，气泡是"人在说话"。

// 推理过程。看不见的推理和编造的区别，用户是分辨不出来的 —— 所以默认展开，
// 而不是折叠在一个"查看详情"后面。

// 推理轨迹的一行。**思考文字全文显示，不截断** —— 这个 tab 存在的理由就是
// 让人能核对它到底想了什么；截断的思考和没有思考一样不可核对。
function traceRow(x){

    <div class="trn">${x.n ?? "·"}</div>
    <div class="trb">
      ${x.thought ? `<div class="trt">${esc(x.thought)}</div>` : ""}
      ${x.tool ? `<div class="trc"><code>${esc(x.tool)}</code> ${esc(JSON.stringify(x.args || {}))}</div>` : ""}
      ${x.observation ? `<div class="tro">${esc(String(x.observation))}</div>` : ""}
    </div></div>`;
}


// 点流程节点，看它是从材料哪一行推出来的。证据链要能一路点回原文。
function flowCite(stageKey, idx){
  const fl = S.state?.flow;
  const ns = (fl.nodes||[]).filter(n => n.stage === stageKey);
  const n = ns[idx];
  if (!n) return;
  const box = document.getElementById("fcite");
  const ev = (n.evidence && n.evidence[0]) || (n.label?.evidence && n.label.evidence[0]);
  if (!n.grounded || !ev) {
    box.innerHTML = `<div class="fcite"><b>${esc(n.label?.value||"")}</b>
      <span class="fcw">这个节点是系统推断补上的，材料里没有直接依据 —— 落地前要跟客户确认。</span></div>`;
    return;
  }
  box.innerHTML = `<div class="fcite"><b>${esc(n.label?.value||"")}</b>
    <span class="fccode">${esc(n.code||"")}</span>
    <span class="ev" onclick="openSource('', '${earg(ev.cite||"")}')">◧ ${esc(ev.cite||"")}</span>
    ${ev.snippet ? `<div class="fcsnip">${esc(ev.snippet)}</div>` : ""}</div>`;
}

function stepsCard(){
  return `<div class="steps">${STEPS.map(x => `
    <div class="stp">
      <div class="stt">${esc(x.thought || "")}</div>
      ${x.tool ? `<div class="sto"><code>${esc(x.tool)}</code>
        ${esc(JSON.stringify(x.args || {}))}</div>` : ""}
      ${x.observation ? `<div class="stb">${esc(String(x.observation).slice(0,240))}</div>` : ""}
    </div>`).join("")}</div>`;
}


// 表格行的 render 是 "列名=值 | 列名=值" 的长串，直接吐出来要横向找半天。
// 拆成键值对之后，同一列在不同行是对齐的，扫一眼就知道哪个格子空着。

// 按 sheet 把切片分组。sheet 名从 locator 取，取不到就从 cite 里 `文件!sheet!行`
// 解析 —— cite 是权威的，locator 有时缺。
function groupBySheet(chunks){
  const map = new Map();
  for (const c of chunks) {
    let sheet = c.locator?.sheet || c.locator?.section;
    if (!sheet) {
      const m = String(c.cite||"").match(/!([^!]+)!/);
      sheet = m ? m[1] : (c.locator?.kind === "meta" ? "文档元数据" : "其它");
    }
    if (!map.has(sheet)) map.set(sheet, []);
    map.get(sheet).push(c);
  }
  return [...map.entries()].map(([sheet, rows]) => ({sheet, rows, shape: sheetShape(rows)}));
}

// 一眼看出这是什么表。纯前端启发式，只为导航 —— 真正的形状判定在后端 shape.py。
function sheetShape(rows){
  const txt = rows.slice(0, 8).map(r => r.text || "").join(" ");
  // 顺序即优先级：先判最特征化的，散文兜底放最后
  if (/文档元数据|abs_path|creator|last_modified/.test(txt)) return "文档元数据";
  if (/触发条件|输入.*输出|执行者|执行着/.test(txt)) return "流程说明";
  if (/[?？]|参考选项|澄清问题/.test(txt)) return "待填问卷";
  if (/\burl\b|openapi|\/v\d|接口路径/i.test(txt)) return "接口清单";
  if (/实体编码|实体名称|apiName|业务对象/.test(txt)) return "实体清单";
  if (rows.length && (rows[0].text||"").length > 60) return "规则/散文";
  return "";
}


// 三栏可调：会话栏收起、预览栏收起+拖拽调宽。宽度记进 localStorage，
// 下次打开还是上次的样子 —— 每次都手动拉一遍是折磨。
function toggleSidebar(){
  document.querySelector(".sidebar").classList.toggle("hidden");
}
function togglePreview(){
  const pv = document.getElementById("preview");
  const hidden = pv.classList.toggle("hidden");
  // bindResize 会把宽度写成**内联** style，内联样式盖过 .hidden 的 width:0 ——
  // 所以收起时必须清掉内联宽度，展开时再按保存值恢复，否则按钮点了没反应。
  if (hidden) {
    pv.style.width = ""; pv.style.flexBasis = "";
  } else {
    const saved = parseInt(localStorage.getItem("oc_pv_w") || "400", 10);
    const w = (saved >= 320 && saved <= 900) ? saved : 400;
    pv.style.width = w + "px"; pv.style.flexBasis = w + "px";
  }
  const ex = document.getElementById("prevExpand"); if (ex) ex.style.display = hidden ? "block" : "none";
  localStorage.setItem("oc_pv_hidden", hidden ? "1" : "");
}
function bindResize(){
  const pv = document.getElementById("preview");
  const drag = document.getElementById("pdrag");
  const saved = parseInt(localStorage.getItem("oc_pv_w") || "0", 10);
  // 收起状态优先：收起时别再写内联宽度（会盖过 .hidden 的 width:0）
  if (localStorage.getItem("oc_pv_hidden")) {
    pv.classList.add("hidden");
    const ex = document.getElementById("prevExpand"); if (ex) ex.style.display = "block";
  } else if (saved >= 320 && saved <= 900) {
    pv.style.width = saved + "px"; pv.style.flexBasis = saved + "px";
  }
  let dragging = false;
  drag.addEventListener("mousedown", e => {
    dragging = true; document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none"; e.preventDefault();
    // 拖动期间关掉宽度过渡，否则面板会吊在光标后面（见 body.dragging 那条 CSS）
    document.body.classList.add("dragging");
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    // 预览在最右，宽度 = 视口右缘到鼠标。夹在 [320, 900]。
    const w = Math.min(900, Math.max(320, window.innerWidth - e.clientX));
    pv.style.width = w + "px"; pv.style.flexBasis = w + "px";
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false; document.body.style.cursor = "";
    document.body.style.userSelect = "";
    document.body.classList.remove("dragging");
    localStorage.setItem("oc_pv_w", String(parseInt(pv.style.width, 10) || 400));
  });
}

function chunkBody(c){
  const t = String(c.text || "");
  if (!t.includes("=") || !t.includes("|")) return esc(t).slice(0, 600);
  const pairs = t.split("|").map(x => x.trim()).filter(Boolean);
  if (pairs.length < 2) return esc(t).slice(0, 600);
  return `<div class="kv">` + pairs.map(p => {
    const i = p.indexOf("=");
    if (i < 0) return `<div class="kvr"><span class="kvv">${esc(p)}</span></div>`;
    return `<div class="kvr"><span class="kvk">${esc(p.slice(0,i))}</span>
      <span class="kvv">${esc(p.slice(i+1))}</span></div>`;
  }).join("") + `</div>`;
}


// 正在思考。**必须在发出去的那一刻就出现**，不能等第一个 step 回来 ——
// 推理循环的第一次模型调用要好几秒，这几秒里界面纹丝不动的话，
// 用户会以为没发出去然后再点一次。

// 常驻动作栏。**这是产品的主干道** —— 上传材料之后，"接下来做什么"必须
// 一眼可见，而不是要用户猜该打什么字。
//
// 之前这里只有一个藏在空状态里的按钮：上传本身就产生了事件，空状态立刻消失，
// 于是材料传上去以后界面上一个入口都没有。
//
// 用户点按钮**本身就是确认**。确认闸是用来挡模型自作主张花钱的，不是用来
// 挡人的 —— 挡人只会让他多点一次，然后学会无脑点确定。
function paintActions(){
  const bar = $("abar");
  if (!S) { bar.innerHTML = ""; return; }
  const st = S.status, n = S.files || 0;
  const arts = S.state?.artifacts || [];
  const tpl = arts.find(a => a.endsWith(".xlsx"));
  const btns = [];

  if (["queued","parsing","extracting"].includes(st)) {
    btns.push(`<span class="apend"><i></i>正在梳理…</span>`);
    // 梳理在跑时也能停 —— 尤其当同时有对话在跑、组合按钮被对话占着的时候。
    btns.push(`<button class="abtn" onclick="stopRun()">■ ${t("composer.stop","停止")}</button>`);
  } else if (n && st !== "done") {
    btns.push(`<button class="abtn pri" onclick="startBuild()">开始梳理 ${n} 份材料</button>`);
  } else if (st === "done") {
    if (tpl) btns.push(`<a class="abtn pri" download
      href="${API}/api/sessions/${S.id}/artifacts/${encodeURIComponent(tpl)}">下载填写模板</a>`);
    btns.push(bundleLink("导出交付包", "abtn"));
    btns.push(`<button class="abtn" onclick="go('art')">全部产物</button>`);
    btns.push(`<button class="abtn" onclick="startBuild()">重新梳理</button>`);

// 轻量 markdown → HTML。**先转义再套用**，杜绝注入；只覆盖助手回答里常见的子集：
// 代码块 / 行内代码 / 加粗 / 标题 / 有序无序列表 / 换行。
function md(src){
  let s = esc(src || "");
  const stash = [];
  const keep = html => { stash.push(html); return `\x00${stash.length - 1}\x00`; };
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) =>
        keep(`<pre class="mdcode">${c.replace(/\n$/, "")}</pre>`));
  s = s.replace(/`([^`\n]+)`/g, (_, c) => keep(`<code class="mdik">${c}</code>`));
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // 斜体：**必须在加粗之后**，否则 ** 会被单星规则先吃掉。模型很爱用 *(补充说明)*，
  // 不认的话满篇星号。
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<em>$2</em>");

  const lines = s.split("\n");
  const out = [];
  const isRow = x => /^\s*\|.*\|\s*$/.test(x);
  const isSep = x => /^\s*\|[\s:|-]+\|\s*$/.test(x);
  const cells = x => x.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());

  // 列表用**栈**维护：模型写的是嵌套结构（一级编号下挂二级要点），原来只有一个
  // ul/ol 布尔量，遇到缩进的子项就先把父列表关掉再开一个新的 —— 层级全丢，
  // 还会切出空的编号项。栈按缩进深度开合，父子关系才留得住。
  const stack = [];                       // [{indent, tag}]
  const closeTo = n => { while (stack.length > n) out.push(`</${stack.pop().tag}>`); };

  for (let li = 0; li < lines.length; li++){
    const ln = lines[li];

    // ── 表格 ─────────────────────────────────────────────────────
    if (isRow(ln) && li + 1 < lines.length && isSep(lines[li + 1])){
      closeTo(0);
      const head = cells(ln), body = [];
      li += 2;
      while (li < lines.length && isRow(lines[li])){ body.push(cells(lines[li])); li++; }
      li--;
      out.push('<div class="mdtw"><table class="mdt"><thead><tr>'
        + head.map(c => `<th>${c}</th>`).join("")
        + '</tr></thead><tbody>'
        + body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")
        + '</tbody></table></div>');
      continue;
    }

    // ── 标题：#..###### 都认（原来只到 ###，#### 直接当正文显示出来）──
    let m = ln.match(/^\s*(#{1,6})\s+(.+?)\s*#*$/);
    if (m){ closeTo(0); out.push(`<div class="mdh">${m[2]}</div>`); continue; }

    // ── 分隔线 ───────────────────────────────────────────────────
    if (/^\s*(?:---+|\*\*\*+|___+)\s*$/.test(ln)){ closeTo(0); out.push('<hr class="mdhr">'); continue; }

    // ── 列表项（按缩进定层级）────────────────────────────────────
    m = ln.match(/^(\s*)(\d+[.)]|[-*+])\s+(.*)$/);
    if (m){
      const indent = m[1].replace(/\t/g, "    ").length;
      const tag = /\d/.test(m[2]) ? "ol" : "ul";
      const text = m[3].trim();
      while (stack.length && indent < stack[stack.length - 1].indent) closeTo(stack.length - 1);
      const top = stack[stack.length - 1];
      if (!top || indent > top.indent){
        out.push(`<${tag} class="mdl">`); stack.push({indent, tag});
      } else if (top.tag !== tag){
        closeTo(stack.length - 1);
        out.push(`<${tag} class="mdl">`); stack.push({indent, tag});
      }
      // 空条目（只有一个 "*" 或 "1." 的行）不产出 <li> —— 那正是界面上冒出
      // 空编号的来源。
      if (text) out.push(`<li>${text}</li>`);
      continue;
    }

    // 空行不关闭列表：模型常在父项和子项之间空一行，一关就断了父子关系。
    if (!ln.trim()){ out.push(""); continue; }
    closeTo(0); out.push(ln);
  }
  closeTo(0);
  s = out.join("\n");
  s = s.replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>");
  s = s.replace(/(<\/(?:ul|ol|pre|div|hr)>|<hr class="mdhr">)(?:<br>)+/g, "$1")
       .replace(/(?:<br>)+(<(?:ul|ol|pre|div|hr))/g, "$1")
       .replace(/(<(?:ul|ol)[^>]*>)(?:<br>)+/g, "$1")
       .replace(/(?:<br>)+(<\/(?:ul|ol)>)/g, "$1")
       .replace(/(<\/li>)(?:<br>)+/g, "$1");
  // 表格单元格里模型爱写字面量 <br> 换行；esc 之后成了可见的 &lt;br&gt;
  s = s.replace(/&lt;br\s*\/?&gt;/g, "<br>");
  return s.replace(/\x00(\d+)\x00/g, (_, i) => stash[i] ?? "");
}

// 助手回答的打字机流式呈现。后端一次性给完整 turn，这里在前端按段揭示 ——
// 「思考」气泡收起后，答案一段段流出来，而不是整块蹦出来。
function startStream(text){
  if (STREAM) clearInterval(STREAM.timer);
  // **按墙钟时间揭示，不按 tick 数。** 以前是每 tick 推进固定字数，而浏览器在
  // 标签页切走时会把 setInterval 节流到一秒甚至几秒一次 —— 实测切后台后 47 秒
  // 才推进 21/68 个字。用户回来看到的就是一条卡在半截的回答，只能刷新。
  // 改成按经过的时间算进度：无论 tick 多稀，到点就是全文。
  const DUR = 900;                       // 整段揭示时长（毫秒），与长度无关
  STREAM = { full: text || "", i: 0, timer: null, t0: Date.now() };
  try { render(); } catch (e) {}         // 首帧画不出来也要把流跑起来
  STREAM.timer = setInterval(() => {
    if (!STREAM){ return; }
    const p = Math.min(1, (Date.now() - STREAM.t0) / DUR);
    STREAM.i = Math.ceil(STREAM.full.length * p);
    const done = p >= 1;
    const timer = STREAM.timer;
    // 画这一帧。**整段包在 try 里**：渲染再怎么出错，也不能挡住下面的收尾 ——
    // 否则这条流永远结束不了，定时器一直空转。
    try {
      const el = [...document.querySelectorAll('.stream .bub.oc .mdbody')].pop();
      if (el){
        el.innerHTML = md(STREAM.full.slice(0, STREAM.i)) + (done ? "" : '<span class="cur"></span>');
      } else {
        // 找不到那个气泡就整体重画。**不能什么都不做** —— 直写 DOM 是个捷径，
        // 一旦没写上（气泡还没渲染、或被别的 render 换掉了），这条回答就永远
        // 停在半截，只有刷新页面才会出现。用户看到的正是这个。
        render();
      }
      const box = $("stream"); if (box) box.scrollTop = box.scrollHeight;
    } catch (e) { /* 这一帧没画上，下一帧再说；收尾照常走 */ }
    if (done){
      clearInterval(timer);
      STREAM = null;
      // 收尾重画一次，让最终文本落进正常渲染路径，而不是只躺在那次直写里。
      try { render(); } catch (e) {}
    }
  }, 16);
}

// 对话记录只能**按身份合并**，不能盲追加、更不能整体覆盖。两条真实的 bug 都出在
// 这一点上：
//
//   * 盲追加 → 每条消息两遍。/state 已经带回了完整的 dialogue，而 SSE 断线重连
//     固定用 ?since=0、从耐久事件表把同样的 chat.turn 再重放一遍。刷新一次就翻倍。
//   * 整体覆盖 → 回答被吞。question.updated/audit.applied 这类事件会触发一次
//     /state 重取，回来后 Object.assign 把整个 state 换掉；如果那次请求发出时
//     助手这一轮还没落库，回来的 dialogue 里就没有它，于是 SSE 刚推上来的回答被
//     覆盖掉 —— 屏幕上只剩追问 chips，刷新才看得到。
//
// 身份取 说话人+时间戳+正文：同一条消息无论从哪条路来，这三样都一样。
const turnKey = t => `${t.speaker}|${t.ts}|${t.text}`;

function addTurn(turn){
  const d = (S.state.dialogue = S.state.dialogue || {turns: []});
  const k = turnKey(turn);
  const i = d.turns.findIndex(x => turnKey(x) === k);
  if (i >= 0) { d.turns[i] = {...d.turns[i], ...turn}; return; }
  d.turns.push(turn);
  d.turns.sort((a, b) => (+a.ts || 0) - (+b.ts || 0));
  // 回执到了，撤掉对应的乐观占位
  if (turn.speaker === "user") PENDING = PENDING.filter(x => x.text !== turn.text);
}

//: 把服务端那份**权威**对话并进来，而不是拿它整体替换 —— 替换会丢掉此刻刚由
//  SSE 推上来、服务端那次查询还没看到的轮次。
function mergeTurns(serverTurns){
  for (const t of serverTurns || []) addTurn(t);
}

// /state 的对话位于 ``st.state.dialogue``，不是响应顶层。先保存远端对象，再做
// Object.assign；随后用一个新容器保留服务端 decisions/compactions 等元数据，并把
// 请求期间由 SSE 抵达的本地轮次与远端轮次合并。绝不能先清空 st.state.dialogue：
// S.state 与 st.state 在 assign 后是同一引用，那样会连远端快照一起抹掉。
function mergeStateSnapshot(st){
  const evs = S.events;
  const mine = [...(S.state?.dialogue?.turns || [])];
  const remote = st.state?.dialogue || {turns: []};
  Object.assign(S, st); S.events = evs;
  S.state = S.state || {};
  S.state.dialogue = {...remote, turns: []};
  mergeTurns(mine); mergeTurns(remote.turns);
}

function bubble(t){
  const me = t.speaker === "user";
  const tag = t.intent ? `<span class="itag${(t.confidence ?? 1) < 0.6 ? " low" : ""}">${esc(t.intent)}</span>` : "";
  let txt = t.text || "";
  // 正在流式的那条助手消息按当前进度截断
  if (!me && STREAM && txt === STREAM.full) txt = STREAM.full.slice(0, STREAM.i);
  const body = me
    ? esc(txt)
    : tag + `<div class="mdbody">${md(txt)}</div>`;
  return `<div class="bub ${me ? "me" : "oc"}"><div class="body"${t.pending ? ' style="opacity:.55"' : ""}>${body}</div></div>`;
}

function go(t){
  TAB = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === TAB));
  if (t === "q" && S) loadQuestions(); else paint();
