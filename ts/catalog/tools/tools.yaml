schema_version: 1

agent_scopes:
  readonly: [evidence.search, evidence.rows, oir.query, impact.trace, entity.compare, model.lint]
  extract: [evidence.search, evidence.rows, oir.query, profile.column]
  align: [evidence.search, evidence.rows, oir.query, profile.column, impact.trace, entity.compare]
  analyze: [evidence.search, evidence.rows, oir.query, profile.column, code.exec, impact.trace, entity.compare, model.lint]
  compile: [oir.query, code.exec, model.lint]
  converse: [evidence.search, evidence.rows, oir.query, profile.column, impact.trace, entity.compare, model.lint]
  interview: [evidence.search, evidence.rows, oir.query, impact.trace]
  process_model: [evidence.search, evidence.rows, oir.query, impact.trace]
  erp_map: [evidence.search, evidence.rows, oir.query, profile.column, impact.trace]
  rule_engineering: [evidence.search, evidence.rows, oir.query, impact.trace]
  data_governance: [evidence.search, evidence.rows, oir.query, profile.column, impact.trace, entity.compare, model.lint]
  delivery_review: [evidence.search, evidence.rows, oir.query, impact.trace, entity.compare, model.lint]
  decision_integration: [evidence.search, evidence.rows, oir.query, impact.trace, entity.compare, model.lint]
  requirements_engineering: [evidence.search, evidence.rows, oir.query, impact.trace]
  solution_architecture: [evidence.search, evidence.rows, oir.query, profile.column, impact.trace, model.lint]
  acceptance_testing: [evidence.search, evidence.rows, oir.query, impact.trace, model.lint]
  chat: [evidence.search, evidence.rows, oir.query, profile.column, impact.trace, entity.compare, model.lint]

access_profiles:
  dialogue_both: [converse, chat]
  dialogue_work: [converse]

tools:
  - { name: evidence.search, assembly: core, family: evidence, danger: READ, access: agent_scopes, availability: evidence, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "按关键词找相关证据并引用；按行号或位置读原文用 evidence.rows，不把相关度片段当成完整数据集。" }
  - { name: evidence.rows, assembly: core, family: evidence, danger: READ, access: agent_scopes, availability: evidence, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "按文件位置、行号或章节取原文；不做关键词检索，也不用于把整张上传表展示给用户。" }
  - { name: oir.query, assembly: core, family: ontology, danger: READ, access: agent_scopes, availability: oir, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "分页检索当前 Ontology 的结构化元素；原材料正文和面向用户的完整展示不走这里。" }
  - { name: impact.trace, assembly: core, family: ontology, danger: READ, access: agent_scopes, availability: oir, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "回答拟修改会牵连什么；不用于复述已经发生的历史版本差异。" }
  - { name: entity.compare, assembly: core, family: ontology, danger: READ, access: agent_scopes, availability: oir, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "临时逐字段比较两个指定模型实体；不枚举全部冲突，比较结果也不能代替合并确认。" }
  - { name: model.lint, assembly: core, family: ontology, danger: READ, access: agent_scopes, availability: oir, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "只检查当前 Ontology 的确定性结构病灶；不判断材料充分性或最终发布资格。" }
  - { name: profile.column, assembly: core, family: profile, danger: READ, access: agent_scopes, availability: profiles_nonempty, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "检查单列的跨行分布、类型和空值；只看几行原文或展示整表不用它。" }
  - { name: code.exec, assembly: core, family: sandbox, danger: COMPUTE, access: agent_scopes, availability: sandbox, implementation: ts/src/server/glue/tools.ts, status: active, routing_prompt: "仅做现有确定性工具无法完成的隔离计算；无网络，不得绕过产品写入工具或权限边界。" }

  - { name: web.search, assembly: dialogue, family: web, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只检索公开外部资料和时效事实；非中国限定的行业资料默认用英文查询和 scope=global，中国本地资料才用 regional；provider 非 Google 时不得声称来自 Google；不得把客户材料原文或敏感信息外发。" }
  - { name: web.read, assembly: dialogue, family: web, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只读取本轮 web.search 返回的 source_id；不接受任意 URL，也不用于读取用户上传材料。" }
  - { name: material.list, assembly: dialogue, family: material, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只看材料清单和解析状态；看结构用 material.inspect，找正文用 evidence.search，列整表用 material.rows。" }
  - { name: document.list, assembly: dialogue, family: document, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "查看当前项目知识库有哪些长期文档、采用版本和解析状态；当前会话临时上传材料用 material.list。" }
  - { name: document.search, assembly: dialogue, family: document, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "用户问项目历史材料或当前会话证据不足时，自动检索项目知识库；只说明本次命中，空结果不能证明项目材料中不存在。" }
  - { name: document.open, assembly: dialogue, family: document, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "按 document.search 返回的精确 evidence_ref 打开原文及邻近内容；不得按文件名猜版本，也不接受本机路径或任意 URL。" }
  - { name: document.history, assembly: dialogue, family: document, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "查看一个项目文档的不可变版本历史、采用版与解析状态；正文内容用 document.open。" }
  - { name: document.attach, assembly: dialogue, family: document, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "把知识库里的精确版本固定到当前会话供后续梳理；用户要求使用项目文档时可执行，新版本出现也不得静默替换。" }
  - { name: document.detach, assembly: dialogue, family: document, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "停止让当前会话使用某个知识库文档；只解除会话引用，不归档、不删除项目文档。" }
  - { name: document.promote, assembly: dialogue, family: document, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "仅在用户明确要求保存时，把当前会话已上传的原文件存入项目知识库并建立不可变版本；模型摘要不能冒充原文件入库。" }
  - { name: document.promote_batch, assembly: dialogue, family: document, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "用户说「把这些／全部材料收进知识库」时，一次把本次会话里所有还没入库的原文件存进去；名单在确认那一刻定死，不能自己增减，也不能用它替代逐份指定的 document.promote。" }
  - { name: document.manage, assembly: dialogue, family: document, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/document_tools.ts, status: active, routing_prompt: "仅按用户明确指令修改文档标题、标签、分类、采用版本或归档状态；不能永久删除文档，也不能扩大访问权限。" }
  - { name: template.query, assembly: dialogue, family: template, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只读取当前填写模板结构；修改用 template.edit，生成下载文件用 template.recompile 或 export.file。" }
  - { name: ui.table, assembly: dialogue, family: ui, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "向用户完整展示梳理产物；原始上传表用 material.rows，内部分页分析用 oir.query。" }
  - { name: question.next, assembly: dialogue, family: question, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "读取已经生成并排序的问题台账；不负责新建问题，也不记录用户回答。" }
  - { name: question.answer, assembly: dialogue, family: question, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "仅在当前消息明确回答了稳定 question_id 时写入；当前作答即授权，无需再二次确认，自由口径约定用 decision.record。" }
  - { name: export.file, assembly: dialogue, family: export, danger: WRITE_LOCAL, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "把已经存在或刚展示的内容导成文件；不负责生成缺失产物，必须按用户所指内容选择正确 source。" }
  - { name: material.parse, assembly: dialogue, family: material, danger: WRITE_LOCAL, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只为材料内容问答或检索建立索引；不生成 Ontology、流程图或模板，图片和扫描件需明确 ocr=true。" }
  - { name: data.transform, assembly: dialogue, family: data, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只整理已上传表格并产出新 CSV，不改 OIR 或流程；超出声明式动词集的需求不能用它硬凑。" }
  - { name: readiness.report, assembly: dialogue, family: readiness, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "在完整梳理前判断材料是否够用；梳理后的交付门禁用 release.check，结构病灶用 model.lint。" }
  - { name: asset.recall, assembly: dialogue, family: memory, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "查找并重新展示已经上传或生成的图片、材料、问题清单、文档、聊天表格和网页素材；不会重新生成。材料正文用 evidence.search，业务口径用 memory.recall。" }
  - { name: memory.recall, assembly: dialogue, family: memory, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "查跨会话的项目语义记忆；当前两版实际改动用 revision.diff，明确拍板记录用 decision.query。" }
  - { name: material.inspect, assembly: dialogue, family: material, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只看一份材料的结构目录和解析问题；正文检索用 evidence.search，完整表格用 material.rows。" }
  - { name: material.rows, assembly: dialogue, family: material, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "完整展示用户上传表格的原始行；梳理产物用 ui.table，语义证据检索用 evidence.search。" }
  - { name: session.status, assembly: dialogue, family: session, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "回答会话进度和总体状态；材料充分性、交付门禁、版本差异应分别用对应专用工具。" }
  - { name: events.query, assembly: dialogue, family: events, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "查运行事件、失败和卡点；不用于回答业务决定、模型内容或版本改动。" }
  - { name: conflict.query, assembly: dialogue, family: conflict, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "读取系统已经检出的冲突；临时比较两个指定实体用 entity.compare。" }
  - { name: decision.query, assembly: dialogue, family: decision, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "查询本会话明确拍过的板；跨会话语义记忆用 memory.recall，产物改动用 revision.diff。" }
  - { name: release.check, assembly: dialogue, family: release, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "在已有产物后检查能否交付；开始梳理前的材料充分性用 readiness.report。" }
  - { name: decision.patch.preview, assembly: dialogue, family: decision, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "在回答统一问题前只读预览已有确定性 effect；查已落账补丁用 decision.patch.query，真正回答须由用户明确触发 question.answer。" }
  - { name: decision.patch.query, assembly: dialogue, family: decision, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "查统一 Decision/Revision 台账中已记录的补丁事实；回答前预演用 decision.patch.preview，本工具绝不应用或重放补丁。" }
  - { name: requirements.query, assembly: dialogue, family: requirements, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "查专业 Engagement 已产出的范围、验收标准、规则和统一问题；查某条显式依赖与证据链用 requirements.trace。" }
  - { name: requirements.trace, assembly: dialogue, family: requirements, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "按 requirements.query 返回的精确 ref 查显式证据与上下游引用；不做名称相似度猜测，也不生成缺失需求。" }
  - { name: architecture.query, assembly: dialogue, family: architecture, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "查 ARCHITECTURE 的候选组件、fit-gap、集成契约与风险；无节点才回退 ERP_MAP，不生成新建议，DRAFT/UNKNOWN 保持原状。" }
  - { name: acceptance.test.query, assembly: dialogue, family: acceptance, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "查 TEST_PLAN 已设计的验收用例；无节点才回退规则用例，汇总缺口用 acceptance.coverage，本工具不执行测试。" }
  - { name: acceptance.coverage, assembly: dialogue, family: acceptance, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "统计 TEST_PLAN 的需求追溯与设计覆盖；看具体用例用 acceptance.test.query，不把 READY_FOR_REVIEW 或覆盖率说成执行通过。" }
  - { name: signoff.package, assembly: dialogue, family: signoff, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/fde_tools.ts, status: active, routing_prompt: "准备人工审阅包或查询已有 HUMAN_ACCEPTANCE；只读且不记录签名，READY_FOR_HUMAN_REVIEW 不等于已签署。" }
  - { name: revision.diff, assembly: dialogue, family: revision, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "比较快照之间已经发生的实际变化；拟修改的未来影响用 impact.trace，语义回忆用 memory.recall。" }
  - { name: flow.query, assembly: dialogue, family: flow, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "读取当前产物中的实证流程；参考草图用 sketch.query，路径演练用 flow.walk。" }
  - { name: flow.issues, assembly: dialogue, family: flow, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "诊断当前流程结构缺口；读取已排序的跨域访谈问题用 question.next。" }
  - { name: flow.walk, assembly: dialogue, family: flow, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "演练或枚举当前产物流程的路径；不修改流程，也不分析参考草图或版本差异。" }
  - { name: decision.record, assembly: dialogue, family: decision, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只记录用户当前明确拍板的自由口径、命名或范围；有稳定 question_id 的回答用 question.answer，提问不入账。" }
  - { name: suggestion.apply, assembly: dialogue, family: decision, danger: EXTERNAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "仅在刚用 session.status 核对序号且用户明确确认后执行；操作不可逆，不能凭标题或旧序号猜。" }
  - { name: draft.initialize, assembly: dialogue, family: draft, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "无客户材料时初始化完整通用 Ontology 草案；只要视觉参考图用 flow.sketch，已有参考图转正用 draft.adopt。" }
  - { name: oir.undo, assembly: dialogue, family: ontology, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只撤销最后一次人工 OIR 编辑；流程和模板分别用 flow.undo、template.undo。" }
  - { name: oir.add, assembly: dialogue, family: ontology, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "新增 OIR 对象、属性、关系、Action、规则或枚举；Event 用 flow.edit，修改已有元素用 oir.edit。" }
  - { name: oir.edit, assembly: dialogue, family: ontology, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "修改、合并、标记或移除已有 OIR 元素；新增用 oir.add，合并或破坏性修改前先用 impact.trace。" }
  - { name: build.start, assembly: dialogue, family: build, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只在用户明确要完整 Ontology、流程和模板交付时启动；材料内容问答用 material.parse，只看流程用 flow.preview。" }
  - { name: flow.edit, assembly: dialogue, family: flow, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "修改当前产物流，Event 也在这里维护；参考图尚未转正时先 draft.adopt，OIR 实体改动用 oir.add 或 oir.edit。" }
  - { name: flow.undo, assembly: dialogue, family: flow, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "只撤销最后一次产物流编辑；OIR 和模板分别用 oir.undo、template.undo。" }
  - { name: flow.preview, assembly: dialogue, family: flow, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "从已上传材料只生成实证流程预览；没有材料时用 flow.sketch，需要完整交付时用 build.start。" }
  - { name: flow.render, assembly: dialogue, family: flow, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "用户明确要图片/生图/Image 2/视觉版/PPT/好看时，用图像模型渲染当前正式流程或参考草图；每次必须传具体 style，换风格时 style 必须不同，并把配色/方向/补充要求传入 theme/layout/visual_brief；成功后同轮不得用相同参数重复调用；没结构时先 flow.sketch 再直接调本工具，不为出图 draft.adopt；只要 SVG/Mermaid 时不调。" }
  - { name: draft.adopt, assembly: dialogue, family: draft, danger: WRITE_LOCAL, access: dialogue_work, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "仅在用户明确采纳时把参考草图转成通用 DRAFT；只为调 flow.render 出视觉图不得转正；有客户材料时走真实梳理。" }
  - { name: sketch.query, assembly: dialogue, family: sketch, danger: READ, access: dialogue_both, availability: always, implementation: ts/src/server/dialogue/tools.ts, status: active, routing_prompt: "读取本会话参考草图的完整结构；当前产物流用 flow.query，还没有草图时用 flow.sketch。" }
