[project]
name = "ontocopilot"
version = "0.1.0"
description = "OntoCopilot — 面向 FDE 的本体建模副驾"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-docx>=1.1",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openpyxl>=3.1",
    "sqlglot>=25.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Postgres 是**可选依赖**。没配 DATABASE_URL 的部署、以及现有 244 个测试，
# 一行 SQLAlchemy 都不 import —— store.repo.MemoryRepo 只用标准库。
postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30"]
# aiosqlite 只给测试：仓储用例在 SQLite 内存库上跑第二遍，
# 用来证明两个实现行为一致。不需要容器。
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7",
       "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20"]

[project.scripts]
ontocopilot = "ontocopilot.cli:main"
ontocopilot-server = "ontocopilot.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontocopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 默认**排除**需要真 Postgres 的用例 —— `pytest` 在一台没装 Docker 的笔记本上
# 必须能直接跑绿。CI 里起完库再 `pytest -m postgres` 跑第二遍。
addopts = "-q -m 'not postgres'"
markers = [
    "postgres: 需要真 Postgres（读 TEST_DATABASE_URL）。默认不跑，CI 里单独跑。",
]

[tool.ruff]
line-length = 100
target-version = "py312"
