[project]
name = "ontocopilot"
version = "0.1.0"
description = "OntoCopilot — 面向 FDE 的本体建模副驾"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-docx>=1.1",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openpyxl>=3.1",
    "sqlglot>=25.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pymupdf>=1.24",
    # 零配置本地模式承诺的是持久 SQLite；驱动若只存在于 dev extra，正式安装
    # 会在用户不知情时退成内存并于重启后丢数据。
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Postgres 是**可选依赖**。没配 DATABASE_URL 的部署使用基础依赖中的
# SQLAlchemy + aiosqlite；显式内存模式则仍由 store.repo.MemoryRepo 提供。
postgres = ["asyncpg>=0.30"]
# 开发依赖只保留测试与静态检查工具；SQLAlchemy/aiosqlite 已是基础依赖，
# 因为零配置运行模式本身承诺使用持久 SQLite，而不只是测试替身。
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
ontocopilot = "ontocopilot.cli:main"
ontocopilot-server = "ontocopilot.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontocopilot"]

[tool.hatch.build.targets.wheel.force-include]
# 单文件 Web 工作台也是产品运行时，不是仓库里的开发附件。wheel 内放进包目录，
# server 同时支持源码 checkout 与安装后的两种位置。
"ui/index.html" = "ontocopilot/ui/index.html"
# PostgreSQL 迁移是服务端的运行时资产；安装 wheel 后仍必须能执行
# ``python -m ontocopilot.store.migrate``，不能要求旁边恰好还有源码仓库。
"migrations" = "ontocopilot/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 默认**排除**需要真 Postgres 的用例 —— `pytest` 在一台没装 Docker 的笔记本上
# 必须能直接跑绿。CI 里起完库再 `pytest -m postgres` 跑第二遍。
addopts = "-q -m 'not postgres'"
markers = [
    "postgres: 需要真 Postgres（读 TEST_DATABASE_URL）。默认不跑，CI 里单独跑。",
]

[tool.ruff]
line-length = 100
target-version = "py312"
